# MONO LINK:// の門番。「Deploy to Cloudflare」ボタンで置くと、KV（DB）は自動で作られます
name = "mono-link"
main = "worker.js"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "DB"

# いまラウンジにいる人を覚える部屋（無料プランで使える SQLite の Durable Object）
[[durable_objects.bindings]]
name = "LOUNGE"
class_name = "Lounge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lounge"]

# 英語の字幕・コメントの翻訳に使う Cloudflare の Workers AI
[ai]
binding = "AI"
