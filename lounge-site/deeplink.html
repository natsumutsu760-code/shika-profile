<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEP LINK</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
  /* DEEP LINK/:（ラウンジの PC から入る、MONO LINK:// の「裏側」のサイト）の見本。鹿さんの決め、2026-10-22：あやしい端末（黒い画面に光る文字）
     商人 5 人 ＋ アメジストの特別ショップ ＋ みんなの依頼（ユーザーどうし）。友好度はタスクで大きく、売り買いで少しずつ上がる
     データは deeplink.js。?go=商人の id・special・board で開く（&tab=shop で ショップから）。&boot=0 で起動の文字を飛ばす。押すと見本の中だけで動く（保存しない） */
  :root {
    --pd-bg:#120D22; --pd-fg:#FFE4B8; --pd-line:rgba(255,181,71,.5);   /* スマホの 下の 引き出しの 色 */
    --bg:#0B0816; --bg2:#120D22; --line:rgba(255,181,71,.26); --line2:rgba(255,181,71,.5);
    --amber:#FFB547; --dim:#B98A4E; --text:#FFE4B8; --cyan:#46D4FF; --violet:#B79BFF; --ok:#7CF0B0; --ng:#FF6B78;
    --glow:0 0 6px rgba(255,181,71,.45); --f:"DotGothic16", "Hiragino Kaku Gothic ProN", monospace;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 90% at 50% 0%, #1A1230 0%, var(--bg) 60%); color:var(--text); font:400 16px/1.75 var(--f); word-break:auto-phrase; text-wrap:pretty; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:9; background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px), radial-gradient(130% 100% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%); }
  button { font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; }
  button:disabled { cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  h1, h2, h3, p, ul { margin:0; padding:0; } ul { list-style:none; }
  .crt { max-width:1100px; margin:0 auto; padding:18px clamp(14px, 3vw, 28px) 40px; }

  /* 上：ロゴとさいふ。ロゴの文字が、このサイトでいちばん目立つ所 */
  .bar { display:grid; grid-template-columns:auto 1fr auto; gap:6px 18px; align-items:end; padding-bottom:12px; border-bottom:1px solid var(--line2); }
  .bar > .lgb { grid-column:3; grid-row:2; }   /* EN は お金の 下（2026-11-05：まん中で 1 行 つかって いた） */
  .logo { font:400 clamp(30px, 5vw, 46px)/1 var(--f); color:var(--amber); letter-spacing:.04em; text-shadow:var(--glow), 2px 0 0 rgba(70,212,255,.35), -2px 0 0 rgba(255,107,120,.3); white-space:nowrap; }
  .logo span { color:var(--violet); }
  .logo i { display:inline-block; width:.5em; height:.9em; margin-left:6px; vertical-align:-.08em; background:var(--amber); box-shadow:var(--glow); animation:blink 1s steps(1) infinite; }
  .from { grid-column:2; grid-row:1; color:var(--dim); font-size:13px; align-self:center; }
  .wallet { grid-column:3; grid-row:1; display:flex; gap:16px; font-size:13px; color:var(--dim); white-space:nowrap; }
  .wallet b { font-weight:400; font-size:22px; margin-left:4px; text-shadow:0 0 6px currentColor; }
  .wallet .b b { color:var(--cyan); } .wallet .r b { color:var(--violet); }

  /* 起動の文字（いちどだけ） */
  .boot { padding:22px 2px; color:var(--amber); text-shadow:var(--glow); min-height:140px; }
  .boot p { white-space:pre; } .boot p.ok { color:var(--ok); }
  .ready .boot { display:none; }
  .term { display:none; grid-template-columns:240px minmax(0, 1fr); margin-top:14px; border:1px solid var(--line2); background:rgba(18,13,34,.72); }
  .ready .term { display:grid; animation:on .35s steps(4); }

  /* 左：商人の一覧（えらんでいる所は、文字と背景が入れかわる） */
  .dir { border-right:1px solid var(--line); padding:12px 0; }
  .dir .pr { padding:4px 14px; color:var(--dim); font-size:13px; }
  .dir button, .dir a.go { width:100%; display:grid; grid-template-columns:28px minmax(0, 1fr) auto; gap:8px; align-items:center; padding:6px 14px; text-align:left; }
  .dir a.go { color:inherit; text-decoration:none; box-sizing:border-box; } .dir a.go .mk { color:var(--cyan); } .dir a.go small { font-size:12px; color:var(--dim); } .dir a.go:hover { background:rgba(255,181,71,.1); }   /* クローラーの 入口（ほかの 画面へ とぶ） */
  .dir button .mk { color:var(--amber); } .dir button .mk img { display:block; width:28px; height:28px; object-fit:cover; object-position:50% 18%; border-radius:6px; background:rgba(255,181,71,.12); } .dir button small { font-size:12px; color:var(--dim); }
  .dir button .new, .dir a.go .new { color:var(--ok); font-size:12px; }
  .pd-bar .mk img { display:block; width:28px; height:28px; object-fit:cover; object-position:50% 18%; border-radius:6px; } .pd-bar .new { color:var(--ok); } .pd-bar .mk { color:var(--amber); }
  .dir button[aria-current="true"] { background:var(--amber); color:var(--bg); text-shadow:none; }
  .dir button[aria-current="true"] .mk, .dir button[aria-current="true"] small, .dir button[aria-current="true"] .new { color:var(--bg); }
  .dir button:hover:not([aria-current="true"]) { background:rgba(255,181,71,.1); }
  .dir .sp .mk, .dir .sp .nm { color:var(--violet); } .dir button[aria-current="true"] .nm { color:var(--bg); }
  .pips { letter-spacing:-1px; }
  .emo { display:grid; place-items:center; width:100%; height:100%; font-size:20px; line-height:1; } .cam .emo { font-size:44px; }   /* 顔の 絵が まだ ない 商人 */
  /* 物語（プライマリータスク）：いまの 1 つを 大きく */
  .pri { margin-top:14px; padding:14px 16px; border:1px solid var(--line2); background:rgba(255,181,71,.05); display:grid; gap:6px; }
  .pri .ch { font-size:13px; color:var(--dim); } .pri .q { color:var(--text); } .pri .q::before { content:"＞ "; color:var(--dim); }
  .pri .do { font-size:18px; color:var(--amber); text-shadow:var(--glow); }
  .pri .prog { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--dim); } .pri .prog i { flex:0 0 160px; height:6px; border:1px solid var(--line); } .pri .prog i b { display:block; height:100%; background:var(--dim); }
  .pri .prog.full { color:var(--ok); } .pri .prog.full i b { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .pri .sub { font-size:13px; color:var(--dim); } .pri .f { margin-top:4px; }
  .inswait { margin:8px 0 0; font-size:13px; color:var(--cyan); } .pri .inswait { margin:0; }
  .pri.stop .do { font-size:15px; color:var(--warn, #FF8A7A); text-shadow:none; }
  .chs { margin-top:12px; font-size:13px; color:var(--dim); } .chs summary { cursor:pointer; } .chs li { display:flex; justify-content:space-between; gap:12px; padding:4px 2px; border-bottom:1px dashed var(--line); }
  .chs small { display:block; color:var(--warn, #FF8A7A); font-size:11px; text-align:right; }
  .rep .cap { color:var(--warn, #FF8A7A); }

  /* 右：えらんだ商人 */
  .pane { padding:16px 20px 22px; min-width:0; }
  .who { display:grid; grid-template-columns:auto minmax(0, 1fr) auto; gap:14px; align-items:center; }
  .who .mk { width:56px; height:56px; display:grid; place-items:center; border:1px solid var(--line2); font-size:28px; color:var(--amber); text-shadow:var(--glow); background:repeating-linear-gradient(45deg, rgba(255,181,71,.06) 0 4px, transparent 4px 8px); }
  .who.sp .mk { color:var(--violet); border-color:rgba(183,155,255,.5); }
  /* 商人の 顔：通話の 画面のように（くらい背景に 横じま） */
  .cam { position:relative; width:76px; height:76px; border:1px solid var(--line2); background:radial-gradient(circle at 50% 35%, #2A2140 0, #120D22 75%); overflow:hidden; }
  .cam img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; transform:scale(1.25); transform-origin:50% 20%; }
  .cam::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); pointer-events:none; }
  .who.sp .cam { border-color:rgba(183,155,255,.5); }
  .who h2 { font:400 24px/1.2 var(--f); color:var(--amber); text-shadow:var(--glow); } .who.sp h2 { color:var(--violet); }
  .who p { color:var(--dim); font-size:13px; }
  .rep { text-align:right; font-size:13px; color:var(--dim); white-space:nowrap; }
  .rep b { font-weight:400; color:var(--text); font-size:16px; }
  .meter { display:block; width:150px; height:8px; margin-top:4px; margin-left:auto; border:1px solid var(--line2); }
  .meter i { display:block; height:100%; background:var(--amber); box-shadow:var(--glow); transition:width .4s steps(6); }
  .say { margin:12px 0 14px; color:var(--text); }
  .say::before { content:"＞ "; color:var(--dim); }
  .tabs { display:flex; gap:0; border-bottom:1px solid var(--line); }
  .tabs button { padding:6px 16px; border:1px solid transparent; border-bottom:0; color:var(--dim); }
  .tabs button[aria-selected="true"] { color:var(--amber); border-color:var(--line); background:var(--bg2); margin-bottom:-1px; text-shadow:var(--glow); }

  .rows > li { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:4px 16px; align-items:center; padding:12px 2px; border-bottom:1px dashed var(--line); }
  .rows .t { min-width:0; }
  .rows .kd { display:inline-block; margin-right:8px; padding:0 6px; border:1px solid var(--line2); font-size:12px; color:var(--amber); }
  .rows .sub { display:block; font-size:13px; color:var(--dim); }
  .rows .prog { display:flex; align-items:center; gap:8px; margin-top:4px; font-size:13px; color:var(--dim); }
  .rows .prog i { flex:0 0 120px; height:6px; border:1px solid var(--line); } .rows .prog i b { display:block; height:100%; background:var(--dim); }
  .rows .prog.full { color:var(--ok); } .rows .prog.full i b { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .rw { color:var(--text); font-size:13px; } .rw .c { color:var(--cyan); } .rw .v { color:var(--violet); } .rw .g { color:var(--ok); } .rw .k { color:var(--amber, #F2C14E); font-weight:800; }
  .rows li.done { opacity:.5; } .rows li.done .kd { border-style:dashed; }
  .rows .by { display:flex; align-items:center; gap:6px; margin:0 0 4px; font-size:13px; color:var(--dim); } .rows .by svg { width:16px; height:16px; flex:none; color:var(--cyan); }
  .rows .by b { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:15px; font-weight:400; color:var(--cyan); text-shadow:0 0 6px rgba(70,212,255,.45); }
  .price .stock { display:block; margin-top:2px; font-size:11px; color:var(--dim); text-shadow:none; } .price .stock.out { color:var(--warn, #FF8A7A); }
  .rows .no { display:block; margin-bottom:3px; font-size:11px; color:var(--dim); letter-spacing:.04em; }
  .rows .kd.found { margin:0 0 0 8px; color:var(--dim); border-style:dashed; vertical-align:1px; }
  .rows .cond { display:block; margin-top:3px; font-size:12px; color:var(--warn, #FF8A7A); }
  .rows .kd.tool { margin:0 0 0 8px; color:var(--cyan); border-color:rgba(70,212,255,.45); vertical-align:1px; }
  .price { white-space:nowrap; text-align:right; } .price .c { color:var(--cyan); text-shadow:0 0 6px rgba(70,212,255,.5); } .price .v { color:var(--violet); text-shadow:0 0 6px rgba(183,155,255,.5); }
  .lock { color:var(--ng); font-size:12px; }
  .act { justify-self:end; display:flex; align-items:center; gap:10px; }
  .btn { padding:4px 12px; border:1px solid var(--amber); color:var(--amber); white-space:nowrap; }
  .btn::before { content:"[ "; } .btn::after { content:" ]"; }
  .btn:hover:not(:disabled), .btn:focus-visible { background:var(--amber); color:var(--bg); }
  .btn:disabled { border-color:var(--line); color:var(--dim); }
  .note { margin-top:14px; font-size:13px; color:var(--dim); }

  /* みんなの依頼 */
  .post { margin-top:16px; padding:12px 14px; border:1px dashed var(--line2); display:grid; gap:8px; }
  .post h3 { font:400 15px/1.4 var(--f); color:var(--amber); }
  /* スフィアの 鑑定の 結果の 小窓（2026-11-08 鹿さん「その場で結果のポップアップを出すように」）。★4 から 目立たせる */
  #lkd { width:min(420px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; padding:0; border:1px solid var(--amber); background:var(--bg2); color:var(--text); box-shadow:0 0 0 1px rgba(255,181,71,.2), 0 20px 60px rgba(0,0,0,.6); font:400 15px/1.6 var(--f); }
  #lkd::backdrop { background:rgba(5,3,12,.72); }
  #lkd .lkd-b { display:grid; gap:12px; padding:18px 18px 16px; }
  #lkd h3 { margin:0; font:400 20px/1.3 var(--f); color:var(--amber); text-shadow:var(--glow); }
  #lkd .lkd-sub { margin:-8px 0 0; font-size:13px; color:var(--dim); }
  #lkd ul { list-style:none; margin:0; padding:0; display:grid; gap:6px; max-height:52vh; overflow:auto; }
  #lkd li { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:2px 10px; padding:8px 10px; border:1px solid var(--line); background:rgba(255,181,71,.04); }
  #lkd .lkd-st { grid-row:span 2; width:3.2em; font-size:14px; letter-spacing:-1px; color:var(--dim); white-space:nowrap; }
  #lkd .lkd-op { font-size:16px; color:var(--text); }
  #lkd .lkd-fx { grid-column:2; font-size:13px; color:var(--dim); }
  #lkd .lkd-n { grid-row:span 2; grid-column:3; grid-row-start:1; font-size:15px; color:var(--amber); }
  #lkd li.s4 { border-color:var(--amber); box-shadow:inset 0 0 12px rgba(255,181,71,.18); } #lkd li.s4 .lkd-st { color:var(--amber); text-shadow:var(--glow); }
  #lkd li.s5 { border-color:var(--violet); box-shadow:inset 0 0 14px rgba(183,155,255,.25); } #lkd li.s5 .lkd-st, #lkd li.s5 .lkd-op { color:var(--violet); text-shadow:0 0 6px rgba(183,155,255,.6); }
  #lkd .lkd-left { margin:0; font-size:13px; color:var(--warn, #FF8A7A); }
  #lkd .lkd-f { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  #lkd .lkd-f a { color:var(--amber); font-size:14px; } #lkd .lkd-f .btn { margin-left:auto; }
  /* スフィアの 鑑定：1 行（見出し・まだの 数・1 こ／ぜんぶ・値・ボタン。スマホでは 2 行に 折れる） */
  .post .lk { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; } .post .lk .lk-n { margin-right:auto; font-size:14px; color:var(--text); }
  .seg { display:inline-flex; border:1px solid var(--line2); } .seg button { min-height:32px; padding:0 12px; font-size:14px; color:var(--dim); } .seg button + button { border-left:1px solid var(--line2); }
  .seg button[aria-pressed="true"] { background:rgba(255,181,71,.14); color:var(--amber); text-shadow:var(--glow); } .post .lk .btn { min-height:32px; }
  @media (max-width:760px) { .post .lk { gap:6px 10px; } .post .lk .lk-cu { display:none; } }   /* スマホは 値の「クレジット」を 出さず（水色が クレジット）1 こ／ぜんぶ・値・ボタンを 1 行に */
  .post.au a.btn { text-decoration:none; min-height:32px; display:inline-flex; align-items:center; }   /* 競り・フリマの 入口 */
  .post .f { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; color:var(--dim); }
  .post select, .post input { font:inherit; font-size:14px; color:var(--text); background:var(--bg); border:1px solid var(--line2); padding:3px 6px; }
  .post input { width:64px; }
  .post .c { color:var(--cyan); } .post.mine { border-style:solid; } .post .mrow { font-size:14px; color:var(--text); }
  .post input.free { width:min(100%, 16em); }
  /* 門番に つないだ 分：えらんで 買う・売る・交換の パネル */
  .rows li.pnl { display:block; } .rows li.pnl .post { margin-top:0; }
  /* 売る：しゅるいの タブ ＋ 1 行ずつ（絵・名前・持って いる 数と 値段・− 数 ＋ 全）。中で スクロール しない */
  .stabs { margin:2px 0 4px; } .stabs button { padding:5px 12px; font-size:14px; } .stabs button:disabled { opacity:.35; } .stabs em { font-style:normal; color:var(--cyan); }
  .sellrow { display:grid; grid-template-columns:22px minmax(0, 1fr) auto; gap:8px; align-items:center; padding:3px 6px; font-size:14px; color:var(--text); border-left:2px solid transparent; }
  .sellrow.on { border-left-color:var(--amber); background:rgba(255,190,90,.06); }
  .sellrow img { width:22px; height:22px; image-rendering:pixelated; }
  .sellrow .nm { min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 8px; } .sellrow small { color:var(--dim); font-size:12px; }
  .sellrow .st { display:flex; align-items:center; gap:4px; } .sellrow b { min-width:2em; text-align:center; color:var(--amber); font-weight:400; }
  .sellrow .sn { width:56px; min-height:32px; text-align:center; color:var(--amber); padding:2px 4px; }   /* 売る 数を 打ちこむ 欄（鹿さんの 頼み、2026-11-07） */
  .sellrow .sn::-webkit-inner-spin-button, .sellrow .sn::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; } .sellrow .sn { -moz-appearance:textfield; appearance:textfield; }   /* 上下の 矢印は 出さない（となりに − ＋ が ある） */
  .sellrow .btn { padding:3px 0; width:30px; text-align:center; } .sellrow .btn::before, .sellrow .btn::after { content:none; }   /* 数の ボタンは かっこ なしで 小さく（名前が つぶれない ように） */
  .sellrow .nm { line-height:1.3; } .sellrow .nm small:last-child { flex-basis:100%; }
  .sells { display:grid; gap:1px; } .post .why { color:var(--warn, #FF8A7A); } .post [hidden] { display:none !important; }
  /* ひとこと：「」で うすく。自由に 書いた 文だけ 通報できる（?admin=1 は 鹿さんの 見え方で 消せる） */
  .rows .nt { display:block; margin-top:3px; font-size:13px; color:var(--dim); } .rows .nt.gone { text-decoration:line-through; opacity:.6; }
  .flag { margin-left:8px; font-size:11px; color:var(--dim); border-bottom:1px dotted var(--line2); } .flag:hover:not(:disabled) { color:var(--warn, #FF8A7A); } .flag:disabled { border:0; }

  /* 株（トークン。deeplink-stock.js。鹿さんの カード「A 一覧＋右で 決める」2026-11-05） */
  .sgrid { display:grid; grid-template-columns:minmax(0, 1fr) 300px; gap:18px; margin-top:12px; align-items:start; }
  .filt { display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; padding:8px 10px; border:1px solid var(--line); background:rgba(255,181,71,.03); font-size:13px; }
  .filt .lb { color:var(--dim); margin-right:2px; } .filt .lb:not(:first-child) { margin-left:8px; }
  .chip { padding:1px 8px; border:1px solid var(--line); color:var(--dim); font-size:13px; white-space:nowrap; } .chip[aria-pressed="true"] { border-color:var(--amber); color:var(--amber); text-shadow:var(--glow); } .chip:hover { color:var(--text); }
  .srows { margin-top:6px; } .srows .gh { padding:8px 4px 2px; font-size:12px; color:var(--dim); letter-spacing:.06em; border-bottom:1px solid var(--line); }
  .srow { width:100%; display:grid; grid-template-columns:44px minmax(0, 1fr) 56px 52px 64px; gap:8px; align-items:center; padding:6px 4px; text-align:left; border-bottom:1px dashed var(--line); font-size:14px; }
  .srow.own { grid-template-columns:44px minmax(0, 1fr) 52px 64px 96px; }
  .srow:hover { background:rgba(255,181,71,.06); } .srow[aria-pressed="true"] { background:rgba(255,181,71,.12); box-shadow:inset 2px 0 0 var(--amber); }
  .srow .kd, .sdet .kd, .news .kd { display:inline-block; padding:0 4px; border:1px solid var(--line2); font-size:12px; color:var(--amber); text-align:center; }
  .srow .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .srow .nm small { margin-left:8px; font-size:12px; color:var(--cyan); }
  .srow .px { text-align:right; color:var(--text); } .chg { font-size:12px; text-align:right; color:var(--dim); white-space:nowrap; } .chg.up, em.up { color:var(--ok); } .chg.dn, em.dn { color:var(--ng); }

<script type="module">
import { t, enReady } from "./lounge-en.js";   // 英語の 画面（MONO LINK の サイトの EN／日本語 と 同じ 決まり。英語の ときだけ 辞書を 読む）。起動の 文字送りは 訳してから 打つ

import { SPHERE_LOOK } from "./sphere.js";   // スフィアの 鑑定（ガラク。2026-11-04）
import { phoneDrawer } from "./phone-drawer.js";
import { me, act, busy, waitText, board, report, notedel } from "./lounge-client.js";   // 商人・タスク・お店・依頼の 板は 門番（見本では ブラウザの 中の ためしの 門番）
import { stockPane, stockInput, newsNew, heldN } from "./deeplink-stock.js";   // 株（トークン。2026-11-05）
import { CO as STOCK_CO } from "./stocks.js";
import { mountWallet } from "./wallet-bar.js"; mountWallet({ host: document.getElementById("wallet"), theme: "dark" });   // 通貨の 札（玉・アメジスト・クレジット）と 両替

const q = new URLSearchParams(location.search);
const fmt = (n) => n.toLocaleString("ja-JP");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const META = Object.fromEntries([...TRADERS, SPECIAL].map((t) => [t.id, t]));
const S = { go: q.get("go") || "junk", tab: ["shop", "tasks"].includes(q.get("tab")) ? q.get("tab") : "story", open: null, pick: {}, pickOp: {}, sell: {}, sk: null, want: null };
let ME = null, D = null, B = { list: [], staff: false }, K = null;   // K：株の 取引所（stock.view の 答え）
try { S.lookAll = localStorage.getItem("ml-look-all") === "1"; } catch (e) {}   // スフィアの 鑑定：ぜんぶ を えらんで いたか
Object.assign(S, { stab: "list", sg: "all", ssort: "group", sco: STOCK_CO[q.get("co")] ? q.get("co") : "VLC", sn: 0 });   // sn 0：その 銘柄の 最小（5,000 クレジット分）   // 株の 画面の 状態（タブ・グループ・ならべる・えらんだ 銘柄・数）
const stockOpen = () => !!(ME && ME.stock && ME.stock.open);
const cleanK = (k) => (k && Array.isArray(k.list) ? { ...k, list: k.list.filter((x) => STOCK_CO[x.co]), news: (k.news || []).filter((n) => STOCK_CO[n.co]) } : k);
async function loadStock() { if (!stockOpen()) return; const r = await act("stock.view", {}).catch(() => ({ ok: false })); K = r.ok ? cleanK(r.stock) : { err: true, lock: r.lock, why: r.why }; }
let insT = 0;   // 保険の 支払いの 時間に 読み直す タイマー
async function load() {
  ME = await me(); D = ME.deeplink || { traders: [], perks: {}, items: {}, recipes: [], keys: [] };
  clearTimeout(insT); const due = Math.min(...(D.ins || []).map((x) => x.at)) - Date.now();   // 支払いが 届く 時間に 読み直す（支払いの タスクが 1 に なる）
  if (due > 0 && due < 6 * 3600e3) insT = setTimeout(() => load().then(() => { if (document.getElementById("crt").classList.contains("ready")) render(); }), due + 1500);
  const b = ME.denied ? null : await board(); B = b && Array.isArray(b.list) ? b : { list: [], staff: false };
}
await load();
if (!ME.denied && ME.ok !== false) act("dl.visit", {}).catch(() => {});
if (S.go === "stock" && !stockOpen()) S.go = "junk";
loadStock().then(() => { if (document.getElementById("crt").classList.contains("ready")) render(); });   // 株：左の 一覧の 丸（ニュース）の ため 先に 読む   // 開いた 日を 数える（プライマリータスク「DEEP LINK を 3 日 ひらく」）
const W = () => (ME.wallet && ME.wallet.known ? ME.wallet : null);
const view = (id) => D.traders.find((x) => x.id === id) || { shop: [] };
const cur = (c, n) => (c === "res" ? `<span class="v">アメジスト ${fmt(n)}</span>` : `<span class="c">クレジット ${fmt(n)}</span>`);   // 店は クレジット（ヨルは アメジスト）
const FACE = {};   // 顔の 絵が まだ ない 商人は どうぶつの 字で（アンビル・ミネルバの 絵は できた。modeling-log の M-017）
const face = (id) => (FACE[id] ? `<span class="emo">${FACE[id]}</span>` : `<img src="img/trader-${id}.png" alt="">`);
const credits = () => ME.credits || 0;
const META_ALL = [...TRADERS, SPECIAL], nameOf = (tid) => (META_ALL.find((x) => x.id === tid) || { name: tid }).name;
const itemName = (id) => { for (const t of META_ALL) { const it = t.shop.find((x) => x.id === id); if (it) return it.name; } return id; };
const DNAME = Object.fromEntries(DUNGEONS.map((d) => [d.id, d.name]));
const ITEM = { map: "かくし通路の地図", collar: "なかよしの首輪", snack3: "とくべつおやつ", recipe: "作るの レシピ", charm: "くじの お守り" };
const getText = (g) => !g ? [] : [g.acc && `装備 ★${g.acc}`, g.snacks && `おやつ ${g.snacks}`, ...Object.entries(g.items || {}).map(([k, n]) => `${ITEM[k] || k}${n > 1 ? ` ×${n}` : ""}`), ...Object.entries(g.tools || {}).map(([k, n]) => `${TOOLS[k] ? TOOLS[k].name : k}${n > 1 ? ` ×${n}` : ""}`), ...(g.mats || []).map(([id, n]) => `${MAT_NAME[id] || id} ×${n}`)];
const rewardText = (r) => [r.credits && `<span class="c">クレジット ${fmt(r.credits)}</span>`, ...getText(r.get).map(esc), r.rep && `<span class="g">友好 ＋${r.rep}</span>`].filter(Boolean).join("・");
const tasksOf = (v) => (v.chain ? [{ ...v.chain, which: "chain" }, { ...v.daily, which: "daily", daily: true }] : []);
const ready = (v) => tasksOf(v).filter((k) => !k.done && k.have >= k.need).length + (v.pri && v.pri.have >= v.pri.need ? 1 : 0);
// 持って いる 素材（id と 品質ごとに まとめる）
const matsBy = () => { const m = new Map(); for (const x of ME.own.mats || []) { const k = `${x.id}:${x.q || 0}`; m.set(k, { id: x.id, q: x.q || 0, n: (m.get(k)?.n || 0) + x.n }); } return [...m.values()]; };
const haveMat = (id, q = 0) => (ME.own.mats || []).filter((x) => x.id === id && (x.q || 0) >= q).reduce((a, x) => a + x.n, 0);

// クローラー・ボーダーゾーンの 札：島 3 の 夜の 招待（ME.order。2026-11-11）。届く 前は 開き方、届いたら 赤い 丸、サインの あとは いつもの 札
const invTag = (dflt) => { const o = ME && ME.order; if (!o || o.signed) return dflt; return o.ready ? `<span class="new">●</span> 招待が 届いた` : "無線機 Lv2 で 招待"; };
function dirHtml() {
  const row = (t, sp) => { const v = view(t.id); return `<button data-go="${t.id}" class="${sp ? "sp" : ""}" aria-current="${S.go === t.id}"><span class="mk">${face(t.id)}</span><span class="nm">${t.dir || t.name}</span><small>Lv${v.lv || 1}${ready(v) ? ` <span class="new">●${ready(v)}</span>` : ""}</small></button>`; };
  return `<p class="pr">&gt; 商人</p><ul>${TRADERS.map((t) => `<li>${row(t)}</li>`).join("")}</ul>
    <p class="pr">&gt; ほか</p><ul><li>${row(SPECIAL, true)}</li><li><button data-go="desk" aria-current="${S.go === "desk"}"><span class="mk">▣</span><span class="nm">会社の 窓口</span><small>${ME.desk && ME.desk.bank.acc ? `<span class="new">●</span> 利子` : "好感度・預金"}</small></button></li><li><button data-go="board" aria-current="${S.go === "board"}"><span class="mk">✉</span><span class="nm">みんなの依頼</span><small>${B.list.length}</small></button></li>${stockOpen() ? `<li><button data-go="stock" aria-current="${S.go === "stock"}"><span class="mk">▲</span><span class="nm">トークン</span><small>${heldN(K) ? `保有 ${heldN(K)}` : ""}${newsNew(K) ? ` <span class="new">●${newsNew(K)}</span>` : ""}</small></button></li>` : ""}<li><a class="go" href="crawler.html"><span class="mk" aria-hidden="true">▣</span><span class="nm">クローラー</span><small>${invTag("先行体験版")}</small></a></li><li><a class="go" href="border.html"><span class="mk" aria-hidden="true">◇</span><span class="nm">ボーダーゾーン</span><small>${invTag("集めて 脱出")}</small></a></li></ul>`;   // クローラー（企業の ミッション）：2026-11-05 鹿さん「クローラーとボーダーゾーンも」で みんなに 入口
}
function traderHtml(t) {
  const v = view(t.id), lv = v.lv || 1, rep = v.rep || 0, list = tasksOf(v), sp = t === SPECIAL;
  const top = lvOfPts(rep) > lv, base = repAt(lv), next = lv < LV_MAX ? repAt(lv + 1) : null;   // top：点は たまって いるが 章で 止まって いる
  const meter = top ? `<span class="cap">第 ${Math.ceil(lv / CH_LV)} 章を 終えると 上がる</span>` : next ? `${fmt(rep - base)} / ${fmt(next - base)}` : "いちばん上";
  const tasks = list.map((k) => { const full = k.have >= k.need, u = k.unit ? (k.unit === "%" ? "%" : ` ${k.unit}`) : "";
    return `<li class="${k.done ? "done" : ""}"><div class="t"><span class="no">${k.daily ? "きょう" : `ランダム #${k.n}`}</span><span class="kd">${esc(k.kind || "")}</span>${esc(k.text)}${k.found ? `<span class="kd found">拾った物</span>` : ""}${k.cond ? `<span class="cond">じょうけん：${esc(k.cond)}</span>` : ""}
      <span class="prog ${full ? "full" : ""}"><i><b style="width:${Math.min(100, (k.have / k.need) * 100)}%"></b></i>${k.done ? "おわった" : `${Math.min(k.have, k.need)}${u} / ${k.need}${u}`}</span>
      <span class="sub">ごほうび　<span class="rw">${rewardText(k.reward)}</span></span></div>
      <div class="act">${k.done ? "" : `<button class="btn" data-task="${k.which}" ${full ? "" : "disabled"}>${k.kind === "納める" ? "納める" : "報告する"}</button>`}</div></li>`; }).join("");
  const priN = v.pri && v.pri.have >= v.pri.need ? 1 : 0;
  return `<header class="who ${sp ? "sp" : ""}"><span class="cam" aria-hidden="true">${face(t.id)}</span><div><h2>${sp ? `${t.name}の ${t.dir}` : t.name}</h2><p>${t.animal}・${esc(t.co || "")}${t.group ? `（${esc(t.group)}${gaffOf(t.group) ? `・${esc(gaffOf(t.group).tier)} ${gaffOf(t.group).v}` : ""}）` : ""}</p></div>
      <div class="rep">友好度 <b>Lv${lv}</b> / ${LV_MAX}　${meter}<span class="meter"><i style="width:${top || !next ? 100 : ((rep - base) / (next - base)) * 100}%"></i></span></div></header>
    <p class="say">${esc(t.say)}</p>${t.id === "minerva" && !(S.tab === "story" && v.pri && v.pri.pay) ? insLine() : ""}
    <div class="tabs" role="tablist"><button role="tab" data-tab="story" aria-selected="${S.tab === "story"}">物語${priN ? ` <span class="new">●</span>` : ""}</button><button role="tab" data-tab="tasks" aria-selected="${S.tab === "tasks"}">タスク ${list.filter((k) => !k.done).length}</button><button role="tab" data-tab="shop" aria-selected="${S.tab === "shop"}">ショップ ${t.shop.length}</button></div>
    ${S.tab === "story" ? storyHtml(t, v) : S.tab === "tasks" ? `<ul class="rows">${tasks}</ul>` : (t.id === "junk" ? lookHtml() : "") + auHtml(t.id) + shopHtml(t)}${sp && S.tab === "shop" ? `<p class="note">アメジストは 招待・毎晩の 大会・虹保留・!アメジスト交換（玉 500 → 1）で 手に 入る</p>` : ""}`;
}
// 物語（プライマリータスク）：いまの 章と いまの 1 つだけ 大きく。章の 一覧は しまう
function storyHtml(t, v) {
  const chs = v.chs || [], cc = chs.find((c) => c.done < c.n) || chs[chs.length - 1], k = v.pri;
  if (!cc) return `<p class="note">物語は まだ ない</p>`;

    if (S.lookAll && unk.length > 1) return lookAsk(b, "sphere.lookAll", {});

  if (d.item) { const sh = t, it = sh.shop.find((x) => x.id === d.item);
    if (it.sell || it.trade || it.pick) { S.open = S.open === it.id ? null : it.id; S.sell = {}; return render(); }
    return ask(b, "trader.buy", { tid: sh.id, item: it.id }, () => `買った：${it.name}${it.tool ? "（冒険の じゅんびで 持っていける）" : ""}`); }
  if (d.buy) { const sh = t, it = sh.shop.find((x) => x.id === d.buy), list = choices(it), pick = S.pick[it.id] && list.includes(S.pick[it.id]) ? S.pick[it.id] : list[0];
    const ops = it.get.op ? Object.keys(OPS).filter((k) => (OPS[k].from || 1) <= it.get.acc) : [], pickOp = it.get.op ? S.pickOp[it.id] || ops[0] : undefined;
    return ask(b, "trader.buy", { tid: sh.id, item: it.id, pick, pickOp }, () => `買った：${choiceName(it, pick)}${it.get.acc ? " → 装備に 入った" : it.get.recipe ? " → 作業台に レシピが 出た" : ""}`); }
  // 数を かえる・しゅるいを かえる：描きなおしても 画面の 位置と 押して いた ボタンを そのまま（前は いちばん 上に もどって いた）
  if (d.sk) { const m = matsBy().find((x) => `${x.id}:${x.q}` === d.sk), x = S.sell[d.sk] || 0; S.sell[d.sk] = d.d === "all" ? m.n : Math.max(0, Math.min(m.n, x + +d.d)); return keepPlace(`[data-sk="${d.sk}"][data-d="${d.d}"]`, `[data-sk="${d.sk}"][data-d="1"]`); }
  if (d.sellk) { S.sk = d.sellk; return keepPlace(`[data-sellk="${d.sellk}"]`); }
  if (d.sell) { const mats = Object.entries(S.sell).filter(([, n]) => n > 0).map(([k, n]) => { const [id, q] = k.split(":"); return { id, q: +q, n }; });
    return ask(b, "trader.sell", { tid: "junk", mats }, (r) => `売った：クレジット ${fmt(r.got || 0)}`).then((r) => { if (r.ok) { S.sell = {}; render(); } }); }
  if (d.trade) { const give = giveFor(d.trade); return ask(b, "trader.trade", { tid: "junk", want: d.trade, give }, () => `交換した：${MAT_NAME[d.trade]} が 1 こ 倉庫に 入った`); }
  if (d.req) return ask(b, "req.deliver", { rid: d.req }, (r) => `届けた：お礼 ${reqReward(r.reward || {}).replace(/<[^>]+>/g, "")} を もらった`);
  if (d.post) {
    const wv = document.getElementById("rq-want").value, n = Math.max(1, Math.min(99, +document.getElementById("rq-n").value || 1)), qv = +document.getElementById("rq-q").value;
    const want = wv.startsWith("m:") ? { mat: wv.slice(2), q: qv, n } : { equip: wv.slice(2), star: 1, n: 1 };
    const reward = { credits: Math.max(0, Math.floor(+document.getElementById("rq-b").value || 0)), res: Math.max(0, Math.floor(+document.getElementById("rq-r").value || 0)) };
    const ns = document.getElementById("rq-note").value, note = ns === "" ? null : ns === "free" ? { text: document.getElementById("rq-free").value } : { preset: +ns };
    return ask(b, "req.post", { want, reward, limit: +document.getElementById("rq-lim").value, note }, (r) => `依頼を 出した：お礼と 手数料 ${fmt(r.fee)} クレジットを 預けた${r.sending ? "（板に 送って います）" : ""}`);
  }
  if (d.cancel) return ask(b, "req.cancel", {}, () => "取り下げた：お礼は もどる（手数料は もどらない）");
  // 通報：1 人 1 回。3 回で かくれる（門番の 板が 数える）。配信者と モデレーターは 消せる
  if (d.flag) { const r = await busy(b, () => report(d.flag), "…"); await load(); render(); return toast(r.ok ? (r.hidden ? "通報した：ひとことを かくした" : "通報した") : r.why || "通報できませんでした"); }
  if (d.erase) { const r = await busy(b, () => notedel(d.erase), "…"); await load(); render(); return toast(r.ok ? "ひとことを 消した" : r.why || "消せませんでした"); }
});

// 起動の文字（いちどだけ。動きをへらす設定のときと、&boot=0 のときは飛ばす）
document.getElementById("from").textContent = B.staff ? `${ME.name || ""}（管理）で 接続中` : `${ME.name || ""} の ラウンジ PC から 接続中`;
const LINES = ["MONO LINK:// を うらがえしています …", "DEEP LINK/: に つないでいます …", `${ME.name || "あなた"} の ラウンジ PC を 確認しました`, "ようこそ。"];
const start = () => { const el = document.getElementById("crt"); if (el.classList.contains("ready")) return; el.classList.add("ready"); render(); window.ready = true; };
if (q.get("boot") === "0" || matchMedia("(prefers-reduced-motion: reduce)").matches) start();
else {
  const box = document.getElementById("boot"); let i = 0;
  const step = () => { if (i >= LINES.length) return setTimeout(start, 300); const p = document.createElement("p"); if (i === LINES.length - 1) p.className = "ok"; p.setAttribute("data-notr", ""); box.appendChild(p); const s = t(LINES[i++]); let k = 0;
    const type = () => { p.textContent = s.slice(0, ++k); if (k < s.length) setTimeout(type, 22); else setTimeout(step, 140); }; type(); };
  enReady.then(step);
  document.addEventListener("click", start, { once: true });
}
</script>
</body>
