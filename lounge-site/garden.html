<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  /* MONO LINK の 農園（新しい 畑。鹿さんの 決め 2026-11-03：試しの 形で 門番に つなぐ。docs/mono-link-release-plan.md）
     見本（farm-play.html）と 同じ 見た目・決まり。記録と 植える・とる・土・見た目は 門番（lounge-server/lounge-farmv.js）
     種は 派遣の 採取で 拾う（生まれた 品種は 収穫で とれる）。とれた 作物は 倉庫の 素材へ。入り口は 部屋の「庭への 扉」 */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0; --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; } [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.6 var(--jp); overflow-x:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; } button:disabled { cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  h1, h2, h3, p, ul { margin:0; padding:0; } ul { list-style:none; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1140px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.94); border-radius:24px; box-shadow:var(--lift); padding:clamp(14px, 2.2vw, 18px); }
  .jelly { border:0; border-radius:999px; padding:14px 18px; font:900 17px/1 var(--jp); background:var(--ink); color:#fff; box-shadow:0 5px 0 rgba(27,35,64,.25); width:100%; }
  .jelly.go { background:var(--leaf); box-shadow:0 5px 0 rgba(34,204,136,.32); } .jelly.tap { background:var(--sun); color:var(--ink); box-shadow:0 5px 0 rgba(224,162,28,.35); }
  .jelly:disabled { background:#C9D1E2; box-shadow:0 5px 0 #E3E8F2; }
  .why { margin-top:6px; font:700 12.5px/1.4 var(--jp); color:var(--soft); text-align:center; }

  /* 上：農業の Lv と タブ */
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:6px 0 12px; }
  .lv { display:flex; align-items:center; gap:10px; margin-right:auto; font:900 15px/1 var(--jp); }
  .lv b { font:600 22px/1 var(--num); } .xp { width:120px; height:8px; border-radius:99px; background:#E3E8F2; overflow:hidden; } .xp i { display:block; height:100%; background:var(--leaf); }
  .tabs { display:flex; gap:6px; }
  .tab { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; border:2px solid var(--line); background:#fff; font:900 14.5px/1 var(--jp); color:var(--soft); }
  .tab[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .tab .n { min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--leaf); color:#fff; font:600 12px/20px var(--num); text-align:center; }

  /* 畑：左に 3D、右に 決める */
  .farm { display:grid; grid-template-columns:minmax(0, 1fr) 330px; gap:14px; align-items:start; }
  .view { position:relative; border-radius:24px; overflow:hidden; box-shadow:var(--lift); aspect-ratio:4 / 3; background:#BFE6FF; }
  .view canvas { display:block; width:100%; height:100%; touch-action:manipulation; }
  .opts { position:absolute; left:10px; bottom:10px; display:flex; gap:6px; flex-wrap:wrap; }
  .opt { display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; border:0; background:rgba(20,16,34,.72); color:#fff; font:900 12.5px/1 var(--jp); }
  .opt small { color:#C9D3E6; font-weight:700; }
  /* まとめて とる（実った 作物が ある ときだけ。3D の 右上） */
  .allget { position:absolute; right:10px; top:10px; display:inline-flex; align-items:center; gap:7px; padding:6px 7px 6px 13px; border:0; border-radius:999px; background:rgba(20,16,34,.82); color:#fff; font:900 13.5px/1 var(--jp); }
  .allget b { display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:99px; background:var(--leaf); font:700 13px/1 var(--num); } .allget:disabled { opacity:.6; }
  .side { display:grid; gap:12px; }
  .cell { display:grid; grid-template-columns:72px 1fr; gap:12px; align-items:center; }
  .cell .pic { width:72px; height:72px; border-radius:18px; background:#F1EEE6; display:grid; place-items:center; }
  .cell .pic img { width:64px; height:64px; image-rendering:pixelated; }
  .cell h2 { font:900 18px/1.25 var(--jp); } .cell p { font:700 13px/1.4 var(--jp); color:var(--soft); }
  .cell .bar { height:8px; border-radius:99px; background:#E3E8F2; overflow:hidden; margin-top:6px; } .cell .bar i { display:block; height:100%; background:var(--sun); }
  .act { margin-top:12px; }
  .cell .pic svg { width:56px; height:56px; }
  .frow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px; } .frow > span { font:900 12px/1 var(--jp); color:var(--soft); margin-right:2px; }
  .srow { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
  .srow b { font:900 14px/1.3 var(--jp); } .srow small { grid-column:1; font:700 12px/1.4 var(--jp); color:var(--soft); } .srow .chip { grid-row:1 / span 2; grid-column:2; }
  .soilh { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; } .soilh h2 { font:900 16px/1.3 var(--jp); }
  .seeds h3 { font:900 14px/1 var(--jp); margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .shead { border:0; background:none; padding:0; font:900 14px/1 var(--jp); display:flex; align-items:center; gap:6px; pointer-events:none; } .shead .tri { display:none; }
  .chip { padding:6px 11px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font:900 12.5px/1 var(--jp); color:var(--soft); }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); } .chip:disabled { opacity:.4; }
  .chip i { font:600 12px/1 var(--num); font-style:normal; margin-left:4px; opacity:.8; }
  .slist { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; max-height:290px; overflow:auto; padding:2px; }
  .seed { display:grid; justify-items:center; gap:2px; padding:8px 4px 6px; border-radius:16px; border:2px solid transparent; background:#F6F3EC; font:900 12px/1.2 var(--jp); text-align:center; }
  .seed img { width:40px; height:40px; image-rendering:pixelated; } .seed small { font:600 12px/1 var(--num); color:var(--soft); }
  .seed[aria-pressed="true"] { border-color:var(--leaf); background:#E8FBF2; }
  .slist .none { grid-column:1 / -1; margin:2px 0; font:700 13px/1.5 var(--jp); color:var(--soft); }
  /* プリセット（鹿さんの 頼み 2026-11-05。カード「A 塗って組む」）：小さな マス目を 塗る */
  .pgrid { display:grid; grid-template-columns:repeat(var(--w), 1fr); gap:4px; max-width:min(300px, calc(var(--w) * 58px)); margin:4px 0 10px; }
  .pcell { aspect-ratio:1; border-radius:10px; border:1.5px dashed var(--line); background:#F6F3EC; padding:0; display:grid; place-items:center; }
  .pcell img { width:78%; height:78%; image-rendering:pixelated; } .pcell.on { border-style:solid; border-color:#E2D9C6; background:#FFFBF2; }
  .pslot { display:flex; gap:6px; margin-bottom:8px; } .pnote { font:700 12.5px/1.5 var(--jp); color:var(--soft); margin-top:8px; } .pnote.warn { color:var(--coral, #FF5A64); }
  .pplant { margin-top:10px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 140%); opacity:0; visibility:hidden; padding:12px 18px; border-radius:16px; background:var(--ink); color:#fff; font:900 14px/1.4 var(--jp); transition:transform .25s, opacity .25s, visibility .25s; z-index:20; max-width:calc(100vw - 32px); }
  .toast.on { transform:translate(-50%, 0); opacity:1; visibility:visible; }

  /* 図鑑 */
  .book { display:grid; gap:12px; }
  .filter { display:grid; gap:8px; padding:10px 14px; border-radius:18px; background:#F1F4FA; }
  .filter .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .filter .row > span { font:900 12px/1 var(--jp); color:var(--soft); min-width:44px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  .card { display:grid; grid-template-columns:48px 1fr; gap:8px; align-items:center; padding:10px; border-radius:18px; background:#fff; box-shadow:var(--lift); }
  .card img { width:48px; height:48px; image-rendering:pixelated; } .card.no img { filter:brightness(0) opacity(.25); }
  .card b { font:900 13.5px/1.25 var(--jp); display:block; } .card small { font:700 12px/1.35 var(--jp); color:var(--soft); display:block; }
  .board { text-align:center; padding:40px 16px; color:var(--soft); font:900 15px/1.6 var(--jp); }

  @media (max-width:760px) {
    .farm { grid-template-columns:minmax(0, 1fr); } .view { aspect-ratio:1 / 1; }
    .head .lv { width:100%; } .tabs { width:100%; } .tab { flex:1; justify-content:center; padding:9px 8px; }
    .slist { max-height:none; }
    .shead { pointer-events:auto; width:100%; justify-content:space-between; padding:4px 0; } .shead .tri { display:inline; transition:transform .2s; } .shead[aria-expanded="true"] .tri { transform:rotate(180deg); }
    .seeds.shut .chips, .seeds.shut .slist { display:none; } .seeds.shut h3 { margin:0; }
  }
</style>
</head>
<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ 庭の 農園</small></header>
<main>
  <div class="head">
    <div class="lv" id="lv"></div>
    <nav class="tabs" role="tablist" aria-label="農業">
      <button class="tab" role="tab" data-tab="field" aria-selected="true">畑</button>
      <button class="tab" role="tab" data-tab="book" aria-selected="false">図鑑</button>
      <button class="tab" role="tab" data-tab="board" aria-selected="false">掲示板</button>
    </nav>
  </div>
  <section id="tab-field" class="farm">
    <div class="view" id="view"><canvas id="cv"></canvas><div class="opts" id="opts"></div><button class="allget" id="allget"></button></div>
    <div class="side" id="side"></div>
  </section>
  <section id="tab-book" class="book" hidden></section>
  <section id="tab-board" class="panel board" hidden>注文は まだ ありません</section>
</main>
<div class="toast" id="toast" role="status"></div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<script type="module">
import "./lounge-en.js";   // 英語の 画面（ラウンジの ページ ぜんぶ 英語に する 決め〈2026-10-25〉。農園は つながって いなかった：2026-11-05）
import * as THREE from "three";
import { makeFarm, SKINS } from "./farm3d.js";
import { CROPS as CROPS_ALL, CROP, KIND, afterOf } from "./crops.js";
import { ISLAND_OPEN } from "./dungeons.js";
const CROPS = CROPS_ALL.filter((c) => c.isle <= ISLAND_OPEN);   // ゲームに 出て いる 島の 作物だけ（ミカネル島は 鹿さんの OK まで 出さない）
import { newField, fieldSize, inField, W, stageAt, plant, harvest, advance, setSoil, addXp, xpNext, SOILS, growMs, FIELD, FERT, SPRINKLERS, sprTier, SPR_Q, SOIL_LOCK_H } from "./farm-core.js";
import { wsIcon } from "./ws-icons.js";
import { cropPic } from "./crop-art.js";
import { matPic } from "./mat-icons.js";
import { MAT_NAME } from "./materials.js";   // かわった 物（麦わら など）の 名前
import { me, act } from "./lounge-client.js";   // 記録は 門番（見本では ブラウザの 中の ためしの 門番）

// ---------- 記録（門番） ----------
let S = null;
let CRED = 0;   // クレジット（土を 買う）
const take = (v, j) => { if (v) S = { field: v.field, known: v.known || [], skin: v.skin || "box", seeds: v.seeds || {}, tools: v.tools || {}, presets: v.presets || [null, null, null] }; if (j && typeof j.credits === "number") CRED = j.credits; };
await me();
{ const j = await act("farmv.view"); take(j && j.farmv, j); }
if (!S) { document.querySelector("main").innerHTML = '<section class="panel board">農園は まだ 開いて いません</section>'; throw new Error("closed"); }
const SPEED = 1, now = () => Date.now(), save = () => {};
const known = () => new Set(S.known);
let busyF = false;

// ---------- 3D ----------
const view = document.getElementById("view"), cv = document.getElementById("cv");
// スマホ（指で 押す 画面）は 軽く 描く：なめらか処理 なし・細かさ 1.5 倍まで（配信の 映像と いっしょに 開くと 重くて 落ちた。2026-11-05）
const PHONE = matchMedia("(pointer: coarse)").matches;
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: !PHONE, powerPreference: "low-power" }); r.setPixelRatio(Math.min(PHONE ? 1.5 : 2, devicePixelRatio)); r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const OFF = new THREE.Vector3(3.2, 11, 10), C = new THREE.Vector3(0, 0.45, -0.35); cam.position.copy(C).add(OFF); cam.lookAt(C);
let farm = null;
function buildFarm() { if (farm) sc.remove(farm.group); farm = makeFarm({ skin: S.skin }); sc.add(farm.group); sc.background = new THREE.Color(farm.env.bg); view.style.background = farm.env.bg; farm.setFace(Math.atan2(OFF.x, OFF.z)); farm.show(S.field, now()); farm.select(SEL); }
function size() { const w = view.clientWidth, h = view.clientHeight, a = w / h, s = a < 1.05 ? 4.6 / Math.min(1, a) : 3.8; cam.left = -s * a; cam.right = s * a; cam.top = s; cam.bottom = -s; cam.updateProjectionMatrix(); r.setSize(w, h, false); }
const ray = new THREE.Raycaster();
cv.addEventListener("click", (e) => { const b = cv.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2(((e.clientX - b.left) / b.width) * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1), cam); const i = farm.pick(ray); if (i >= 0) { SEL = i; SOILV = false; PRESETV = false; farm.select(i); side(); } });

// ---------- 畑の 右の パネル ----------
let SEL = 0, SEED = null, SEEDF = "all", SEEDOPEN = false, FSEL = null, SOILV = false;
let PRESETV = false, PSLOT = 0, PE = null, PDIRTY = false, PPAINT = null, PFERT = null;   // プリセット：欄を 開く・えらんだ 番号・塗って いる 途中の マス・まだ 保存して いない・塗る 種（"" は 消す）・まく 肥料   // SEEDOPEN：スマホの たねの 引き出し・FSEL：まく 肥料・SOILV：土を えらぶ
const TOOLN = { fert: "肥料", fert2: "上の 肥料", sprinkler: "スプリンクラー", sprinkler2: "上の スプリンクラー", sprinkler3: "星の スプリンクラー" };
const qRange = (t) => { const k = Object.keys(SPR_Q[Math.min(3, t)]); return `品質 ${k[0]}〜${k[k.length - 1]}`; };
const soilNote = (s) => s.byIsle ? "島 2 の 作物が よく 育つ・かけ合わせ ×1.5（島 1 は 育つ 速さ ×0.8）" : [s.speed && `育つ 速さ ×${s.speed}`, s.cross && `かけ合わせ ×${s.cross}`, s.grace && `実ってからの 猶予 ×${s.grace}`, s.color && `色ちがい ×${s.color}`, s.get && `とれる 数 ${s.get}`].filter(Boolean).join("・") || "得意も 弱い 所も ない";
function soilPanel() {
  const f = S.field, t = now(), lock = f.soilAt ? f.soilAt + SOIL_LOCK_H * 3600e3 - t : 0;
  return `<section class="panel" id="soilp"><div class="soilh"><h2>土を かえる</h2><button class="chip" data-soil-close="1">とじる</button></div>
    ${Object.entries(SOILS).map(([k, s]) => { const cur = k === f.soil, why = cur ? "いまの 土" : lock > 0 ? `あと ${fmt(lock)}` : s.lv && f.lv < s.lv ? `農業 Lv${s.lv} から` : s.price > CRED ? "クレジットが 足りない" : "";
      return `<div class="srow"><b>${s.name}</b><button class="chip" data-soil="${k}" ${why ? "disabled" : ""}>${cur ? "いま" : s.price ? `${s.price.toLocaleString()} クレジット` : "かえる"}</button><small>${soilNote(s)}${why && !cur ? `（${why}）` : ""}</small></div>`; }).join("")}</section>`;
}
// ---------- プリセット（鹿さんの 頼み 2026-11-05「プリセットを組んで植える機能を追加してください」→ カード「A 塗って組む」）----------
// 3 つまで。いまの 畑の 広さの マス目を 塗る（種が なくても 組める）。「いまの 畑から」で 写す。植えるのは あいた マスだけ（門番の farmv.plantPreset）
const presetOf = (k) => ({ ...(((S.presets || [])[k] || {}).cells || {}) });
const paintable = () => CROPS.filter((c) => (S.seeds[c.id] || 0) > 0 || S.known.includes(c.id) || (c.kind === "seed" && c.lv <= S.field.lv));   // 図鑑に のって いない 品種は 出さない
function presetNeed(cells) {   // 植えられる マスの 数と、足りない 種
  const f = S.field, need = {}; let n = 0;
  for (const [k, id] of Object.entries(cells)) { const i = +k; if (!inField(f.lv, i) || f.cells[i] || !CROP[id]) continue; if (CROP[id].kind === "seed" && f.lv < CROP[id].lv) continue; need[id] = (need[id] || 0) + 1; }
  const short = [];
  for (const [id, k] of Object.entries(need)) { const have = S.seeds[id] || 0; n += Math.min(k, have); if (have < k) short.push(`${CROP[id].name} あと ${k - have}`); }
  return { n, short };
}
function presetPanel() {
  if (!PE) PE = presetOf(PSLOT);
  const f = S.field, [w, h] = fieldSize(f.lv), T = S.tools, ferts = Object.keys(FERT).filter((k) => T[k] > 0);
  if (PFERT && !(T[PFERT] > 0)) PFERT = null;
  const slots = [0, 1, 2].map((k) => { const n = k === PSLOT ? Object.keys(PE).length : Object.keys(presetOf(k)).length; return `<button class="chip" data-pslot="${k}" aria-pressed="${k === PSLOT}">${k + 1}<i>${n ? `${n} マス` : "空き"}</i></button>`; }).join("");
  let grid = ""; for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * W + x, id = PE[i]; grid += `<button class="pcell ${id ? "on" : ""}" data-pcell="${i}" aria-label="${x + 1}-${y + 1}${id ? " " + CROP[id].name : ""}">${id ? `<img src="${cropPic(CROP[id], "ripe", { scale: 2 })}" alt="">` : ""}</button>`; }
  const list = paintable(), sel = PPAINT === "" ? "消す" : PPAINT ? CROP[PPAINT].name : "";
  const need = presetNeed(PE), empty = !Object.keys(PE).length;
  return `<section class="panel" id="presetp"><div class="soilh"><h2>プリセット</h2><button class="chip" data-pre-close="1">とじる</button></div>
    <div class="pslot">${slots}</div>
    <div class="pgrid" style="--w:${w}">${grid}</div>
    <div class="frow" style="margin-top:0"><span>塗る${sel ? `：${sel}` : ""}</span><button class="chip" data-paint="" aria-pressed="${PPAINT === ""}">消す</button><button class="chip" data-pcopy="1">いまの 畑から</button>${PDIRTY ? `<button class="chip" data-psave="1">保存</button>` : ""}</div>
    <div class="slist" style="max-height:170px;margin-top:8px">${list.length ? list.map((c) => `<button class="seed" data-paint="${c.id}" aria-pressed="${PPAINT === c.id}"><img src="${cropPic(c, "ripe", { scale: 2 })}" alt="">${c.name}<small>×${S.seeds[c.id] || 0}</small></button>`).join("") : `<p class="none">種は 派遣の 採取で 拾う</p>`}</div>
    ${ferts.length ? `<div class="frow"><span>肥料</span><button class="chip" data-pfert="" aria-pressed="${!PFERT}">なし</button>${ferts.map((k) => `<button class="chip" data-pfert="${k}" aria-pressed="${PFERT === k}">${TOOLN[k]}<i>${T[k]}</i></button>`).join("")}</div>` : ""}
    <button class="jelly go pplant" data-pplant="1" ${need.n ? "" : "disabled"}>植える${need.n ? `（${need.n} マス）` : ""}</button>
    ${need.short.length ? `<p class="pnote warn">足りない：${need.short.slice(0, 2).join("・")}${need.short.length > 2 ? ` ほか ${need.short.length - 2}` : ""}</p>` : empty ? `<p class="pnote">種を えらんで マスを 押すと 塗れる</p>` : !need.n ? `<p class="pnote">あいて いる マスが ない</p>` : ""}
  </section>`;
}
async function presetSave() {
  if (!PDIRTY) return true;
  const j = await act("farmv.preset", { slot: PSLOT, cells: PE });
  if (!j.ok) { toast(j.why); return false; }
  take(j.farmv, j); PDIRTY = false; return true;
}
const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000 / SPEED)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return h ? `${h}時間 ${m}分` : m ? `${m}分 ${x}秒` : `${x}秒`; };
const needLv = (i) => { for (const [lv, w, h] of FIELD) if (i % W < w && Math.floor(i / W) < h) return lv; return 30; };
const ST = { sprout: "芽", young: "若葉", ripe: "実り", over: "放っておいた あと" };
const seedsOf = () => CROPS.filter((c) => (S.seeds[c.id] || 0) > 0 && (c.kind !== "seed" || c.lv <= S.field.lv));   // 持って いる 種（数つき）
function side() {
  const f = S.field, t = now(), c = f.cells[SEL], el = document.getElementById("side");
  let pic = "", name = "", sub = "", bar = -1, act = "";
  if (!inField(f.lv, SEL)) { name = "まだ 使えない マス"; sub = `農業 Lv${needLv(SEL)} で 使える`; }
  else if (!c) {
    const T = S.tools, ferts = Object.keys(FERT).filter((k) => T[k] > 0), sprs = Object.keys(SPRINKLERS).filter((k) => T[k] > 0);
    if (FSEL && !(T[FSEL] > 0)) FSEL = null;
    name = "あいて いる マス"; sub = SEED ? `${CROP[SEED].name}を 植える（${CROP[SEED].h} 時間${FSEL ? `・${TOOLN[FSEL]}で ×0.7` : ""}）` : seedsOf().length ? "下の たねから えらぶ" : "種は 派遣の 採取で 拾える";
    act = `<button class="jelly go" data-do="plant" ${SEED ? "" : "disabled"}>植える</button>`
      + (ferts.length ? `<div class="frow"><span>肥料</span><button class="chip" data-fert="" aria-pressed="${!FSEL}">なし</button>${ferts.map((k) => `<button class="chip" data-fert="${k}" aria-pressed="${FSEL === k}">${TOOLN[k]}<i>${T[k]}</i></button>`).join("")}</div>` : "")
      + (sprs.length ? `<div class="frow"><span>置く</span>${sprs.map((k) => `<button class="chip" data-spr="${k}">${TOOLN[k]}<i>${T[k]}</i></button>`).join("")}</div>` : "");
  }
  else if (c.spr) { pic = "svg"; name = TOOLN[c.spr]; sub = `${SPRINKLERS[c.spr].reach === 4 ? "上下左右 4 マス" : "まわり 8 マス"}の 作物が ${qRange(SPRINKLERS[c.spr].tier)}`; act = `<button class="jelly" data-do="unspr">はずす</button>`; }
  else if (c.obj) { pic = matPic(c.obj); name = "かわった 物"; sub = `あと ${c.taps} 回 たたくと とれる`; act = `<button class="jelly tap" data-do="tap">たたく（あと ${c.taps} 回）</button>`; }
  else {
    const crop = CROP[c.id], st = stageAt(c, t, f.soil); pic = cropPic(crop, st.stage === "over" ? "over" : st.stage, { scale: 4 }); name = crop.name;
    if (st.stage === "ripe") { sub = `実り・のこり ${fmt(st.left)}で ${afterOf(crop).kind === "turn" ? "かわる" : afterOf(crop).kind === "flee" ? "逃げる" : "枯れる"}`; act = `<button class="jelly go" data-do="harvest">とる</button>`; }
    else if (st.stage === "over") { const a = afterOf(crop); sub = a.kind === "turn" ? "かわった。たたいて とる" : a.kind === "flee" ? "逃げて しまった" : "枯れて しまった"; act = `<button class="jelly ${a.kind === "turn" ? "tap" : ""}" data-do="harvest">${a.kind === "turn" ? "たたく" : "片づける"}</button>`; }
    else { sub = `${ST[st.stage]}・実るまで あと ${fmt(growMs(crop, f.soil, c.fert) - (t - c.at))}`; bar = Math.round(st.p * 100); }
    const qt = sprTier(f, SEL) + ((FERT[c.fert] || {}).q || 0); if (qt && st.stage !== "over") sub += `・${qRange(qt)}`;
  }
  const sl = seedsOf(), counts = { all: sl.length, seed: sl.filter((x) => x.kind === "seed").length, cross: sl.filter((x) => x.kind !== "seed").length };
  const shown = sl.filter((x) => SEEDF === "all" || (SEEDF === "seed" ? x.kind === "seed" : x.kind !== "seed"));
  const seeds = inField(f.lv, SEL) && !c ? `<section class="panel seeds ${SEEDOPEN ? "" : "shut"}"><h3><button class="shead" data-so="1" aria-expanded="${SEEDOPEN}">たね${SEED ? `：${CROP[SEED].name}` : ""}<span class="tri" aria-hidden="true">▾</span></button></h3>
    <div class="chips">${[["all", "ぜんぶ"], ["seed", "種から"], ["cross", "生まれた 品種"]].map(([k, l]) => `<button class="chip" data-sf="${k}" aria-pressed="${SEEDF === k}" ${counts[k] ? "" : "disabled"}>${l}<i>${counts[k]}</i></button>`).join("")}</div>
    <div class="slist">${shown.map((x) => `<button class="seed" data-seed="${x.id}" aria-pressed="${SEED === x.id}"><img src="${cropPic(x, "ripe", { scale: 2 })}" alt="">${x.name}<small>${x.h}h・×${S.seeds[x.id]}</small></button>`).join("") || '<p class="none">種が ない（派遣の 採取で 拾える）</p>'}</div></section>` : "";
  if (SOILV) { el.innerHTML = soilPanel(); return; }
  if (PRESETV) { el.innerHTML = presetPanel(); return; }
  el.innerHTML = `<section class="panel"><div class="cell"><div class="pic">${pic === "svg" ? wsIcon(c.spr) : pic ? `<img src="${pic}" alt="">` : ""}</div><div><h2>${name}</h2><p>${sub}</p>${bar >= 0 ? `<div class="bar"><i style="width:${bar}%"></i></div>` : ""}</div></div>${act ? `<div class="act">${act}</div>` : ""}</section>${seeds}`;
}
document.getElementById("side").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || busyF) return;
  if (b.dataset.sf) { SEEDF = b.dataset.sf; side(); return; }
  if (b.dataset.so) { SEEDOPEN = !SEEDOPEN; side(); return; }
  if (b.dataset.seed) { SEED = b.dataset.seed; SEEDOPEN = false; side(); return; }
  if (b.dataset.fert !== undefined) { FSEL = b.dataset.fert || null; side(); return; }
  if (b.dataset.soilClose) { SOILV = false; side(); return; }
  if (b.dataset.paint !== undefined) { PPAINT = PPAINT === b.dataset.paint ? null : b.dataset.paint; side(); return; }
  if (b.dataset.pcell) { if (PPAINT == null) { toast("塗る 種を えらんで"); return; } const i = +b.dataset.pcell; if (PPAINT === "") delete PE[i]; else PE[i] = PPAINT; PDIRTY = true; side(); return; }
  if (b.dataset.pcopy) { PE = {}; S.field.cells.forEach((c, i) => { if (c && !c.obj && !c.spr && CROP[c.id] && inField(S.field.lv, i)) PE[i] = c.id; }); PDIRTY = true; side(); return; }
  if (b.dataset.pfert !== undefined) { PFERT = b.dataset.pfert || null; side(); return; }  busyF = true;
  try {
    if (b.dataset.preClose) { if (await presetSave()) { PRESETV = false; PE = null; } }
    if (b.dataset.pslot) { if (await presetSave()) { PSLOT = +b.dataset.pslot; PE = null; } }
    if (b.dataset.psave) { if (await presetSave()) toast(`プリセット ${PSLOT + 1} に 保存した`); }
    if (b.dataset.pplant && await presetSave()) {
      const j = await act("farmv.plantPreset", { slot: PSLOT, ...(PFERT ? { fert: PFERT } : {}) });
      if (!j.ok) toast(j.why);
      else { take(j.farmv, j); PE = null; const sh = Object.entries(j.short || {}).map(([id, n]) => `${CROP[id].name} あと ${n}`); toast(`${j.planted} マス 植えた${j.fed ? `（肥料 ${j.fed}）` : ""}${sh.length ? `・足りない：${sh.slice(0, 2).join("・")}` : ""}`); }
    }
    if (b.dataset.do === "plant" && SEED) {
      const j = await act("farmv.plant", { i: SEL, id: SEED, ...(FSEL ? { fert: FSEL } : {}) });
      if (!j.ok) toast(j.why); else { take(j.farmv, j); if (!(S.seeds[SEED] > 0)) SEED = null; }
    }
    if (b.dataset.spr || b.dataset.do === "unspr") {
      const j = await act("farmv.spr", { i: SEL, ...(b.dataset.spr ? { kind: b.dataset.spr } : {}) });
      if (!j.ok) toast(j.why); else { take(j.farmv, j); toast(b.dataset.spr ? `${TOOLN[j.kind]}を 置いた` : `${TOOLN[j.kind]}を はずした（持ち物へ）`); }
    }
    if (b.dataset.soil) {
      const j = await act("farmv.soil", { soil: b.dataset.soil });
      if (!j.ok) toast(j.why); else { take(j.farmv, j); SOILV = false; toast(`${SOILS[S.field.soil].name}に した${j.paid ? `（${j.paid.toLocaleString()} クレジット）` : ""}`); opts(); }
    }
    if (b.dataset.do === "harvest" || b.dataset.do === "tap") {
      const crop = S.field.cells[SEL] && CROP[S.field.cells[SEL].id], j = await act("farmv.harvest", { i: SEL });
      if (!j.ok) toast(j.why);
      else {
        take(j.farmv, j);
        if (j.left) toast(`あと ${j.left} 回`);
        else if (j.gone) toast(j.gone === "flee" ? "逃げて しまった……" : "枯れて しまった");
        else if (j.items && j.items.length) {
          if (crop) farm.pop(SEL, crop, j.color, clockS);
          const n = j.items.reduce((a, x) => a + x.n, 0);
          toast(`${j.color === "rainbow" ? "LEGENDARY! " : j.color === "gold" ? "金色！ " : ""}${crop ? crop.name : "とれた"} ×${n}（倉庫へ）${j.seeds ? `・種 ×${j.seeds}` : ""}${j.isNew ? "・図鑑に のった！" : ""}${j.ups ? `・農業 Lv${j.lv}！` : ""}`);
        }
      }
    }
  } finally { busyF = false; }
  farm.show(S.field, now()); side(); head();
});
// まとめて とる（鹿さんの 頼み、2026-11-05）
document.getElementById("allget").addEventListener("click", async (e) => {
  const b = e.currentTarget; if (busyF) return; busyF = true; b.disabled = true;
  try {
    const j = await act("farmv.harvestAll");
    if (!j.ok) toast(j.why);
    else {
      take(j.farmv, j);
      for (const g of j.got) if (CROP[g.crop]) farm.pop(g.i, CROP[g.crop], g.color, clockS);
      const by = {}; for (const g of j.got) { const k = g.crop || g.mat; by[k] = (by[k] || 0) + g.n; }
      const names = Object.entries(by).sort((a, x) => x[1] - a[1]).map(([id, n]) => `${CROP[id] ? CROP[id].name : MAT_NAME[id] || id} ×${n}`);
      const gold = j.got.filter((g) => g.color === "gold").length, rain = j.got.filter((g) => g.color === "rainbow").length;
      toast(`${rain ? "LEGENDARY! " : gold ? "金色！ " : ""}${names.length ? `${names.slice(0, 3).join("・")}${names.length > 3 ? ` ほか ${names.length - 3}` : ""}（倉庫へ）` : ""}${j.cleared ? `${names.length ? "・" : ""}枯れた 物 ${j.cleared} こを 片づけた` : ""}${j.seeds ? `・種 ×${j.seeds}` : ""}${j.news.length ? "・図鑑に のった！" : ""}${j.ups ? `・農業 Lv${j.lv}` : ""}`);
    }
  } finally { busyF = false; }
  farm.show(S.field, now()); side(); head();

let tt; function toast(s) { const el = document.getElementById("toast"); el.textContent = s; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 2600); }

// 3D の 下の えらぶ 物：土と スキン（押すと 次へ）
function opts() {
  const f = S.field, s = SOILS[f.soil] || SOILS.normal;
  document.getElementById("opts").innerHTML = `<button class="opt" data-o="preset"><small>プリセット</small>植える</button><button class="opt" data-o="soil"><small>土</small>${s.name}</button><button class="opt" data-o="skin"><small>スキン</small>${SKINS[S.skin].name}</button>${SPEED > 1 ? `<span class="opt"><small>見本</small>×${SPEED}</span>` : ""}`;
}
document.getElementById("opts").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || busyF) return; busyF = true;
  try {
    if (b.dataset.o === "skin") { const k = Object.keys(SKINS), j = await act("farmv.skin", { skin: k[(k.indexOf(S.skin) + 1) % k.length] }); if (!j.ok) toast(j.why); else { take(j.farmv, j); buildFarm(); } }
    if (b.dataset.o === "preset") { if (PRESETV && !(await presetSave())) return; PRESETV = !PRESETV; SOILV = false; PE = null; if (PRESETV && innerWidth <= 760) requestAnimationFrame(() => document.getElementById("side").scrollIntoView({ behavior: "smooth", block: "start" })); }   // プリセットは 右（スマホは 下）
    if (b.dataset.o === "soil") { PRESETV = false; SOILV = !SOILV; if (SOILV && innerWidth <= 760) requestAnimationFrame(() => document.getElementById("side").scrollIntoView({ behavior: "smooth", block: "start" })); }   // 土は 右（スマホは 下）で えらんで 買う
  } finally { busyF = false; }
  opts(); side();
});

// ---------- 上：農業の Lv と タブ ----------
function head() {
  const f = S.field, [w, h] = fieldSize(f.lv);
  document.getElementById("lv").innerHTML = `農業 <b>Lv${f.lv}</b><span class="xp" aria-label="経験"><i style="width:${Math.round((f.xp / xpNext(f.lv)) * 100)}%"></i></span><small style="color:var(--soft);font-weight:700">${w}×${h}</small>`;
  const ripe = f.cells.filter((c, i) => c && inField(f.lv, i) && (c.obj || (!c.spr && ["ripe", "over"].includes(stageAt(c, now(), f.soil).stage)))).length;
  document.querySelector('[data-tab="field"]').innerHTML = `畑${ripe ? `<span class="n" aria-label="とれる ${ripe}">${ripe}</span>` : ""}`;
  // まとめて とる（カード「ぜんぶ」）：実った 物・かわった 物・放っておいた 物（門番の farmv.harvestAll と 同じ 数え方）。ボタンは いつも 出す（0 の ときは 押せない）
  const ready = f.cells.filter((c, i) => c && !c.spr && inField(f.lv, i) && (c.obj || (CROP[c.id] && ["ripe", "over"].includes(stageAt(c, now(), f.soil).stage)))).length, ag = document.getElementById("allget");
  ag.hidden = false; ag.disabled = !ready || busyF; ag.innerHTML = `まとめて とる <b>${ready}</b>`;
  document.querySelector('[data-tab="book"]').innerHTML = `図鑑<span class="n" style="background:var(--sky)">${S.known.length}/${CROPS.length}</span>`;
}
document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === b));
  for (const k of ["field", "book", "board"]) document.getElementById("tab-" + k).hidden = k !== b.dataset.tab;
  if (b.dataset.tab === "book") book(); if (b.dataset.tab === "field") { size(); }
});

// ---------- 図鑑：島と 種類で しぼる・ならべる ----------
let BI = "all", BK = "all", BS = "no";
function book() {
  const K = known(), byIsle = (i) => CROPS.filter((c) => i === "all" || c.isle === +i), base = byIsle(BI);
  const list = base.filter((c) => BK === "all" || c.kind === BK).slice().sort((a, b) => BS === "h" ? a.h - b.h : BS === "got" ? (K.has(b.id) - K.has(a.id)) : 0);
  const chip = (grp, k, l, n) => `<button class="chip" data-${grp}="${k}" aria-pressed="${(grp === "bi" ? BI : grp === "bk" ? BK : BS) === k}" ${n === 0 ? "disabled" : ""}>${l}${n !== undefined ? `<i>${n}</i>` : ""}</button>`;
  const isles = [...new Set(CROPS.map((c) => c.isle))];
  document.getElementById("tab-book").innerHTML = `<div class="filter">
    <div class="row"><span>島</span>${chip("bi", "all", "ぜんぶ", CROPS.length)}${isles.map((i) => chip("bi", String(i), ["", "マッサラ島", "ビサイ諸島", "ミカネル島"][i] || `島 ${i}`, byIsle(i).length)).join("")}</div>
    <div class="row"><span>種類</span>${chip("bk", "all", "ぜんぶ", base.length)}${Object.keys(KIND).map((k) => chip("bk", k, KIND[k].label, base.filter((c) => c.kind === k).length)).join("")}</div>
    <div class="row"><span>並べる</span>${chip("bs", "no", "番号")}${chip("bs", "got", "のった 順")}${chip("bs", "h", "育つ 時間")}</div></div>
    <div class="cards">${list.map((c) => { const got = K.has(c.id), par = c.from ? c.from.map((p) => (K.has(p) ? CROP[p].name : "？")).join(" × ") : `種から・農業 Lv${c.lv}`;
      return `<div class="card ${got ? "" : "no"}"><img src="${cropPic(c, "ripe", { scale: 3 })}" alt=""><div><b>${got ? c.name : "？？？"}</b><small>${par}</small></div></div>`; }).join("")}</div>`;
}
document.getElementById("tab-book").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; if (b.dataset.bi) BI = b.dataset.bi; if (b.dataset.bk) BK = b.dataset.bk; if (b.dataset.bs) BS = b.dataset.bs; book(); });

// ---------- 動かす（かけ合わせは 門番が 1 時間ごとに 決める。画面は 1 分ごとに 聞きなおす） ----------
let clockS = 0, last = 0, lastAsk = performance.now();
async function ask() {
  if (busyF) return; busyF = true;
  try { const n0 = S.field.cells.filter((c) => c && c.cross).length, j = await act("farmv.view"); if (j && j.ok) { take(j.farmv, j); if (S.field.cells.filter((c) => c && c.cross).length > n0) toast("かけ合わせの 芽が 出た"); } }
  finally { busyF = false; }
  side(); head();
}
// 描くのは 収穫の 演出の 最中だけ 毎こま。ふだんは 1 秒に 15 こま（えらんだ マスの 光る わくが ゆっくり 光るだけなので）
let lastR = -1e9;
function loop(ms) {
  clockS = ms / 1000;
  if (ms - last > 1000) { last = ms; if (farm.show(S.field, now())) head(); if (ms - lastAsk > 60000) { lastAsk = ms; ask(); } }
  if (farm.busy() || ms - lastR > 66) { lastR = ms; farm.tick(clockS); r.render(sc, cam); }
  requestAnimationFrame(loop);
}
addEventListener("resize", size);
buildFarm(); size(); opts(); side(); head();
requestAnimationFrame(loop);
window.farmDebug = { select: (i) => { SEL = i; farm.select(i); side(); }, mem: () => ({ ...r.info.memory, calls: r.info.render.calls }) };   // 見本の 確かめ用（マスを えらぶ・描く 物の 数）
window.ready = true;
</script>
