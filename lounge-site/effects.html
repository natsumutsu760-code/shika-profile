<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buffs and Debuffs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：バフ・デバフ（状態）の 効果の 一覧。
     2026-11-16 鹿さん「バフ、デバフの効果の一覧が必要です。詳細な効果をプレイヤーは理解していないためです。」
     中身は 戦いの 決まりの データ（effects.js）から そのまま 作る（説明の 文・持続・上限・ボスの 抵抗・打ち消し合う 相手）。数を 2 か所に 書かない */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }
  button, a, input { font:inherit; color:inherit; }
  button, a { cursor:pointer; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.9); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 20px); }

  /* ---- ペットの頭（覚えたスキルの 画面と 同じ） ---- */
  .pet { display:grid; grid-template-columns:60px 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #E4F7EE 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:150%; margin-top:-4%; }
  .pet h1 { margin:0; font:900 24px/1.1 var(--jp); display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }
  .pet .meta { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }

  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }
  /* ツリー｜覚えたスキル｜バフ・デバフ（スキルツリーの 画面と 同じ） */
  .vtabs { display:flex; gap:6px; margin:0 0 4px; flex-wrap:wrap; }
  .vtabs > * { display:inline-flex; align-items:center; min-height:36px; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 14px; font:700 14px/1 var(--jp); color:var(--ink); text-decoration:none; }
  .vtabs [aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:0 4px 0 rgba(27,35,64,.2); }
  @media (max-width:480px) { .vtabs { display:grid; grid-template-columns:1fr 1fr; } .vtabs > * { justify-content:center; padding:7px 8px; } }   /* タブ 4 つ（覚えたツリーを 足した。2026-11-18）は スマホで 2 × 2 */
  /* バフ・デバフの タブ */
  .ktabs { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin:10px 0 8px; }   /* バフ｜デバフ｜カウント（2026-11-27 鹿さんの カード「カウントの タブを 足す」） */
  .ktabs button { min-height:40px; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:8px 10px; font:700 14px/1 var(--jp); color:var(--ink); white-space:nowrap; }
  .ktabs button[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:0 4px 0 rgba(27,35,64,.2); }
  .find { display:flex; margin:0 0 8px; }
  .find input { flex:1; min-width:0; min-height:40px; border:1.5px solid var(--line); border-radius:12px; padding:8px 12px; background:#fff; font:700 14px/1.2 var(--jp); }
  .fline { display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin:0 0 8px; } .fline .gap { flex:1; }
  .chip { border:1.5px solid var(--line); background:#fff; border-radius:999px; min-height:32px; padding:5px 10px; font:700 12px/1 var(--jp); display:inline-flex; align-items:center; gap:5px; }
  .chip small { font:600 12px/1 var(--num); color:var(--soft); }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; } .chip[aria-pressed="true"] small { color:rgba(255,255,255,.7); }
  .chip:disabled { opacity:.4; }
  .note { margin:0 0 12px; font:700 12px/1.6 var(--jp); color:var(--soft); }

  /* 効果 1 つ ＝ 1 まい：名前・効き方の 札・説明・持続／上限／ボス／相手 */
  ul.cards { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap:8px; }
  .card { border:1.5px solid var(--line); border-radius:16px; background:#fff; padding:10px 12px; box-shadow:inset 4px 0 0 var(--c); min-width:0; }
  .card .t { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .card b { font:900 15px/1.35 var(--jp); }
  .card .kind { margin-left:auto; flex:none; font:700 12px/1 var(--jp); color:var(--c); border:1.5px solid var(--c); border-radius:999px; padding:3px 8px; white-space:nowrap; }
  .card p { margin:4px 0 0; font:500 13px/1.6 var(--jp); overflow-wrap:anywhere; }
  .card .facts { margin:6px 0 0; padding:0; list-style:none; display:flex; flex-wrap:wrap; gap:4px 6px; }
  .card .facts li { font:700 12px/1.4 var(--jp); color:var(--soft); background:var(--space); border-radius:8px; padding:3px 7px; }
  .card .facts li b { font:900 12px/1.4 var(--jp); color:var(--ink); }
  .card .lab { font:900 12px/1 var(--jp); color:var(--c); margin-right:6px; }
  h3.grp { display:flex; align-items:center; gap:8px; margin:12px 0 6px; font:900 14px/1.2 var(--jp); color:var(--violet); } h3.grp:first-of-type { margin-top:4px; } h3.grp::after { content:""; flex:1; height:1.5px; background:var(--line); }
  .lead { margin:8px 0; color:var(--soft); font:700 13px/1.6 var(--jp); }

  @media (max-width:820px) {
    .pet { grid-template-columns:48px 1fr; padding:6px 12px 6px 6px; gap:10px; border-radius:18px; }
    .pet .pic { width:48px; height:48px; border-radius:12px; } .pet h1 { font-size:20px; } .pet h1 small { font-size:12px; }
  }
</style>
</head>
<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ ペット</small></header>
<main id="app"></main>
<script type="module">
import "./lounge-en.js";   // 英語の 画面（効果の 名前と 説明の 英語は lounge-en-names.js の FX_EN）
import { me } from "./lounge-client.js";
import { mountWallet } from "./wallet-bar.js"; mountWallet();
import { petInfo, linkTabs, addGateCss } from "./pet-head.js";
import { TYPES } from "./skills.js";
import { EFFECTS, PAIR } from "./effects.js";
import { COUNTS, COUNT_INFO, COUNT_RULE, countLabel } from "./main-trees.js";   // カウント（帯電・コイン など。技で ためて 使う 数）

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let ME = null; try { ME = await me(); } catch (e) {}
const MP = ME && ME.pets && ME.pets[0];
const QS = new URLSearchParams(location.search);
const UI = { side: QS.get("c") ? "count" : QS.get("d") ? "debuff" : "buff", kind: "all", q: "", sort: "game" };
const CNT = Object.keys(COUNTS).map((id, i) => ({ id, label: countLabel(id), i, ...COUNT_INFO[id] }));

// 効き方（しぼりこみの チップ）。能力の 上昇・減少は まとめて「能力」
const KIND = [["stack", "量で 効く"], ["turn", "ターンの あいだ"], ["value", "ダメージを 吸収"], ["once", "1 回だけ"], ["stat", "能力の 上下"]];
const kindOf = (E) => (E.stat ? "stat" : E.dur);
const ALL = Object.entries(EFFECTS).filter(([, E]) => !E.unused).map(([id, E], i) => ({ id, E, i, side: E.buff ? "buff" : "debuff", kind: kindOf(E) }));
// 持続：技で ターンを 決めない ときの 長さ（effects.js の base）
const span = (b) => (Array.isArray(b) ? `${b[0]}〜${b[1]} ターン` : `${b} ターン`);
function facts(E, id) {
  const f = [];
  if (E.dur === "turn") f.push(E.base == null ? "技で 決めた ターン" : span(E.base));
  else if (E.dur === "stack") f.push(E.base == null ? "量が なくなるまで" : span(E.base));
  else if (E.dur === "value") f.push(E.base == null ? "吸収しきるまで" : span(E.base));
  else if (E.dur === "once") f.push("1 回 効くまで");
  if (E.ext) f.push("重ねると +1 ターン");
  if (E.cap === "hp") f.push("上限 最大 HP"); else if (typeof E.cap === "number") f.push(`上限 ${E.cap}`);
  if (E.bossRes) f.push(`ボスは ${E.bossRes}% で 防ぐ`);
  const p = PAIR[id];
  if (p && EFFECTS[p]) f.push(`${E.dur === "stack" ? "打ち消し合う：" : "後から 付けた 方が 残る："}<b>${esc(EFFECTS[p].label)}</b>`);
  return f;
}

// カウントの タブ：さがす・決まりの 1 行・1 つ 1 まい（どの ツリーの 物か・たまる・使う）
function countBody(q) {
  const shown = CNT.filter((x) => !q || [x.label, x.tree, x.gain, x.use].some((t) => t.includes(q)));
  const card = (x) => `<li class="card" style="--c:var(--violet)"><div class="t"><b>${esc(x.label)}</b></div>
      <p><span class="lab">たまる</span>${esc(x.gain)}</p><p><span class="lab">使う</span>${esc(x.use)}</p></li>`;
  const trees = [...new Set(shown.map((x) => x.tree))];   // ツリーの 順（カウントの 表の 順）
  return `<div class="find"><input id="q" type="search" placeholder="名前や 効果で さがす" aria-label="名前や 効果で さがす" value="${esc(UI.q)}"></div>
    <p class="note">${esc(COUNT_RULE)}</p>
    ${shown.length ? trees.map((t) => `<h3 class="grp">${esc(t)}</h3><ul class="cards">${shown.filter((x) => x.tree === t).map(card).join("")}</ul>`).join("") : `<p class="lead">当てはまる 物が ない</p>`}`;
}

function render() {
  const head = MP && MP.type ? (() => { const info = petInfo(MP), ty = TYPES[MP.type]; return `
  <section class="panel pet" aria-label="ペット">
    <div class="pic"><img src="${info.img}" alt="${esc(info.label)}の${esc(MP.name)}"></div>
    <div><h1>${esc(MP.name)}<small>${esc(info.label)} ／ ${esc(ME.name)} の相棒</small></h1><div class="meta"><span class="badge" style="--c:${ty.color}">${ty.label}</span><span class="lv"><small>Lv</small>${MP.lv}</span></div></div>
  </section>`; })() : "";
  const mine = ALL.filter((x) => x.side === UI.side);
  const q = UI.q.trim(), hit = (x) => !q || x.E.label.includes(q) || (x.E.text || "").includes(q);
  const nK = (k) => mine.filter((x) => (k === "all" || x.kind === k) && hit(x)).length;
  const order = (x) => KIND.findIndex(([k]) => k === x.kind);
  const shown = mine.filter((x) => (UI.kind === "all" || x.kind === UI.kind) && hit(x)).sort((a, b) => (UI.sort === "kind" ? order(a) - order(b) : 0) || a.i - b.i);
  const chip = (k, label) => { const n = nK(k); return `<button class="chip" data-kind="${k}" aria-pressed="${UI.kind === k}" ${n === 0 && UI.kind !== k ? "disabled" : ""}>${label}<small>${n}</small></button>`; };
  const kinds = KIND.filter(([k]) => mine.some((x) => x.kind === k));
  const card = (x) => { const c = x.side === "buff" ? "var(--leaf)" : "var(--coral)";
    return `<li class="card" style="--c:${c}"><div class="t"><b>${esc(x.E.label)}</b><span class="kind">${KIND.find(([k]) => k === x.kind)[1]}</span></div>
      <p>${esc(x.E.text || "")}</p><ul class="facts">${facts(x.E, x.id).map((s) => `<li>${s}</li>`).join("")}</ul></li>`; };
  return `${head}
  <nav class="tabs" role="tablist"><button role="tab" aria-selected="false">ステータス</button><button role="tab" aria-selected="true">スキルツリー</button><button role="tab" aria-selected="false">ガンビット</button><button role="tab" aria-selected="false">装備</button><button role="tab" aria-selected="false">冒険</button><button role="tab" aria-selected="false">なかま</button></nav>
  <section class="panel" aria-label="バフ・デバフ">
    <div class="vtabs" role="tablist" aria-label="スキルツリーの 見かた"><a role="tab" aria-selected="false" href="skilltree.html">ツリー</a><a role="tab" aria-selected="false" href="skilltree.html?view=mine">覚えたツリー</a><a role="tab" aria-selected="false" href="learned.html">覚えたスキル</a><button role="tab" aria-selected="true">バフ・デバフ</button></div>
    <div class="ktabs" role="tablist" aria-label="バフ・デバフ・カウント"><button role="tab" data-side="buff" aria-selected="${UI.side === "buff"}">バフ ${ALL.filter((x) => x.side === "buff").length}</button><button role="tab" data-side="debuff" aria-selected="${UI.side === "debuff"}">デバフ ${ALL.filter((x) => x.side === "debuff").length}</button><button role="tab" data-side="count" aria-selected="${UI.side === "count"}">カウント ${CNT.length}</button></div>
    ${UI.side === "count" ? countBody(q) : `
    <div class="find"><input id="q" type="search" placeholder="名前や 効果で さがす" aria-label="名前や 効果で さがす" value="${esc(UI.q)}"></div>
    <div class="fline" role="group" aria-label="しぼりこみと ならべかた">${chip("all", "すべて")}${kinds.map(([k, l]) => chip(k, l)).join("")}<span class="gap"></span>
      <button class="chip" data-do="sort" aria-label="ならべかた：${UI.sort === "game" ? "ふつうの 順（押すと 効き方で まとめる）" : "効き方で まとめる（押すと ふつうの 順）"}">⇅ ${UI.sort === "game" ? "ふつうの 順" : "効き方で まとめる"}</button></div>
    <p class="note">量：重ねるほど 強く なる 数（効くと 半分に なる 物が 多い）。ターン：技で 決めて いない ときの 長さ</p>
    ${shown.length ? `<ul class="cards">${shown.map(card).join("")}</ul>` : `<p class="lead">当てはまる 物が ない</p>`}`}
  </section>`;
}
addGateCss();
function paint(keep) {
  const app = document.getElementById("app"), had = keep && document.activeElement && document.activeElement.id === "q", pos = had ? document.activeElement.selectionStart : 0;
  app.innerHTML = render(); linkTabs();
  if (had) { const i = document.getElementById("q"); i.focus(); try { i.setSelectionRange(pos, pos); } catch (e) {} }   // さがす 字を 打って いる あいだは 字の 場所を のこす
}
const app = document.getElementById("app");
app.addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.side) { UI.side = d.side; UI.kind = "all"; return paint(); }
  if (d.kind) { UI.kind = d.kind; return paint(); }
  if (d.do === "sort") { UI.sort = UI.sort === "game" ? "kind" : "game"; return paint(); }
});
app.addEventListener("input", (e) => { if (e.target.id === "q") { UI.q = e.target.value; paint(true); } });
paint();
window.ready = true;
</script>
</body>
</html>
