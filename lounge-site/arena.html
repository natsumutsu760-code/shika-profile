<style>
  /* MONO LINK のラウンジ：闘技場（鹿さんの頼み、2026-10-25。プライベートラウンジの PVP）
     タブ：デュエル（相手 3 人を 大きく：格下・同じくらい・格上。鹿さんの決め）・トーナメント（毎日 22:00・6 人から）・記録

     戦いは 3D の 2 匹（battle-view.js。帯の 試作と 同じ 動き）。決まりは arena.js、記録と くじは 門番 */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF; --gold:#E0A21C; --ar:#D9483B;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif; --pop:"Dela Gothic One", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); word-break:auto-phrase; text-wrap:pretty; }
  button { font:inherit; color:inherit; cursor:pointer; } button:disabled { cursor:not-allowed; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  h1, h2, h3, p, ul { margin:0; padding:0; } ul { list-style:none; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }

  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; } .top small a { color:inherit; }
  main { max-width:1060px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 48px; }
  .panel { background:rgba(255,255,255,.92); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 20px); }
  /* ペットの 札と タブ（ほかの ペットの 画面と 同じ） */
  .pet { display:grid; grid-template-columns:60px auto 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #FFF4D6 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:120%; margin-top:4%; }

  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }

  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }
  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }
  /* 闘技場 */
  .ahead { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:14px; }
  .ahead h2 { font:400 24px/1 var(--pop); margin-right:auto; letter-spacing:.04em; }
  .gtabs { display:flex; flex-wrap:wrap; gap:6px; }
  .gtabs button { display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:#fff; border-radius:999px; min-height:34px; padding:8px 16px; font:800 14px/1 var(--jp); color:var(--soft); }
  .gtabs button[aria-selected="true"] { background:var(--ar); color:#fff; border-color:var(--ar); }

  .why { font:700 13px/1.5 var(--jp); color:var(--coral); text-align:center; }
  .bar { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin-bottom:12px; font:700 13px/1.4 var(--jp); color:var(--soft); }
  .bar b { font:600 18px/1 var(--num); color:var(--ink); margin:0 2px; } .bar .mini { margin-left:auto; }
  .foes { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }

  .foe.down .tier { background:#5FA8E8; } .foe.even .tier { background:#8E96AC; } .foe.up .tier { background:var(--ar); }

  .foe .meta { display:flex; gap:8px; align-items:center; }

  .foe .pay { min-height:26px; font:600 18px/1.3 var(--num); color:#0E8F5A; } .foe .pay small { font:800 12px/1 var(--jp); } .foe .pay.none { font:800 12px/26px var(--jp); color:var(--soft); }
  .foe .jelly { margin-top:4px; }

  .stage .bv::before { content:""; position:absolute; left:0; right:0; top:440px; bottom:0; background:linear-gradient(180deg, #C9A06A, #9C7446); border-top:4px solid #14164A; }
  .stage .bv::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 80px); pointer-events:none; }
  .fctl { display:flex; gap:8px; justify-content:flex-end; }

  .result.win { background:linear-gradient(135deg, #FFF4D6, #FFE9E4); box-shadow:inset 0 0 0 2px #FFC9A8; } .result.lose { background:var(--space); box-shadow:inset 0 0 0 2px var(--line); }
  .result .big { font:400 30px/1 var(--pop); color:var(--ar); } .result.lose .big { color:var(--soft); }
  .result p { font:800 14px/1.5 var(--jp); } .result p b { font:600 20px/1 var(--num); color:#0E8F5A; }
  /* トーナメント */
  .tour { display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(0, 1fr); gap:14px; align-items:start; }
  .box { padding:16px 18px; border-radius:20px; background:var(--space); display:grid; gap:10px; }
  .box h3 { font:900 16px/1.3 var(--jp); display:flex; align-items:baseline; gap:10px; } .box h3 small { font:700 12px/1 var(--jp); color:var(--soft); }
  .clock { font:600 34px/1 var(--num); } .clock small { font:800 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  .count { font:800 14px/1.5 var(--jp); } .count b { font:600 22px/1 var(--num); margin-right:2px; } .count small { color:var(--soft); font-size:12px; }
  .meter { height:10px; border-radius:99px; background:#E3E8F2; overflow:hidden; } .meter i { display:block; height:100%; background:var(--ar); border-radius:inherit; }
  .prize { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font:700 13px/1.5 var(--jp); } .prize span:nth-child(odd) { color:var(--soft); font-weight:800; }
  .round { display:grid; gap:6px; } .round + .round { margin-top:8px; }
  .round h4 { margin:0; font:900 12px/1.3 var(--jp); color:var(--soft); }
  .mt { display:grid; grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr) auto; gap:8px; align-items:center; padding:7px 10px; border-radius:14px; background:#fff; font:700 13px/1.3 var(--jp); }
  .mt span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .mt span:nth-child(3) { text-align:right; }
  .mt .w { color:var(--ar); font-weight:900; } .mt .l { color:#9AA1B8; } .mt .me { text-decoration:underline; text-decoration-thickness:2px; }

  .rec div { padding:12px 16px; border-radius:18px; background:var(--space); font:800 12px/1.4 var(--jp); color:var(--soft); }
  .rec div b { display:block; font:600 26px/1.1 var(--num); color:var(--ink); }

  .log li:last-child { border-bottom:0; } .log .ic { font-size:18px; text-align:center; } .log small { font:600 12px/1 var(--num); color:var(--soft); }
  .log .ok { color:#0E8F5A; font-weight:900; } .log .ng { color:#9AA1B8; font-weight:900; }
  /* 格付け・LINKERS の 契約（2026-11-11）*/
  .rank { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.2fr); gap:14px; align-items:start; }
  .rk { display:flex; align-items:center; gap:16px; } .rk .ltr { font:400 64px/1 var(--pop); color:var(--ar); min-width:56px; text-align:center; } .rk.d .ltr { color:#9AA1B8; }
  .rk p { font:800 13px/1.5 var(--jp); color:var(--soft); } .rk p b { font:600 26px/1.1 var(--num); color:var(--ink); margin-right:4px; }
  .ladder { display:flex; gap:6px; flex-wrap:wrap; } .ladder span { padding:3px 10px; border-radius:99px; background:#fff; font:800 12px/1.4 var(--jp); color:var(--soft); } .ladder span.on { background:var(--ar); color:#fff; }

  .offer b { font:900 15px/1.3 var(--jp); } .offer small { grid-column:1; font:700 12px/1.4 var(--jp); color:var(--soft); } .offer .jelly { grid-row:1 / span 2; grid-column:2; width:auto; padding:10px 16px; }

    .foe .meta { flex-wrap:wrap; gap:4px 8px; } .foe .pay small { display:block; }
    .foe { grid-template-columns:64px minmax(0, 1fr) auto; justify-items:start; text-align:left; gap:2px 12px; padding:12px 14px; }
    .foe .tier { position:static; transform:none; grid-column:2; justify-self:start; }

    .foe h3, .foe .own, .foe .meta, .foe .pw { grid-column:2; }

    .result { grid-template-columns:minmax(0, 1fr); text-align:center; }

  }
  /* モンスターの 闘技場（2026-11-23 鹿さんの カード「案 A ペット｜モンスター」）：見出しの 下で 切りかえ・タブの 上に 代表の 子 */

<script type="module">

  const V = S.V;
  if (V.beat.includes(c.id)) return `<p class="pay none">きょうは もらった</p>`;
  if (V.left.paid <= 0) return `<p class="pay none">ごほうび なし</p>`;
  const p = duelPay(V.me.power, c.power), bonus = (V.lk && V.lk.bonus) || 0;   // ファイトマネーの 上乗せ（契約・家具）

}

}

function fightHtml() {

function resultHtml() {
  const F = S.fight, r = F.r;

// 3D で 見せる（門番と 同じ 種で 計算しなおす。ちがう 結果に なったら 3D は 出さずに 結果だけ）
// モンスターの 姿（ドット絵の 板。battle-view が 右の 子を 左へ 向けるので、板は カメラへ 向け直す）
function monBoard(THREE, f, i) {
  const g = new THREE.Group(), inner = new THREE.Group(); inner.rotation.y = i ? 0.9 : -0.9; inner.rotation.x = -0.12; g.add(inner);
  const tex = new THREE.TextureLoader().load(monImg(f)); tex.colorSpace = THREE.SRGBColorSpace; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
  if (i === 0) { tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; }   // 左の 子は 右を 向く
  const S2 = 1.35, plane = new THREE.Mesh(new THREE.PlaneGeometry(S2, S2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1, side: THREE.DoubleSide }));
  plane.position.y = S2 / 2 + 0.02; inner.add(plane);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(0.42, 32), new THREE.MeshBasicMaterial({ color: "#000000", transparent: true, opacity: 0.22 })); sh.rotation.x = -Math.PI / 2; sh.position.y = 0.01; g.add(sh);
  return g;
}
async function showFight(A, B, seed, win) {
  const host = document.getElementById("stage");
  if (simulate(A, B, seed).at(-1).winner !== (win ? 0 : 1)) { S.fight.done = true; host.remove(); document.getElementById("fctl").innerHTML = ""; document.getElementById("res").innerHTML = resultHtml(); return; }
  try {
    const { mountBattle } = await import("./battle-view.js");
    const narrow = host.clientWidth < 600, geo = narrow ? { W: 640, H: 520, S: 125, home: [200, 440], plates: "top", turnY: 456, winY: 230 } : {};   // スマホ：名札は 上の 左右（縮みすぎない ように はばを せまく）
    const mon = !A.species && !B.species && (A.tree || B.tree), THREE = mon ? await import("three") : null;   // モンスターどうし：ドット絵の 板
    S.fight.view = mountBattle(host, { A, B, seed }, { ...geo, ...(mon ? { make: [(f) => monBoard(THREE, f, 0), (f) => monBoard(THREE, f, 1)] } : {}), onEnd: () => { S.fight.done = true; document.getElementById("fctl").innerHTML = ""; document.getElementById("res").innerHTML = resultHtml(); document.getElementById("res").scrollIntoView({ block: "nearest" }); } });
    S.fight.view.play();
  } catch (e) { S.fight.done = true; host.remove(); document.getElementById("fctl").innerHTML = ""; document.getElementById("res").innerHTML = resultHtml(); }
}

function bracketHtml(T, myId) {
  const name = (x) => (x ? `${esc(x.pet)}<small style="color:var(--soft)">（${esc(x.name)}）</small>` : "—");
  const rows = [...T.rounds.map((R, r) => ({ R, r }))].reverse().map(({ R, r }) => `<div class="round"><h4>${roundName(R.length * 2)}</h4>${R.map((m, k) => {
    if (m.bye) return "";
    const ca = m.w === 0 ? "w" : m.w === 1 ? "l" : "", cb = m.w === 1 ? "w" : m.w === 0 ? "l" : "";
    return `<div class="mt"><span class="${ca} ${m.a && m.a.id === myId ? "me" : ""}">${name(m.a)}</span><i>VS</i><span class="${cb} ${m.b && m.b.id === myId ? "me" : ""}">${name(m.b)}</span>${m.w != null ? `<button class="mini" ${S.mode === "mon" ? "data-mmatch" : "data-match"}="${r}:${k}">見る</button>` : "<span></span>"}</div>`;
  }).join("")}</div>`);
  return rows.slice(0, 2).join("") + (rows.length > 2 ? `<details class="more"><summary>${roundName(T.rounds[T.rounds.length - 3].length * 2)}から 見る</summary>${rows.slice(2).join("")}</details>` : "");
}
const PLACE = { 1: "優勝！", 2: "準優勝！", 4: "ベスト 4！", 0: "参加" };
function tourHtml() {
  const mon = S.mode === "mon", V = mon ? S.M : S.V, T = V.tour, L = V.last, myId = V.me && V.me.id, TT = mon ? MTOUR : TOUR, PAY = mon ? MTOUR_PAY : TOUR_PAY, ent = mon ? "data-mentry" : "data-entry";
  if (mon && S.fight) return fightHtml();
  if (mon && !V.me) return "";   // 代表を えらぶ 案内は 上の 札
  const pay = (k) => { const P = PAY[k]; return `${fmt(P.credits)} クレジット${P.res ? `＋アメジスト ${P.res}` : ""}`; };
  const now = T ? `<div class="box"><h3>きょうの 大会<small>${TT.hour}:00 から</small></h3>
      <p class="clock" id="clock">${left(T.at - Date.now())}<small>あと</small></p>
      <p class="count"><b>${T.n}</b> 人 <small>／ ${TT.min} 人から ひらく（${TT.max} 人まで）</small></p><div class="meter"><i style="width:${Math.min(100, (T.n / TT.min) * 100)}%"></i></div>
      ${T.entered ? `<button class="jelly light" ${ent}="0">参加を やめる</button>` : `<button class="jelly" ${ent}="1" ${T.n >= TT.max ? "disabled" : ""}>参加する</button>`}
      <div class="prize"><span>優勝</span><span>${pay(1)}</span><span>準優勝</span><span>${pay(2)}</span><span>ベスト 4</span><span>${pay(4)}</span><span>参加</span><span>${pay("all")}</span></div></div>` : "";
  const last = !L ? `<div class="box"><h3>前の 大会</h3><p class="count"><small>まだ ない</small></p></div>`
    : L.state === "none" ? `<div class="box"><h3>前の 大会<small>${esc(L.day)}</small></h3><p class="count"><small>${TT.min} 人 そろわず 中止</small></p></div>`

// 一覧（代表を えらぶ・試すの 子を えらぶ）：しゅるいの チップ・ならべる
const SORTS = [["pow", "強さ順"], ["plus", "＋値順"], ["name", "名前順"]];
function pickList() {
  const P = S.pick || (S.spick ||= { type: "all", sort: "pow", for: "self" }), L = S.list || [];
  const sorter = P.sort === "plus" ? (a, b) => (b.plus || 0) - (a.plus || 0) || b.power - a.power : P.sort === "name" ? (a, b) => a.name.localeCompare(b.name, "ja") : (a, b) => b.power - a.power;
  return L.filter((c) => P.type === "all" || c.type === P.type).sort(sorter);
}
function fline() {
  const P = S.pick || (S.spick ||= { type: "all", sort: "pow", for: "self" }), L = S.list || [], types = [...new Set(L.map((c) => c.type))].filter((t) => TYPES[t]);

  return `<div class="fline">${chip("all", "すべて", L.length)}${types.length > 1 ? types.map((t) => chip(t, TYPES[t].label, L.filter((c) => c.type === t).length)).join("") : ""}<span class="gap"></span>${SORTS.map(([k, l]) => `<button class="chip" data-psort="${k}" aria-pressed="${P.sort === k}">${l}</button>`).join("")}</div>`;
}

}
function selfResHtml() {
  const R = S.self, C = R.cards, nm = (u) => (u ? `<span class="ms"><img src="${monImg(C[u])}" alt=""><span>${esc(C[u].name)}</span></span>` : "<span>—</span>");
  const rows = [...R.rounds.map((Rd, r) => ({ Rd, r }))].reverse().map(({ Rd, r }) => `<div class="round"><h4>${roundName(Rd.length * 2)}</h4>${Rd.map((m, k) => `<div class="mt">${nm(m.a).replace('class="ms"', `class="ms ${m.w === 0 ? "w" : "l"}"`)}<i>VS</i>${nm(m.b).replace('class="ms"', `class="ms ${m.w === 1 ? "w" : "l"}"`)}<button class="mini" data-smatch="${r}:${k}">見る</button></div>`).join("")}</div>`);
  const c = C[R.champ];
  return `<div class="pk"><div class="sbar"><div class="champ"><span class="spr"><img src="${monImg(c)}" alt=""></span><p class="place">優勝！ ${esc(c.name)}</p></div><button class="mini" data-do="sagain">もう 1 回</button><button class="mini" data-do="snew">えらびなおす</button></div>
    ${rows.slice(0, 2).join("")}${rows.length > 2 ? `<details class="more"><summary>${roundName(R.rounds[R.rounds.length - 3].length * 2)}から 見る</summary>${rows.slice(2).join("")}</details>` : ""}</div>`;
}
function mFoeHtml(c) {
  const M = S.M, t = tierOf(M.me.power, c.power), label = TIERS.find(([k]) => k === t)[1], over = M.left.duels <= 0;
  const pay = M.beat.includes(c.id) ? `<p class="pay none">きょうは もらった</p>` : M.left.paid <= 0 ? `<p class="pay none">ごほうび なし</p>` : (() => { const p = duelPay(M.me.power, c.power); return `<p class="pay">+${fmt(p.credits)}<small> クレジット</small>${p.res ? `<small>＋アメジスト ${p.res}</small>` : ""}</p>`; })();
  return `<article class="foe ${t}"><span class="tier">${label}</span><span class="pic mspr"><img src="${monImg(c.pet)}" alt=""></span>
    <h3>${esc(c.pet.name)}${plusTag(c.pet.plus)}</h3><p class="own">${esc(c.name)} の 代表</p><div class="meta">${badge(c.pet.type)}</div>
    <p class="pw">強さ<b>${fmt(c.power)}</b></p>${pay}<button class="jelly" data-mduel="${esc(c.id)}" ${over ? "disabled" : ""}>挑む</button></article>`;
}
function mDuelHtml() {
  const M = S.M;
  if (S.fight) return fightHtml();
  if (!M.me) return "";   // 代表を えらぶ 案内は 上の 札（1 か所）
  const bar = `<div class="bar"><span>ごほうび あと<b>${M.left.paid}</b>回</span><span>きょう あと<b>${M.left.duels}</b>回 戦える</span>${M.foes.length ? `<button class="mini" data-do="mfoes">入れかえ</button>` : ""}</div>`;
  if (!M.foes.length) return bar + `<div class="empty"><p>まだ 相手が いない（代表を えらんだ 人が 相手に なる）</p></div>`;
  return bar + `<div class="foes">${M.foes.map(mFoeHtml).join("")}</div>${M.left.duels <= 0 ? `<p class="why" style="margin-top:10px">きょうは もう ${DUEL.perDay} 回 戦った（あした また）</p>` : ""}`;
}
function mLogHtml() {
  const M = S.M, ago = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 60 ? `${m} 分前` : m < 1440 ? `${Math.floor(m / 60)} 時間前` : `${Math.floor(m / 1440)} 日前`; };
  const rows = [...M.log.map((x) => ({ at: x.at, html: `<span class="ic" aria-hidden="true">⚔</span><span>${esc(x.name)} の ${esc(x.pet)}に <span class="${x.win ? "ok" : "ng"}">${x.win ? "勝った" : "負けた"}</span>${x.pay ? `（+${fmt(x.pay.credits)}）` : ""}</span>` })),
    ...(M.def || []).map((x) => ({ at: x.at, html: `<span class="ic" aria-hidden="true">🛡</span><span>${esc(x.name)} の ${esc(x.pet)}が 来た → <span class="${x.held ? "ok" : "ng"}">${x.held ? "守った" : "やられた"}</span></span>` }))].sort((a, b) => b.at - a.at).slice(0, 20);
  return `<div class="rec"><div>デュエル<b>${M.w} 勝 ${M.l} 敗</b></div><div>留守の あいだ<b>${(M.hold && M.hold.w) || 0} 勝 ${(M.hold && M.hold.l) || 0} 敗</b></div></div>
    ${rows.length ? `<ul class="log">${rows.map((x) => `<li>${x.html}<small>${ago(x.at)}</small></li>`).join("")}</ul>` : `<div class="empty"><p>まだ 記録が ない</p></div>`}`;
}
const mTabBadge = (k) => { const M = S.M; if (!M || !M.me) return 0; if (k === "duel") return M.left.paid > 0 && M.foes.length ? M.left.paid : 0; if (k === "tour") return M.tour && M.tour.state === "open" && !M.tour.entered ? 1 : 0; return 0; };

function render() {
  const mon = S.mode === "mon" && S.M;
  const body = mon ? (S.pick && S.pick.for === "rep" ? repPickHtml() : S.tab === "duel" ? mDuelHtml() : S.tab === "tour" ? tourHtml() : S.tab === "self" ? selfHtml() : mLogHtml())
    : S.tab === "duel" ? duelHtml() : S.tab === "tour" ? tourHtml() : S.tab === "rank" ? rankHtml() : logHtml();
  const tabs = mon ? MTABS : TABS, badgeOf = mon ? mTabBadge : tabBadge;
  const modes = `<div class="modew"><div class="mode" role="group" aria-label="戦う 子">${[["pet", "ペット"], ["mon", "モンスター"]].map(([k, l]) => `<button data-mode="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join("")}</div></div>`;
  main.innerHTML = petHtml() + `<section class="panel"><div class="ahead"><h2>Orbit Arena</h2>${modes}<div class="gtabs" role="tablist">${tabs.map(([k, label]) => { const n = badgeOf(k); return `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${label}${n ? `<em>${n}</em>` : ""}</button>`; }).join("")}</div></div>${mon && !(S.pick && S.pick.for === "rep") ? repHtml() : ""}<div id="body">${body}</div></section>`;
  linkTabs(main);
}
const urlNow = () => { const p = new URLSearchParams(); if (S.mode === "mon") p.set("m", "1"); if (S.tab !== "duel") p.set("t", S.tab); const x = p.toString(); history.replaceState(null, "", x ? "?" + x : location.pathname); };
const mReload = async () => { const v = await act("arena.mview"); if (v.ok) S.M = v; return v; };
const needList = async () => { if (!S.list) { const r = await act("arena.mlist"); S.list = r.ok ? r.list : []; } };
const reload = async () => { const v = await act("arena.view"); if (v.ok) S.V = v; };
main.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.mode) {   // ペット｜モンスター
    if (d.mode === S.mode) return;
    if (S.fight && S.fight.view) S.fight.view.destroy(); S.fight = null; S.pick = null;
    if (d.mode === "mon" && !S.M) { const r = await busy(b, () => act("arena.mview"), "よんで います…"); if (!r.ok) return toast(r.why || "できませんでした"); S.M = r; }
    S.mode = d.mode; if (!(S.mode === "mon" ? MTABS : TABS).some(([k]) => k === S.tab)) S.tab = "duel";
    if (S.mode === "mon" && S.tab === "self") { await needList(); S.pick = null; }
    urlNow(); return render();
  }
  if (d.tab) {
    if (S.fight && S.fight.view) S.fight.view.destroy(); S.fight = null; S.tab = d.tab; S.pick = null;
    if (S.mode === "mon" && d.tab === "self") await needList();
    urlNow(); return render();
  }
  // ---- モンスター ----
  if (d.do === "mpick") { await needList(); S.pick = { for: "rep", type: "all", sort: "pow" }; return render(); }
  if (d.do === "pkclose") { S.pick = null; return render(); }
  if (d.ptype || d.psort) { S.spick = S.spick || { type: "all", sort: "pow" }; const P = S.pick || S.spick; if (d.ptype) P.type = d.ptype; if (d.psort) P.sort = d.psort; return render(); }
  if (d.mon) {
    if (S.pick && S.pick.for === "rep") {
      const r = await busy(b, () => act("arena.mrep", { uid: d.mon }), "えらんで います…");
      if (!r.ok) return toast(r.why || "できませんでした");
      S.pick = null; await mReload(); toast("代表に しました"); return render();
    }
    const i = S.sel.indexOf(d.mon); if (i >= 0) S.sel.splice(i, 1); else if (S.sel.length < S.size) S.sel.push(d.mon); else return toast(`${S.size} 体まで（外すか 数を かえる）`);
    return render();
  }
  if (d.size) { S.size = +d.size; S.sel = S.sel.slice(0, S.size); return render(); }
  if (d.do === "sauto") { S.sel = [...S.list].sort((a, c) => c.power - a.power).slice(0, S.size).map((c) => c.uid); return render(); }
  if (d.do === "sgo" || d.do === "sagain") {
    const r = await busy(b, () => act("arena.mself", { uids: d.do === "sagain" ? S.self.uids : S.sel }), "戦って います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.self = { ...r, uids: d.do === "sagain" ? S.self.uids : [...S.sel] }; return render();
  }
  if (d.do === "snew") { S.self = null; return render(); }
  if (d.smatch) {
    const [rr, mm] = d.smatch.split(":").map(Number), R = S.self, m = R.rounds[rr][mm];
    S.fight = { kind: "match", r: {}, done: false, title: `${roundName(R.rounds[rr].length * 2)}：${R.cards[m.a].name} VS ${R.cards[m.b].name} → ${R.cards[m.w === 0 ? m.a : m.b].name} の 勝ち` };
    document.getElementById("body").innerHTML = fightHtml(); document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(R.fs[m.a], R.fs[m.b], m.seed, m.w === 0);
  }
  if (d.do === "mfoes") { const r = await busy(b, () => act("arena.mfoes"), "さがして います…"); if (!r.ok) return toast(r.why || "できませんでした"); S.M = r; return render(); }
  if (d.mduel) {
    const r = await busy(b, () => act("arena.mduel", { foe: d.mduel }), "相手を よんで います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.fight = { kind: "duel", r, done: false }; S.M.left = r.left; if (r.pay) S.M.beat = [...S.M.beat, r.foe.id];
    render(); document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(r.A, r.B, r.seed, r.win);
  }
  if (d.mentry != null) {
    const r = await busy(b, () => act("arena.mentry", { on: d.mentry === "1" }), d.mentry === "1" ? "申しこんで います…" : "とりけして います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.M.tour = r.tour; toast(d.mentry === "1" ? `参加しました（きょう ${MTOUR.hour}:00）` : "参加を やめました"); return render();
  }
  if (d.mmatch) {
    const [rr, mm] = d.mmatch.split(":").map(Number), L = S.M.last, m = L.rounds[rr][mm];
    const r = await busy(b, () => act("arena.mmatch", { day: L.day, r: rr, m: mm }), "よんで います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.fight = { kind: "match", r, done: false, title: `${roundName(L.rounds[rr].length * 2)}：${m.a.pet}（${m.a.name}）VS ${m.b.pet}（${m.b.name}）→ ${[m.a, m.b][r.w].pet} の 勝ち` };
    document.getElementById("body").innerHTML = fightHtml(); document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(r.A, r.B, r.seed, r.w === 0);
  }
  if (d.do === "foes") { const r = await busy(b, () => act("arena.foes"), "さがして います…"); if (!r.ok) return toast(r.why || "できませんでした"); S.V = r; return render(); }
  if (d.duel) {
    const r = await busy(b, () => act("arena.duel", { foe: d.duel }), "相手を よんで います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.fight = { kind: "duel", r, done: false }; S.V.left = r.left; if (r.pay) S.V.beat = [...S.V.beat, r.foe.id];
    render(); document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(r.A, r.B, r.seed, r.win);
  }
  if (d.match) {
    const [rr, mm] = d.match.split(":").map(Number), L = S.V.last, m = L.rounds[rr][mm];
    const r = await busy(b, () => act("arena.match", { day: L.day, r: rr, m: mm }), "よんで います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    const title = `${roundName(L.rounds[rr].length * 2)}：${m.a.pet}（${m.a.name}）VS ${m.b.pet}（${m.b.name}）`;
    S.fight = { kind: "match", r, done: false, title: `${title} → ${[m.a, m.b][r.w].pet} の 勝ち` };
    if (S.tab !== "duel") { const body = document.getElementById("body"); body.innerHTML = fightHtml(); } else render();
    document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(r.A, r.B, r.seed, r.w === 0);
  }
  if (d.enc) {   // 派遣先の 戦いを 見る（自分が 右の ときも ある）
    const x = (S.V.enc || []).find((y) => y.at === +d.enc), r = await busy(b, () => act("arena.enc", { at: +d.enc }), "よんで います…");
    if (!r.ok || !x) return toast((r && r.why) || "できませんでした");
    S.fight = { kind: "match", r, done: false, title: `${(DUNGEONS.find((z) => z.id === x.did) || { name: "派遣先" }).name}で ${x.name} の ${x.pet}と ばったり → ${x.win ? "勝った" : "負けた"}` };
    document.getElementById("body").innerHTML = fightHtml(); document.getElementById("stage").scrollIntoView({ block: "start", behavior: "smooth" });
    return showFight(r.A, r.B, r.seed, r.me === 0 ? r.win : !r.win);
  }
  if (d.do === "skip" && S.fight && S.fight.view) return S.fight.view.skip();
  if (d.do === "back") { if (S.fight && S.fight.view) S.fight.view.destroy(); const was = S.fight && S.fight.kind; S.fight = null; if (was === "duel") { if (S.mode === "mon") await mReload(); else await reload(); } return render(); }
  if (d.link) {   // LINKERS の 契約
    const r = await busy(b, () => act("link.sign", { co: d.link }), "契約して います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    await reload(); toast(`契約しました（${LINK.days} 日）`); return render();
  }
  if (d.entry != null) {
    const r = await busy(b, () => act("arena.entry", { on: d.entry === "1" }), d.entry === "1" ? "申しこんで います…" : "とりけして います…");
    if (!r.ok) return toast(r.why || "できませんでした");
    S.V.tour = r.tour; toast(d.entry === "1" ? `参加しました（きょう ${TOUR.hour}:00）` : "参加を やめました"); return render();
  }
});
// ---------- はじめ（関数の 定義の あと） ----------
const ME = await me();
const gate = gateHtml(ME, esc);
if (gate) { main.innerHTML = gate; window.ready = true; }
else {
  S.V = await act("arena.view");
  if (S.V.ok && S.mode === "mon") { const m = await act("arena.mview"); if (m.ok) { S.M = m; if (S.tab === "self") await needList(); } else S.mode = "pet"; }
  if (!S.V.ok) main.innerHTML = `<section class="panel"><p class="why">${esc(S.V.why || "いまは Orbit Arena に つながらない")}</p></section>`;
  else render();
  linkTabs(main);
  setInterval(() => { if (S.tab === "tour" && !S.fight) { const c = document.getElementById("clock"), T = S.mode === "mon" ? S.M && S.M.tour : S.V.tour; if (c && T) c.firstChild.textContent = left(T.at - Date.now()); } }, 30000);
  window.ready = true;
}
</script>
