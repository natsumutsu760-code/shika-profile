<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：ステータスの画面の見本。ネム（しか・ヒーラー・Lv12）の 9 つのステータスの内わけと、種類ごとのステータス適正
     ?view=all で 8 匹の適正の一覧。部品と色はスキルツリー・装備・冒険の画面と同じ */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF; --amber:#E0A100;
    --rS:#FF4D7E; --rA:#FF9A3D; --rB:#9AA4BE; --rC:#5BA8E0; --rD:#6F7BD9;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  h2, h3, p { margin:0; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.9); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 18px); }
  .pet { display:grid; grid-template-columns:60px auto 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #FFF4D6 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:120%; margin-top:4%; }
  .pet h1 { margin:0; font:900 24px/1.1 var(--jp); display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }
  .pet .meta { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }
  .pts { justify-self:end; text-align:right; font:700 12px/1.2 var(--jp); color:var(--soft); }
  .pts b { display:block; font:600 26px/1 var(--num); color:var(--sky); }
  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }
  .head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .head h2 { font:900 20px/1.3 var(--jp); } .head span { font:700 12px/1.4 var(--jp); color:var(--soft); }

  /* 適正のしるし：S・A・B・C・D */
  .rk { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; font:700 15px/1 var(--num); color:#fff; background:var(--r); box-shadow:inset 0 -2px 0 rgba(27,35,64,.18); }
  .rk.S { --r:var(--rS); } .rk.A { --r:var(--rA); } .rk.B { --r:var(--rB); } .rk.C { --r:var(--rC); } .rk.D { --r:var(--rD); }

  .cols { display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:14px; align-items:start; }
  /* ステータスの行：名前・適正・値・内わけの帯・手で振る */
  .rows { display:grid; gap:6px; }
  .row { display:grid; grid-template-columns:46px 26px 54px minmax(0, 1fr) 36px; gap:10px; align-items:center; padding:7px 8px 7px 12px; border-radius:14px; background:#fff; border:1.5px solid var(--line); }
  .row .nm { font:700 14px/1 var(--num); letter-spacing:.04em; }
  .row .v { font:600 22px/1 var(--num); text-align:right; }
  .row .v small { display:block; margin-top:3px; font:700 10px/1 var(--jp); color:var(--soft); }
  .bar { position:relative; height:16px; border-radius:99px; background:var(--space); overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; }
  .seg-base { background:#C9CFDD; } .seg-auto { background:var(--job); } .seg-hand { background:var(--sky); } .seg-tree { background:var(--amber); } .seg-eq { background:var(--violet); }
  .plus { width:36px; height:36px; border-radius:12px; border:0; background:var(--sky); color:#fff; font:700 20px/1 var(--num); box-shadow:0 4px 0 rgba(46,168,255,.3); }
  .row.S { border-color:#FFC2D3; background:linear-gradient(90deg, #FFF3F7, #fff 40%); }
  .row.D { background:linear-gradient(90deg, #F3F4FF, #fff 40%); }
  .legend { display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font:700 11px/1.2 var(--jp); color:var(--soft); }
  .legend span::before { content:""; display:inline-block; width:12px; height:10px; border-radius:4px; margin-right:5px; vertical-align:-1px; background:var(--c); }
  .note { margin-top:8px; font:700 12px/1.6 var(--jp); color:var(--soft); }

  .side { display:grid; gap:12px; }
  .card { border:1.5px solid var(--line); border-radius:18px; padding:12px 14px; background:#fff; }
  .card h3 { font:900 15px/1.3 var(--jp); display:flex; align-items:center; gap:8px; }
  .card h3 small { font:700 11px/1.3 var(--jp); color:var(--soft); }
  .card p { margin-top:6px; font:500 13px/1.6 var(--jp); }
  .aptg { margin-top:10px; display:grid; grid-template-columns:repeat(9, minmax(0, 1fr)); gap:4px; text-align:center; }
  .aptg div { display:grid; justify-items:center; gap:3px; font:700 10px/1 var(--num); color:var(--soft); }
  .scale { margin-top:10px; display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:4px; }
  .scale div { display:grid; justify-items:center; gap:4px; padding:6px 2px; border-radius:10px; background:var(--space); font:600 12px/1 var(--num); }
  .fit { margin-top:8px; display:grid; gap:6px; }
  .fit div { display:grid; grid-template-columns:96px minmax(0, 1fr) 70px; gap:8px; align-items:center; font:700 12.5px/1.2 var(--jp); }
  .fit .b { height:10px; border-radius:99px; background:var(--space); overflow:hidden; } .fit .b i { display:block; height:100%; border-radius:99px; background:var(--c); }
  .fit em { font-style:normal; font:700 11px/1.2 var(--jp); color:var(--soft); text-align:right; }
  .fit .top1 em { color:#D2336A; }

  /* ===== 8 匹の一覧 ===== */
  .grid8 { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; }
  .pc { border:1.5px solid var(--line); border-radius:20px; background:#fff; padding:12px; display:grid; gap:8px; align-content:start; }
  .pc .who { display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; }
  .pc .pic { width:52px; height:52px; border-radius:14px; background:radial-gradient(circle at 50% 38%, #fff 0, #FFF4D6 80%); display:flex; justify-content:center; overflow:hidden; }
  .pc .pic img { height:120%; margin-top:4%; }
  .pc b { font:900 16px/1.2 var(--jp); } .pc small { display:block; font:700 11px/1.3 var(--jp); color:var(--soft); }
  .pc .aptg { margin-top:0; gap:2px; }
  .pc .aptg .rk { width:22px; height:22px; font-size:13px; border-radius:7px; }
  .pc .why { font:500 12px/1.55 var(--jp); color:var(--ink); min-height:3.1em; }
  .pc .best { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font:700 11px/1.2 var(--jp); color:var(--soft); }
  .pc .best span { display:inline-flex; align-items:center; gap:4px; padding:3px 8px 3px 5px; border-radius:99px; color:#fff; background:var(--c); }
  .pc .best span::before { content:""; width:8px; height:8px; border-radius:50%; background:#fff; opacity:.85; }

  .jelly { border:0; border-radius:999px; padding:11px 16px; font:900 14px/1 var(--jp); background:var(--ink); color:#fff; box-shadow:0 5px 0 rgba(27,35,64,.25); }
  .jelly.light { background:#fff; color:var(--ink); box-shadow:0 5px 0 var(--line); border:1.5px solid var(--line); }
  .jelly.sky { background:var(--sky); box-shadow:0 5px 0 rgba(46,168,255,.3); }
  .jelly:disabled { opacity:.45; }
  .plus:disabled { background:#DCE3F0; box-shadow:none; }
  .row .v em { font:600 13px/1 var(--num); font-style:normal; color:var(--sky); margin-left:3px; }
  /* 振る ポイント：決めるまでは 画面の 中だけ（門番に 送るのは「決める」） */
  .pfoot { margin-top:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 12px; border-radius:16px; background:#F2F8FF; font:700 13px/1.4 var(--jp); color:var(--soft); }
  .pfoot b { color:var(--ink); } .pfoot .sp { flex:1; min-width:8px; }
  @media (max-width:820px) {
    .pet { grid-template-columns:48px 1fr auto; padding:6px 12px 6px 6px; gap:10px; border-radius:18px; }
    .pet .pic { width:48px; height:48px; border-radius:12px; } .pet h1 { font-size:20px; } .pet h1 small { font-size:12px; }
    .cols { grid-template-columns:minmax(0, 1fr); }
    .row { grid-template-columns:40px 24px 46px minmax(0, 1fr) 32px; gap:7px; padding:6px 6px 6px 10px; }
    .row .v { font-size:19px; } .plus { width:32px; height:32px; border-radius:10px; } .rk { width:24px; height:24px; font-size:14px; }
    .grid8 { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width:520px) { .grid8 { grid-template-columns:minmax(0, 1fr); } }
</style>
</head>
<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ ペット</small></header>
<main id="app"></main>
<script type="module">
import { growthParts, buildPet, learned, APTITUDE, APT_MUL, jobFit, JOB_GROWTH } from "./trees.js";
import { TYPES } from "./skills.js";
import { itemStats } from "./equip.js";

import { me, act, busy, waitText } from "./lounge-client.js";   // ペットの 記録と ステータスを 振るのは 門番（見本では ブラウザの 中の ためしの 門番）
import { petInfo, linkTabs, gateHtml, addGateCss, toast } from "./pet-head.js";

const q = new URLSearchParams(location.search), view = q.get("view") || "pet";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const KEYS = ["hp", "mp", "atk", "def", "int", "res", "agi", "dex", "luk"];
const SL = { hp: "HP", mp: "MP", atk: "ATK", def: "DEF", int: "INT", res: "RES", agi: "AGI", dex: "DEX", luk: "LUK" };
const JOBS = ["attacker", "caster", "technician", "healer", "defender"];
const fitWord = (f) => (f >= 1.04 ? "とても合う" : f >= 1.015 ? "合う" : f > 0.985 ? "ふつう" : "合わない");
const rk = (r) => `<span class="rk ${r}" aria-label="適正 ${r}">${r}</span>`;
const pct = (m) => (m === 1 ? "×1" : `×${m}`);
// 8 匹（名前・種類・ひとこと。性格は mono-link-lounge.md）
const PETS = [
  { sp: "shika", name: "ネム", label: "しか", img: "img/nemu.png", why: "よく寝るので HP が伸びる。落ちついていて INT・RES も得意。ねぼけて ATK はにがて" },
  { sp: "pelican", name: "ポスケ", label: "ペリカン", img: "img/pet-pelican.png", why: "手紙をまちがえず届けるので DEX。ずんぐりで HP・DEF。よく雨に降られて LUK はにがて" },
  { sp: "mouse", name: "カチ", label: "マウス", img: "img/kachi.png", why: "せっかちで AGI。ダブルクリックで DEX・LUK。小さくてこわれやすいので DEF はにがて" },
  { sp: "tv", name: "ザザ", label: "ブラウン管", img: "img/pet-tv.png", why: "昔話の物知りで INT。電気で MP、箱なので DEF。「昔はよかった」ので LUK はにがて" },
  { sp: "mogura", name: "ホリ", label: "もぐら", img: "img/pet-mogura.png", why: "働き者の爪で ATK。ヘルメットで HP・DEF。自分の穴に落ちるので INT はにがて" },
  { sp: "kurage", name: "ユラ", label: "くらげ", img: "img/pet-kurage.png", why: "夜に光るので MP。光でびっくりさせて INT、ふわふわ浮いて AGI。風に流されるので LUK、体がやわらかいので DEF はにがて" },
  { sp: "saboten", name: "チク", label: "サボテン", img: "img/pet-saboten.png", why: "トゲで DEF。水をためて HP、クールで RES。鉢ごと歩くので AGI はにがて" },
  { sp: "chokin", name: "チャリン", label: "ちょきんばこ", img: "img/pet-chokin.png", why: "コインでずっしり重い体当たりで ATK。食いしんぼうで HP、コインの運で LUK。ハンマーで割れるので DEF はにがて" },
];

// ペットは 門番の 1 匹目。手で 振る ポイント：free が null なら「おまかせ」（職業の 重みで 自動に 振って いる）
// 自分で 振る：おまかせからは 0 から 好きに 配れる。決めた あとは ふやすだけ（へらすのは スキルツリーの 振り直しで）
let ME = await me(), MP = ME.pets && ME.pets[0];
const P = { add: {}, edit: false };
const sumOf = (o) => Object.values(o || {}).reduce((a, v) => a + v, 0);
function renderPet() {
  const gate = gateHtml(ME, esc); if (gate) return gate;
  const info = petInfo(MP), why = (PETS.find((x) => x.sp === MP.species) || {}).why || "", sp = MP.species, ty = TYPES[MP.type], A = APTITUDE[sp];
  const auto = MP.free == null && !P.edit, base = MP.free == null ? {} : MP.free, cur = auto ? null : Object.fromEntries(KEYS.map((k) => [k, (base[k] || 0) + (P.add[k] || 0)]).filter(([, v]) => v > 0));
  const G = growthParts(MP.type, MP.lv, cur, sp), left = auto ? 0 : G.freeAll - sumOf(cur), pend = sumOf(P.add);
  const tree = {}; for (const id of [MP.type, ...(MP.subs || [])]) for (const [k, v] of Object.entries(learned(id, new Set((MP.taken || {})[id] || []), MP.seed).stats)) tree[k] = (tree[k] || 0) + v;
  const eq = {}; for (const u of Object.values(MP.equip || {})) { const it = (ME.own.equip || []).find((e) => e.uid === u); if (it) for (const [k, v] of Object.entries(itemStats(it))) if (KEYS.includes(k)) eq[k] = (eq[k] || 0) + v; }
  const MAXV = { hp: 160, mp: 50 };
  const rows = KEYS.map((k) => {
    const parts = [["base", G.base[k]], ["auto", G.auto[k]], ["hand", G.hand[k]], ["tree", tree[k] || 0], ["eq", eq[k] || 0]], tot = Math.round(parts.reduce((a, [, v]) => a + v, 0)), mx = MAXV[k] || 44;
    return `<div class="row ${A[k]}"><span class="nm">${SL[k]}</span>${rk(A[k])}<span class="v">${tot}${P.add[k] ? `<em>+${P.add[k]}</em>` : `<small>${pct(APT_MUL[A[k]])}</small>`}</span>
      <span class="bar" role="img" aria-label="${SL[k]} ${tot}">${parts.filter(([, v]) => v > 0).map(([c, v]) => `<i class="seg-${c}" style="width:${(v / mx) * 100}%"></i>`).join("")}</span>
      <button class="plus" data-k="${k}" aria-label="${SL[k]} に 1 ポイント振る" ${left > 0 ? "" : "disabled"}>+</button></div>`;
  }).join("");
  const foot = auto ? `<div class="pfoot"><span>いまは <b>おまかせ</b>（職業の 重みで 自動）</span><span class="sp"></span><button class="jelly light" data-do="edit">自分で 振る</button></div>`
    : pend || P.edit ? `<div class="pfoot"><span>のこり <b>${left}</b></span><span class="sp"></span><button class="jelly light" data-do="undo">${P.edit && MP.free == null ? "おまかせに もどす" : "もどす"}</button><button class="jelly sky" data-do="save" ${pend ? "" : "disabled"}>決める（${pend}）</button></div>`
    : left ? `<div class="pfoot"><span>振れる ポイントが <b>${left}</b> ある</span></div>` : "";
  const fits = JOBS.map((t) => [t, jobFit(sp, t)]).sort((a, b) => b[1] - a[1]), fmin = 0.93, fmax = 1.08;
  return `
  <section class="panel pet" aria-label="ペット">
    <div class="pic"><img src="${info.img}" alt="${esc(info.label)}の${esc(MP.name)}"></div>
    <div><h1>${esc(MP.name)}<small>${esc(info.label)} ／ ${esc(ME.name)} の相棒</small></h1><div class="meta"><span class="badge" style="--c:${ty.color}">${ty.label}</span><span class="lv"><small>Lv</small>${MP.lv}</span></div></div>
    <div class="pts">振れるポイント<b>${auto ? "自動" : left}</b></div>
  </section>
  <nav class="tabs" role="tablist"><button role="tab" aria-selected="true">ステータス</button><button role="tab" aria-selected="false">スキルツリー</button><button role="tab" aria-selected="false">ガンビット</button><button role="tab" aria-selected="false">装備</button><button role="tab" aria-selected="false">冒険</button><button role="tab" aria-selected="false">なかま</button></nav>
  <div class="cols">
    <section class="panel" aria-label="ステータス" style="--job:${ty.color}">
      <div class="head"><h2>ステータス</h2><span>レベルが 1 上がるごとに 3 ポイント。2 つは職業の重みで自動、1 つは好きに振れる</span></div>
      <div class="rows">${rows}</div>
      ${foot}
      <div class="legend"><span style="--c:#C9CFDD">もとの値</span><span style="--c:${ty.color}">職業で伸びた分</span><span style="--c:var(--sky)">手で振った分</span><span style="--c:var(--amber)">スキルツリー</span><span style="--c:var(--violet)">装備</span></div>
      <p class="note">1 ポイントで HP +4・MP +2・ほかは +1。そこに適正の倍率がかかる（S なら ×1.15）。へらすのは スキルツリーの 振り直しで（1 日 1 回 無料）</p>
    </section>
    <aside class="side">
      <div class="card"><h3>${esc(MP.name)}の適正<small>${esc(info.label)}はみんな同じ</small></h3>
        <div class="aptg">${KEYS.map((k) => `<div>${rk(A[k])}${SL[k]}</div>`).join("")}</div>
        <p>${esc(why)}</p>
        <div class="scale">${["S", "A", "B", "C", "D"].map((r) => `<div>${rk(r)}${pct(APT_MUL[r])}</div>`).join("")}</div>
        <p class="note" style="margin-top:6px">レベルで伸びる分にかかる。どの子も S 1・A 2・B 3・C 2・D 1 で、合計は同じ</p></div>
      <div class="card"><h3>合う職業<small>伸びる分の平均の倍率</small></h3>
        <div class="fit">${fits.map(([t, f], i) => `<div class="${i === 0 ? "top1" : ""}"><span>${TYPES[t].label}</span><span class="b"><i style="--c:${TYPES[t].color}; width:${Math.max(4, ((f - fmin) / (fmax - fmin)) * 100)}%"></i></span><em>${fitWord(f)}</em></div>`).join("")}</div>
        <p class="note">いまは ${TYPES[MP.type].label}（${fitWord(jobFit(sp, MP.type))}）。職業はあとから変えられる</p></div>
    </aside>
  </div>`;
}

function renderAll() {
  const cards = PETS.map((p) => {
    const A = APTITUDE[p.sp], fits = JOBS.map((t) => [t, jobFit(p.sp, t)]).sort((a, b) => b[1] - a[1]);
    return `<div class="pc"><div class="who"><span class="pic"><img src="${p.img}" alt="${esc(p.label)}の${esc(p.name)}"></span><div><b>${p.name}</b><small>${p.label}</small></div></div>
      <div class="aptg">${KEYS.map((k) => `<div>${rk(A[k])}${SL[k]}</div>`).join("")}</div>
      <p class="why">${esc(p.why)}</p>
      <div class="best">合う職業 ${fits.slice(0, 2).map(([t]) => `<span style="--c:${TYPES[t].color}">${TYPES[t].label}</span>`).join("")}</div></div>`;
  }).join("");
  return `<section class="panel"><div class="head"><h2>8 匹のステータス適正</h2><span>レベルで伸びる分に S ×1.15・A ×1.075・B ×1・C ×0.925・D ×0.85。どの子も S 1・A 2・B 3・C 2・D 1 で、合計は同じ</span></div>
    <div class="grid8">${cards}</div></section>`;
}

addGateCss();
function paint() { document.getElementById("app").innerHTML = view === "all" ? renderAll() : renderPet(); linkTabs(); }
document.getElementById("app").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.k) { P.add[b.dataset.k] = (P.add[b.dataset.k] || 0) + 1; return paint(); }
  if (b.dataset.do === "edit") { P.edit = true; P.add = {}; return paint(); }
  if (b.dataset.do === "undo") { if (!sumOf(P.add)) P.edit = false; P.add = {}; return paint(); }
  if (b.dataset.do === "save") {
    const base = MP.free == null ? {} : MP.free, free = Object.fromEntries(KEYS.map((k) => [k, (base[k] || 0) + (P.add[k] || 0)]).filter(([, v]) => v > 0));
    const r = await busy(b, () => act("pet.stat", { free }));
    if (!r.ok) return toast(r.wait ? waitText : r.why || "決められませんでした");
    ME = await me(); MP = ME.pets[0]; P.add = {}; P.edit = false; paint(); toast("ステータスを 振った");
  }
});
paint();
window.ready = true;
</script>
</body>
