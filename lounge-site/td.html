<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集合住宅</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  /* タワーディフェンス（集合住宅）の 画面の 見本（TD 研究ノート 9 章の 2。M-026）。決まりは docs/mono-link-td-reference.md の 8 章
     14 回目の 2 つの 形：ふだん＝建物だけ・押すと 窓（下に 住人・増築・電波塔、棟は 上の チップ、階は 右上の 切りかえ）
                       防衛中＝建物に 敵の 道の 赤い 線と 次の 1 歩の 印・右上に 小さな 地図・下に えらんだ 住人の 指示と「ターン おわり」
     見え方は ラウンジ（lounge-room.html）と 同じ ななめ見下ろしの ローポリ。住人は モンスターの ドット絵（sprites.js。TD の まざった 子も）
     鹿さんの カード（2026-11-12）「建物をもっと九龍城塞らしく」→「棟で分けると言うより1個の集合住宅を幾何学的に接ぎ木するようなイメージです。」：
     →「もっと接ぎ木を大胆に」：長い 箱を 縦横 交互に 十字に 重ね、下を またいで 大きく 張り出させた 8 階の ひとつづきの 建物（棟の チップは なし）。外かべの 室外機と 看板・屋上の タンクと 電波塔。階は 6 階まで あるので ▲ いまの 階 ▼。ひっぱると 見る 所が 動く
     見本の 中だけで 動く（保存しない）。?def で 防衛中から・?bt で 試しの 戦いの 画面から（鹿さんの カード、2026-11-13） */
  :root { --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0; --space:#F6F8FC; --amber:#FFB547; --sky:#2EA8FF; --leaf:#22CC88; --coral:#FF5A64; --violet:#8E6CFF;
    --jp:"Zen Maru Gothic", sans-serif; --num:"Fredoka", sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, #F6F8FC 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.6 var(--jp); }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:10px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:600 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1280px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 24px; display:grid; grid-template-columns:minmax(0, 1fr); gap:16px; align-items:start; }
  main.side { grid-template-columns:minmax(0, 1fr) 340px; }
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; min-height:40px; flex-wrap:wrap; }
  .bar h1 { font:900 20px/1.2 var(--jp); margin:0 auto 0 0; display:flex; align-items:center; gap:10px; }
  .bar h1 .turn { font:600 15px/1 var(--num); padding:7px 12px; border-radius:999px; background:var(--coral); color:#fff; }
  .bar h1 .turn[hidden] { display:none; }
  .chips { display:flex; gap:6px; }
  .chip { min-height:36px; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font:900 13px/1 var(--jp); white-space:nowrap; }
  .chip.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .view { position:relative; border-radius:24px; overflow:hidden; height:clamp(460px, calc(100vh - 150px), 760px); touch-action:none; background:#F6F8FC; }
  .view canvas { display:block; width:100%; height:100%; }
  body.def .view { background:#141A33; }
  /* 右上：ふだんは 階の 切りかえ、防衛中は 小さな 地図 */
  .floors { position:absolute; top:14px; right:14px; display:grid; gap:6px; }
  .floors button { width:52px; height:40px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,.92); font:600 15px/1 var(--num); }
  .floors button:disabled { opacity:.35; cursor:default; }
  .floors b { display:block; text-align:center; padding:6px 0; border-radius:12px; background:var(--ink); color:#fff; font:600 16px/1 var(--num); }
  .mini { position:absolute; top:14px; right:14px; padding:10px; border-radius:16px; background:rgba(20,26,51,.88); color:#E8ECFF; }
  .mini svg { display:block; width:150px; height:auto; }
  .mini[hidden], .floors[hidden] { display:none; }
  /* 下：ふだんの ボタン 3 つ */
  .dock { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); display:flex; gap:10px; }
  .dock button { position:relative; min-width:110px; min-height:52px; padding:10px 18px; border-radius:18px; border:1.5px solid var(--line); background:#fff; font:900 15px/1 var(--jp); box-shadow:0 10px 24px -16px rgba(27,35,64,.45); display:flex; align-items:center; justify-content:center; gap:8px; }
  .dock button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .dock svg { width:20px; height:20px; flex:none; }
  .dot { position:absolute; top:-7px; right:-7px; min-width:24px; height:24px; padding:0 6px; border-radius:999px; background:var(--coral); color:#fff; font:600 13px/24px var(--num); }
  .dock[hidden] { display:none; }
  /* 下：防衛中の 指示 */
  .cmd { position:absolute; left:14px; right:14px; bottom:14px; display:flex; align-items:center; gap:12px; padding:12px; border-radius:20px; background:rgba(255,255,255,.96); box-shadow:0 14px 30px -18px rgba(0,0,0,.6); }
  .cmd[hidden] { display:none; }
  .cmd .who { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .cmd .who img { width:48px; height:48px; image-rendering:pixelated; flex:none; }
  .cmd .who b { display:block; font:900 15px/1.2 var(--jp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cmd .who span { font:700 12px/1.3 var(--jp); color:var(--soft); }
  .cmd .who .nx { margin:2px 0 0; display:flex; flex-wrap:wrap; gap:0 6px; font:700 12px/1.35 var(--jp); color:var(--ink); } .cmd .who .nx b { display:inline; font:900 12px/1.35 var(--jp); } .cmd .who .nx span { color:inherit; }
  .cmd .who .nx.bad { color:var(--coral); }
  .cmd .hint { font:900 14px/1.3 var(--jp); color:var(--soft); }
  .cmd .acts { display:flex; gap:6px; }
  .cmd .acts button { min-height:44px; padding:8px 12px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font:900 13px/1 var(--jp); white-space:nowrap; }
  .cmd .acts button.on { border-color:var(--amber); background:#FFF3D6; }
  /* 増築の 置き場所えらび（M-032）：パーツ・候補の 番号・中身と 値段・建てる・やめる */
  .bsel .who { flex-wrap:wrap; gap:4px 10px; } .bsel .who .mk { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--space); flex:none; } .bsel .who .mk svg { width:24px; height:24px; }
  .bsel .who p { margin:0; min-width:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 6px; font:700 13px/1.3 var(--jp); color:var(--ink); } .bsel .who p + p { font-size:12px; color:var(--soft); } .bsel .who p b { display:inline; font:600 13px/1 var(--num); color:var(--ink); }
  .bsel .who .nm { display:block; font:900 15px/1.2 var(--jp); color:var(--ink); }
  .bsel .pick { display:flex; gap:6px; } .bsel .pick button { min-width:40px; min-height:40px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font:600 15px/1 var(--num); }
  .bsel .pick button.on { border-color:var(--amber); background:#FFF3D6; }
  .bsel .ok { min-height:44px; padding:10px 16px; border-radius:14px; border:0; background:var(--ink); color:#fff; font:900 14px/1 var(--jp); white-space:nowrap; }
  .bsel .no { width:40px; height:40px; border-radius:12px; border:0; background:var(--space); font:700 16px/1 var(--num); flex:none; }
  .bsum { font:900 14px/1.3 var(--jp); color:var(--ink); }
  .card .why { font:700 12px/1.3 var(--jp); color:var(--soft); }
  .card .t .n { margin-left:auto; padding:3px 8px; border-radius:999px; background:#E3F8EF; color:#0E9A62; font:900 12px/1 var(--jp); }
  .done { margin:0; font:900 14px/1.4 var(--jp); color:#0E9A62; }
  .cmd .acts button:disabled { opacity:.4; cursor:default; }
  .cmd .acts button.sp { border-style:dashed; border-color:var(--violet); color:#5B3FD0; }
  .cmd .end { min-height:52px; padding:10px 18px; border-radius:16px; border:0; background:var(--coral); color:#fff; font:900 15px/1 var(--jp); white-space:nowrap; flex:none; }
  /* 押すと 出る 小さな 窓 */
  .pop { position:absolute; z-index:5; width:236px; padding:12px; border-radius:18px; background:#fff; box-shadow:0 18px 40px -18px rgba(27,35,64,.55); display:grid; gap:8px; }
  .pop[hidden] { display:none; }
  .pop .hd { display:flex; align-items:center; gap:10px; }
  .pop .hd img { width:44px; height:44px; image-rendering:pixelated; flex:none; }
  .pop .hd b { display:block; font:900 15px/1.25 var(--jp); }
  .pop .hd span { font:700 12px/1.3 var(--jp); color:var(--soft); }
  .pop .x { margin-left:auto; align-self:flex-start; width:32px; height:32px; border-radius:10px; border:0; background:var(--space); font:700 16px/1 var(--num); }
  .meter { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; font:700 12px/1 var(--jp); color:var(--soft); }
  .meter i { display:block; height:8px; border-radius:99px; background:var(--line); overflow:hidden; } .meter i em { display:block; height:100%; border-radius:99px; }
  .meter b { font:600 13px/1 var(--num); color:var(--ink); }
  .st { display:inline-block; padding:3px 8px; border-radius:999px; font:900 12px/1.2 var(--jp); background:var(--space); color:var(--soft); }
  .st.sick { background:#FFE3E5; color:#D8323C; } .st.out { background:#E8F1FF; color:#2E6FD8; } .st.kid { background:#FFF3D6; color:#B07800; } .st.mine { background:#EFE8FF; color:#6A4AD8; }
  .go { min-height:40px; border-radius:12px; border:0; background:var(--ink); color:#fff; font:900 13px/1 var(--jp); text-decoration:none; display:flex; align-items:center; justify-content:center; }
  .go:disabled { background:var(--line); color:var(--soft); cursor:default; }
  .why { margin:0; font:700 12px/1.4 var(--jp); color:var(--coral); }
  .toast { position:absolute; left:50%; top:16px; transform:translateX(-50%); padding:9px 14px; border-radius:14px; background:var(--ink); color:#fff; font:700 13px/1.4 var(--jp); opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; z-index:6; }
  .toast.on { opacity:1; }
  /* 右の パネル（スマホは 下から 出る 引き出し） */
  .panel { background:#fff; color:var(--ink); border-radius:24px; box-shadow:0 18px 40px -22px rgba(27,35,64,.35); padding:16px; display:flex; flex-direction:column; gap:12px; position:sticky; top:12px; max-height:calc(100vh - 24px); overflow:auto; }
  .panel[hidden] { display:none; }
  .panel h2 { margin:0; font:900 16px/1.2 var(--jp); display:flex; align-items:center; gap:8px; }
  .panel h2 .x { margin-left:auto; width:32px; height:32px; border-radius:10px; border:0; background:var(--space); font:700 16px/1 var(--num); }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; min-height:36px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font:900 13px/1 var(--jp); }
  .seg button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .seg button b { font:600 13px/1 var(--num); margin-left:4px; }
  .filters { display:grid; gap:6px; padding:10px; border-radius:16px; background:var(--space); }
  .filters .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .filters .row > span { font:900 12px/1 var(--jp); color:var(--soft); min-width:44px; }
  .filters button { min-height:32px; padding:6px 10px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font:900 12px/1 var(--jp); }
  .filters button.on { border-color:var(--ink); background:var(--ink); color:#fff; }
  .filters button b { font:600 12px/1 var(--num); margin-left:3px; }
  .list { display:grid; gap:8px; }
  .item { display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center; padding:10px; border-radius:16px; border:1.5px solid var(--line); background:#fff; text-align:left; width:100%; }
  .item.on { border-color:var(--amber); background:#FFF8EA; }
  .item img { width:44px; height:44px; image-rendering:pixelated; }
  .item .nm { display:flex; align-items:center; gap:6px; flex-wrap:wrap; } .item .nm b { font:900 14px/1.25 var(--jp); } .item .nm small { font:600 13px/1 var(--num); color:var(--soft); }
  .item .sub { font:700 12px/1.3 var(--jp); color:var(--soft); }
  .card { display:grid; gap:8px; padding:12px; border-radius:16px; border:1.5px solid var(--line); background:#fff; }
  .card .t { display:flex; align-items:center; gap:8px; } .card .t b { font:900 14px/1.3 var(--jp); }
  .card .t .stars { margin-left:auto; color:#E0A21C; letter-spacing:-1px; font-size:13px; }
  .card .from { font:700 12px/1.3 var(--jp); color:var(--soft); }
  .card .foes { display:flex; gap:2px; align-items:center; } .card .foes img { width:32px; height:32px; image-rendering:pixelated; }
  .card .foes span { font:700 12px/1.2 var(--jp); color:var(--soft); margin-left:6px; }
  .card .rw { display:flex; gap:12px; font:700 12px/1.2 var(--jp); color:var(--soft); } .card .rw b { font:600 13px/1 var(--num); color:var(--ink); } .card .rw .lose b { color:var(--coral); }
  .card .cost { font:700 12px/1.2 var(--jp); color:var(--soft); } .card .cost b { font:600 14px/1 var(--num); color:var(--ink); }
  .card .mk { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--space); flex:none; }
  .card .mk svg { width:24px; height:24px; }
  .sm { min-height:32px; padding:6px 10px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font:900 12px/1 var(--jp); justify-self:start; }
  /* 守りきった */
  .result { position:absolute; inset:0; z-index:7; display:grid; place-items:center; background:rgba(20,26,51,.6); }
  .result[hidden] { display:none; }
  /* 戦いの 画面（研究ノート 21 回目：横から・ターンごとに 切りかわって 1 手を 見せ、建物に もどる。並べ方は カード「A 全身を大きく」） */
  .bt { position:absolute; inset:0; z-index:8; display:grid; grid-template-rows:auto 1fr auto; overflow:hidden; border-radius:inherit; background:#141A33; color:#fff; }
  .bt[hidden] { display:none; }
  /* 戦いの あいだは 画面（本番の ラウンジの 枠）いっぱいに（クローラー M-031 と 同じ 形）。見出し・お金・下の ボタンを かくす */
  body.td-bt { overflow:hidden; } body.td-bt .bt { position:fixed; z-index:1000; border-radius:0; }
  .bt .bh { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px; }
  .bt .bh b { font:900 16px/1.2 var(--jp); } .bt .bh span { font:700 13px/1.2 var(--jp); color:#B8C4FF; }
  .bt .field { position:relative; overflow:hidden; background:linear-gradient(#2A3358 0 38%, #232B4E 38% 39%, #1E2648 39% 100%);
    container-type:size; display:grid; grid-template-columns:1fr 1fr; gap:0 6px; padding:6px 6px 10px; }
  .bt .field.one { background:linear-gradient(#2A3358 0 52%, #232B4E 52% 53%, #1E2648 53% 100%); }
  .bt .door { position:absolute; top:9%; width:9%; height:29%; border-radius:6px 6px 0 0; background:#3A4570; box-shadow:inset 0 0 0 3px #4A5684; }
  .bt .door i { position:absolute; left:50%; top:-14%; transform:translateX(-50%); padding:2px 6px; border-radius:6px; background:#FFB547; color:#1B2340; font:900 12px/1 var(--num); font-style:normal; white-space:nowrap; }
  .bt .lamp { position:absolute; top:3%; width:46px; height:6px; border-radius:3px; background:#FFE3A3; box-shadow:0 0 18px 6px rgba(255,227,163,.35); }
  .bt .field.one .door { top:14%; height:38%; }
  .bt .tile { position:absolute; left:0; right:0; height:1px; background:rgba(255,255,255,.06); }
  /* 片側 ＝ 前・うしろ の 2 列 × 上下 2 段（M-028 の 直し）。1 マスに 1 体なので 名札が となりに 重ならない。
     絵の 大きさは 場の 高さ（2 段なら 半分）と 幅（4 列）から 名札・HP の ぶんを 引いて 決める */
  .bt .side { position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto auto; align-content:end; align-items:end; justify-items:center; gap:6px 4px; min-width:0; }
  .bt .field.one .side { grid-template-rows:auto; }
  .fighter { position:relative; display:grid; justify-items:center; align-content:end; gap:3px; max-width:100%; min-width:0; transition:transform .25s ease;
    --sz:clamp(40px, min(50cqh - 84px, 25cqw - 14px), 150px); }
  .fighter.boss { --sz:clamp(48px, min(50cqh - 52px, 25cqw - 4px), 180px); }
  .field.one .fighter { --sz:clamp(48px, min(100cqh - 84px, 25cqw - 14px), 190px); }
  .field.one .fighter.solo { --sz:clamp(48px, min(100cqh - 84px, 50cqw - 20px), 190px); }
  .field.one .fighter.boss { --sz:clamp(56px, min(100cqh - 56px, 25cqw - 4px), 230px); }
  .fighter img { width:var(--sz); height:var(--sz); image-rendering:pixelated; transition:filter .3s, opacity .3s; }
  .fighter .nm { max-width:100%; overflow:hidden; text-overflow:ellipsis; font:900 12px/1.2 var(--jp); white-space:nowrap; text-shadow:0 1px 2px #000; }
  .fighter .hp { width:min(84px, 100%); height:8px; border-radius:4px; background:rgba(255,255,255,.18); overflow:hidden; }
  .fighter .hp i { display:block; height:100%; background:#22CC88; transition:width .45s ease; }
  .fighter .tg { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:100%; }
  .fighter .tg em { padding:3px 7px; border-radius:999px; background:rgba(255,255,255,.14); font:700 12px/1 var(--jp); font-style:normal; white-space:nowrap; }
  .fighter .tg em.ch { background:#FFB547; color:#1B2340; }
  .fighter.l.act { transform:translateX(min(30px, 12cqw)); z-index:2; } .fighter.r.act { transform:translateX(max(-30px, -12cqw)); z-index:2; }
  .fighter.out img { filter:grayscale(1) brightness(.55); opacity:.5; }
  .dmg { position:absolute; z-index:5; left:50%; top:0; transform:translate(-50%, 0); font:600 28px/1 var(--num); color:#FFE066; text-shadow:0 2px 0 #000; pointer-events:none; animation:dmgup 1s ease forwards; }
  @keyframes dmgup { from { opacity:1; transform:translate(-50%, 0); } to { opacity:0; transform:translate(-50%, -44px); } }
  .bt .bf { display:flex; align-items:center; gap:12px; padding:12px 14px; background:rgba(255,255,255,.97); color:var(--ink); }
  .bt .bf p { flex:1; min-width:0; margin:0; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 6px; font:700 14px/1.4 var(--jp); }
  .bt .bf p b { font:900 14px/1.4 var(--jp); } .bt .bf p em { font:600 18px/1 var(--num); font-style:normal; color:var(--coral); }
  .bt .bf button { min-height:48px; padding:10px 18px; border-radius:14px; border:0; background:var(--coral); color:#fff; font:900 15px/1 var(--jp); white-space:nowrap; flex:none; }
  @media (max-height:520px) {   /* 本番の ラウンジの 枠（約 358×380）：見出しと 記録の 帯を つめて 場を 広く */
    .bt .bh { padding:8px 14px; } .bt .bh b { font-size:14px; }
    .bt .bf { gap:8px; padding:6px 10px; } .bt .bf p, .bt .bf p b { font-size:13px; line-height:1.3; } .bt .bf p em { font-size:16px; }
    .bt .bf button { min-height:40px; padding:8px 14px; font-size:14px; border-radius:12px; }
  }
  .result div { width:min(300px, 86%); padding:20px; border-radius:22px; background:#fff; display:grid; gap:10px; text-align:center; }
  .result .lose > b { color:var(--coral); }
  .result .dead { list-style:none; margin:0; padding:0; display:grid; gap:6px; text-align:left; }

  const B = BQ[BI];
  if (btStep < B.steps.length) { clearTimeout(btTimer); while (btStep < B.steps.length) playStep(true); return; }   // 再生中なら この 戦いの 1 手を 先に 終える
  if (BI + 1 < BQ.length) { BI++; openBattle(); } else { $("bt").hidden = true; document.body.classList.remove("td-bt"); const d = btDone; btDone = null; if (d) d(); else render(); }
});
// 最後の 戦い（7 回目「MONO ペットが 最後に 戦う」）：プライベートラウンジで MONO ペットと、となりの 部屋の 住人が 加勢（上下左右・片方 4 体まで）。
// 見本は 負ける 台本（負けの 画面を 見せる）。MONO ペットは 殺されず 倒れる だけ。力つきた 住人は 起こされない まま 終わると 殺される
function loungeBattle(foes) {
  const lr = ROOMS.find((r) => r.lounge), helpers = ROOMS.filter((r) => r.f === lr.f && r.blk === lr.blk && r.who && !S.rest.has(r.who) && RES[r.who].st !== "仕事中").slice(0, 3).map((r) => RES[r.who] && { who: r.who, ...RES[r.who] });
  const res = [{ id: "pet_shika", img: "./img/brief-pet-shika.webp", name: "MONO ペット", hp: 240, max: 240, pet: true, tg: ["最後の 戦い"] },
    ...helpers.map((R) => ({ id: R.id, who: R.who, name: R.name, hp: 40 + R.lv * 2, max: 40 + R.lv * 2, mine: !!R.mine, tg: ["となりの 部屋", "加勢"] }))];
  const fz = foes.map((fo) => ({ id: fo.id, name: FOE_NAME[fo.id] || "敵", hp: fo.lv * 6, max: fo.lv * 6, boss: /boss/.test(fo.id), tg: ["ラウンジに 来た"] }));
  const steps = [];
  res.slice(1).forEach((u, i) => { steps.push(["f0", "r" + (i + 1), "強い 一撃", u.hp]); });   // となりの 子が 先に 力つきる（見本）
  steps.push(["r0", "f0", "つのの 突進", Math.round(fz[0].max * 0.4)], ["f0", "r0", "とどめの 一撃", 240]);
  return { f: lr.f, place: "プライベートラウンジ", res, foes: fz, steps };
}
function lose() {   // 負け：クレジットを 取られ、報酬も 減る。殺された 子は 帰って こない（自分の 子は アメジストで 復活・NPC は 部屋が 空く）
  const n = S.note, B = BQ[BQ.length - 1], dead = B.res.filter((u) => !u.pet && u.hp === 0);
  for (const u of dead) { const r = roomOf(u.who); if (r) { r.who = null; OCC[r.key] = null; } delete RES[u.who]; }
  S.foes.forEach((fo) => (fo.alive = false)); render();
  $("result").innerHTML = `<div class="lose"><b>守れなかった</b><p>クレジット <em>−${fmt(n.lose)}</em></p>
    ${dead.length ? `<ul class="dead">${dead.map((u) => `<li><img src="${spriteURL(u.id)}" alt=""><span><b>${u.name}</b><small>${u.mine ? "アメジストで 復活できる" : "部屋が 空いた"}</small></span></li>`).join("")}</ul>` : ""}
    <p class="pet">MONO ペットは 倒れた だけ</p><button class="go" data-back>もどる</button></div>`;
  $("result").hidden = false;
}
function win() {
  const n = S.note; render();
  $("result").innerHTML = `<div><b>守りきった</b><p>クレジット <em>+${fmt(n.win)}</em><br>シグナル <em>+${n.sg}</em></p><button class="go" data-back>もどる</button></div>`; $("result").hidden = false;
}
$("result").addEventListener("click", (e) => { if (e.target.closest("[data-back]")) { $("result").hidden = true; Object.assign(S, { mode: "home", floor: TOP, sel: null, cmd: {}, foes: [], pan: { x: 0, z: 0 } }); render(); } });
// 右上の 小さな 地図（どの 階に 敵が いるか。押すと その 階へ）。1 つの 建物なので 階の 列だけ
function renderMini() {
  const W = 120, ch = 16, base = 4 + (TOP + 1) * (ch + 3);
  let svg = `<svg viewBox="0 0 ${W} ${base + 2}" role="img" aria-label="小さな 地図">`;
  for (let f = 0; f <= TOP; f++) {
    const y = base - (f + 1) * (ch + 3), on = S.floor === f, n = S.foes.filter((fo) => fo.alive && PATH[fo.step].f === f).length;
    const wpx = 40 + (BLOCKS.filter((b) => f >= b.f0 && f < b.f0 + b.h).reduce((a, b) => a + b.w * b.d, 0) / 3.2);   // 階の 広さで 横の 長さ
    svg += `<g data-mf="${f}" style="cursor:pointer"><rect x="${(W - wpx) / 2}" y="${y}" width="${wpx}" height="${ch}" rx="4" fill="${on ? "#3A4A8A" : "#232C55"}" stroke="${on ? "#8EA0FF" : "#3A4478"}" stroke-width="1.2"/>`;
    svg += `<text x="${(W - wpx) / 2 + 6}" y="${y + ch - 4}" fill="#B8C4FF" font-size="12" font-weight="700">${f + 1}F</text>`;
    for (let k = 0; k < n; k++) svg += `<circle cx="${(W - wpx) / 2 + 30 + k * 8}" cy="${y + ch / 2}" r="3" fill="#FF3A4A"/>`;
    if (f === TOP) svg += `<path d="M${(W + wpx) / 2 - 10} ${y + 3}l1.8 3.6 3.9.4-2.9 2.6.9 3.8-3.7-2.1-3.7 2.1.9-3.8-2.9-2.6 3.9-.4Z" fill="#7CC8FF"/>`;
    svg += `</g>`;
  }
  $("mini").innerHTML = svg + `</svg>`;
}
$("mini").addEventListener("click", (e) => { const g = e.target.closest("[data-mf]"); if (!g) return; S.floor = +g.dataset.mf; render(); });

function render() { renderTop(); renderDock(); renderPanel(); renderCmd(); renderPlace(); buildWorld(); }
if (S.mode === "def") startDef(NOTES[0]); else render();
if (new URLSearchParams(location.search).has("bt")) showBattles(DEMO);   // ?bt：試しの 2 戦から 始める（最後の「建物へ もどる」で 建物へ）
window.__td = { showBattles, DEMO, S, render, startDef, NOTES, RES, SLOTS, avail, setBuilt, ROOMS: () => ROOMS, TOP: () => TOP, keyOf: (id) => Object.keys(RES).find((k) => RES[k].id === id) };
</script>
</body>
