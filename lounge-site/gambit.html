<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Gambits</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：ペットのガンビット（自動で戦うときの指示）の画面の見本。色と部品はサイト（shika-profile/index.html）に合わせる */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
    --spring:cubic-bezier(.34, 1.56, .64, 1); --out:cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.9); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 20px); }

  /* ---- ペットの頭 ---- */
  .pet { display:grid; grid-template-columns:60px auto 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #E4F7EE 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:150%; margin-top:-4%; }
  .pet h1 { margin:0; font:900 24px/1.1 var(--jp); display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }
  .pet .meta { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }
  .stats { justify-self:end; display:flex; gap:14px; font:700 11px/1 var(--jp); color:var(--soft); }
  .stats span b { display:block; margin-top:4px; font:600 16px/1 var(--num); color:var(--ink); }

  /* ---- タブ ---- */
  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }

  .cols { display:grid; grid-template-columns:minmax(0, 1fr) 340px; gap:20px; align-items:start; }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:2px; }
  .head h2 { margin:0; font:900 21px/1.3 var(--jp); }
  .head .btns { margin-left:auto; display:flex; gap:8px; }
  .head span { font:700 13px/1 var(--jp); color:var(--soft); white-space:nowrap; }
  .hint { margin:0 0 10px; color:var(--soft); font-size:13px; line-height:1.5; }

  /* ---- ガンビットの行：上から順に見て、最初に当てはまったものをする ---- */
  ol.gb { list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  .g { display:grid; grid-template-columns:30px 44px minmax(0, 1fr) 22px minmax(0, 1fr) 18px; align-items:center; gap:8px; padding:5px 8px 5px 6px; border-radius:16px; background:#fff; border:1.5px solid var(--line); }
  .g .no { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:600 16px/1 var(--num); background:var(--ink); color:#fff; }
  .sw { width:44px; height:26px; border-radius:99px; border:0; padding:3px; background:#D5DCEA; display:flex; }
  .sw::after { content:""; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(27,35,64,.3); transition:transform .3s var(--spring); }
  .sw[aria-checked="true"] { background:var(--leaf); } .sw[aria-checked="true"]::after { transform:translateX(18px); }
  .cond, .act { min-width:0; text-align:left; border-radius:12px; padding:6px 10px; font:700 14px/1.35 var(--jp); border:1.5px solid var(--line); background:var(--space); }
  .cond b, .act b { font:600 15px/1 var(--num); }
  .cond .who { display:inline-block; font:700 11px/1 var(--jp); color:#fff; background:var(--soft); border-radius:6px; padding:3px 5px; margin-right:6px; vertical-align:1px; }
  .cond .who.foe { background:var(--coral); } .cond .who.turn { background:var(--sky); }
  .arr { width:22px; height:22px; position:relative; } .arr::before { content:""; position:absolute; left:2px; right:6px; top:10px; height:3px; border-radius:2px; background:var(--soft); }
  .arr::after { content:""; position:absolute; right:2px; top:5px; width:9px; height:9px; border-top:3px solid var(--soft); border-right:3px solid var(--soft); transform:rotate(45deg); border-radius:2px; }
  .act { display:flex; align-items:center; gap:8px; white-space:nowrap; background:#fff; border-color:var(--c, var(--line)); box-shadow:inset 4px 0 0 var(--c, var(--line)); }
  .act .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .act .kind { flex:none; font:700 11px/1 var(--jp); color:#fff; background:var(--c, var(--soft)); border-radius:6px; padding:3px 5px; }
  .act .mp { margin-left:auto; flex:none; font:700 12px/1 var(--jp); color:var(--soft); } .act .mp b { color:var(--violet); font-size:14px; }
  .act .carry { flex:none; font:700 11px/1 var(--jp); color:var(--violet); border:1.5px dashed var(--violet); border-radius:6px; padding:2px 5px; }
  .magic { --c:var(--violet); } .skill { --c:var(--coral); } .plain { --c:var(--ink); }
  .grip { width:18px; height:22px; background:radial-gradient(circle, var(--line) 2px, transparent 2.5px) 0 0 / 9px 7.5px; }
  .g.off { opacity:.55; } .g.off .no { background:var(--soft); }
  .g.lock { grid-template-columns:28px 1fr; padding:4px 8px 4px 6px; background:transparent; border-style:dashed; color:var(--soft); font:700 13px/1 var(--jp); }
  .g.lock .no { font:600 12px/1 var(--num); }
  .g.lock .no { background:transparent; color:var(--soft); border:1.5px dashed var(--line); }
  .g.lock span:last-child { display:flex; align-items:center; gap:8px; } .g.lock span:last-child::before { content:""; width:12px; height:14px; border:2.5px solid var(--soft); border-radius:3px 3px 4px 4px; border-top-width:6px; opacity:.6; }
  /* どれにも当てはまらないとき */
  .fallback { margin-top:8px; padding:6px 6px 6px 6px; border-radius:16px; background:linear-gradient(135deg, #EEF6FF, #F6F2FF); border:1.5px solid #D7E4FA; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; }   /* 作戦の ボタンが 入りきらない 幅では つぎの 行へ */
  .fallback p { margin:0; font:700 14px/1.3 var(--jp); display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .fallback p .no { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font:900 13px/1 var(--jp); background:#fff; border:1.5px solid #D7E4FA; color:var(--sky); }
  .fallback .seg { flex:1 1 300px; min-width:0; }
  .seg { display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; padding:3px; border-radius:13px; background:#fff; border:1.5px solid var(--line); }
  .seg button { border:0; background:none; border-radius:10px; padding:6px 4px; font:700 13px/1.2 var(--jp); color:var(--soft); white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--sky); color:#fff; box-shadow:0 4px 0 rgba(46,168,255,.28); }
  .row-btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; margin-top:16px; }
  .jelly { border:0; border-radius:999px; padding:12px 20px; font:900 15px/1 var(--jp); background:var(--ink); color:#fff; box-shadow:0 6px 0 rgba(27,35,64,.25); }
  .jelly.light { background:#fff; color:var(--ink); box-shadow:0 6px 0 var(--line); }
  .jelly.small { padding:8px 14px; font-size:13px; box-shadow:0 4px 0 rgba(27,35,64,.22); } .jelly.light.small { box-shadow:0 4px 0 var(--line); border:1.5px solid var(--line); }
  .jelly.sky { background:var(--sky); box-shadow:0 6px 0 rgba(46,168,255,.3); }

  /* ---- ためしに戦う：どのターンに何番が動いたか ---- */
  .test summary { list-style:none; display:flex; align-items:center; gap:10px; cursor:default; }
  .test summary::-webkit-details-marker { display:none; }
  .test h2 { margin:0; font:900 19px/1.3 var(--jp); }
  .test summary .again { margin-left:auto; }
  .test .vs { margin:2px 0 8px; font:700 12px/1.4 var(--jp); color:var(--soft); }
  .log { list-style:none; margin:0; padding:0; display:grid; gap:2px; position:relative; }
  .log::before { content:""; position:absolute; left:12px; top:10px; bottom:10px; width:2px; background:var(--line); }
  .log li { position:relative; display:grid; grid-template-columns:26px 42px 1fr; gap:6px; align-items:center; padding:3px 0; }
  .log .n { width:26px; height:26px; font-size:14px !important; border-radius:50%; display:grid; place-items:center; font:600 16px/1 var(--num); background:var(--ink); color:#fff; box-shadow:0 0 0 4px #fff; }
  .log .n.auto { background:#fff; color:var(--sky); border:1.5px solid #D7E4FA; font:900 11px/1 var(--jp); }
  .log li > div { display:contents; }
  .log .t { font:700 11px/1 var(--jp); color:var(--soft); white-space:nowrap; } .log .t b { font:600 13px/1 var(--num); }
  .log .d { display:block; font:700 13px/1.4 var(--jp); }
  .log .d em { font-style:normal; color:var(--soft); font-weight:500; font-size:13px; }
  .log .dmg { font:600 15px/1 var(--num); color:var(--coral); } .log .heal { font:600 15px/1 var(--num); color:var(--leaf); }
  .result { margin-top:8px; padding:7px 10px; border-radius:14px; font-size:13px !important; background:#E9FBF3; font:700 14px/1.45 var(--jp); color:#13865A; }
  .used { margin:6px 0 0; font:700 11px/1.5 var(--jp); color:var(--soft); }
  .used b { font:600 13px/1 var(--num); color:var(--ink); }

  /* ---- 条件をえらぶシート（スマホでは下から出る） ---- */
  .dim { position:fixed; inset:0; background:rgba(27,35,64,.38); display:none; z-index:10; }
  .sheet { position:fixed; left:0; right:0; bottom:0; z-index:11; background:#fff; border-radius:28px 28px 0 0; padding:10px 16px 24px; display:none; box-shadow:0 -18px 40px -18px rgba(27,35,64,.4); max-height:78vh; overflow:auto; }
  body.sheet-on .dim, body.sheet-on .sheet { display:block; }
  .sheet::before { content:""; display:block; width:44px; height:5px; border-radius:9px; background:var(--line); margin:0 auto 12px; }
  .sheet h3 { margin:0; font:900 19px/1.3 var(--jp); }
  .sheet p { margin:2px 0 12px; font-size:13px; color:var(--soft); }
  .sheet h4 { margin:14px 0 8px; font:900 14px/1 var(--jp); display:flex; align-items:center; gap:8px; }
  .sheet h4 i { width:10px; height:10px; border-radius:50%; background:var(--c); }
  .opts { display:flex; flex-wrap:wrap; gap:8px; }
  .opts button { border:1.5px solid var(--line); background:var(--space); border-radius:12px; padding:9px 12px; font:700 14px/1.2 var(--jp); }
  .opts button b { font:600 14px/1 var(--num); color:var(--sky); }
  .opts button[aria-pressed="true"] { border-color:var(--sky); background:#E8F5FF; box-shadow:inset 0 0 0 1.5px var(--sky); }

  @media (max-width:820px) {
    .pet { grid-template-columns:48px 1fr; padding:6px 12px 6px 6px; gap:10px; border-radius:18px; }
    .pet .pic { width:48px; height:48px; border-radius:12px; } .pet h1 { font-size:20px; } .pet h1 small { font-size:12px; }
    .stats { display:none; }
    .head .btns .light { display:none; }
    .hint { font-size:12px; }
    .cols { grid-template-columns:1fr; }
    /* スマホ：条件と技を 1 つの札に上下で入れる（行の高さをおさえる）。つまむところは隠して、長押しで並べかえ */
    .g { grid-template-columns:28px minmax(0, 1fr) 40px; grid-template-areas:"no cond sw" "no act sw"; row-gap:3px; column-gap:8px; padding:5px 6px; }
    .g .no { grid-area:no; } .g .sw { grid-area:sw; width:40px; height:24px; } .g .sw::after { width:18px; height:18px; } .g .sw[aria-checked="true"]::after { transform:translateX(16px); }
    .g .cond { grid-area:cond; padding:4px 8px; font-size:13px; border-radius:10px 10px 4px 4px; } .g .act { grid-area:act; padding:4px 8px; font-size:13px; border-radius:4px 4px 10px 10px; }
    .g .arr, .g .grip { display:none; }
    .g.lock { grid-template-columns:30px 1fr; grid-template-areas:none; }
    .g.lock > * { grid-area:auto; }
    .test:not([open]) .log, .test:not([open]) .used, .test:not([open]) .vs { display:none; }
    .test summary { cursor:pointer; } .test summary h2::after { content:"（ひらく）"; font:700 12px/1 var(--jp); color:var(--soft); margin-left:6px; } .test[open] summary h2::after { content:"（とじる）"; }
  }
  @media (prefers-reduced-motion:reduce) { .sw::after { transition:none; } }
</style>
</head>
<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ ペット</small></header>
<main id="app"></main>
<div class="dim" id="dim"></div>
<section class="sheet" id="sheet" aria-label="えらぶ"></section>
<script type="module">
import "./lounge-en.js";   // 英語の 画面（MONO LINK の サイトの EN／日本語 と 同じ 決まり。英語の ときだけ 辞書を 読む）
import { me, act, busy, waitText } from "./lounge-client.js";   // ガンビットと 作戦は 門番の 記録（見本では ブラウザの 中の ためしの 門番）
import { mountWallet } from "./wallet-bar.js"; mountWallet();   // 上の 通貨の 札（玉・リソース・クレジット）と 両替
import { petInfo, linkTabs, gateHtml, addGateCss, toast } from "./pet-head.js";
import { SKILL, TYPES } from "./skills.js";
import { EFFECTS } from "./effects.js";
import { learned } from "./trees.js";
import { gambitSlots, petAt } from "./builds.js";
import { simulate, vitalsOf } from "./battle-sim.js";

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SL = { hp: "HP", mp: "MP", atk: "ATK", def: "DEF", int: "INT", res: "RES", agi: "AGI", dex: "DEX", luk: "LUK" };
const EF = (k) => (EFFECTS[k] ? EFFECTS[k].label : k);   // えらぶ 前は「◯◯」のまま
// 条件の 見せ方（だれの こと・ことば）と、数の はじめの 値・ふやす 幅
const CD = {
  hpBelow: ["me", (v) => `HP が <b>${v}%</b> より少ない`, 40, 5], hpAbove: ["me", (v) => `HP が <b>${v}%</b> より多い`, 70, 5], mpAtLeast: ["me", (v) => `MP が <b>${v}</b> 以上`, 10, 1], mpBelow: ["me", (v) => `MP が <b>${v}</b> より少ない`, 5, 1],
  debuffed: ["me", () => "デバフがある"], notBuffed: ["me", () => "バフがない"], selfHas: ["me", (v) => `<b>${EF(v)}</b> になっている`, "regen"], selfNotHas: ["me", (v) => `<b>${EF(v)}</b> になっていない`, "regen"],
  foeHpBelow: ["foe", (v) => `HP が <b>${v}%</b> より少ない`, 25, 5], foeHpAbove: ["foe", (v) => `HP が <b>${v}%</b> より多い`, 70, 5], foeBuffed: ["foe", () => "バフがある"], foeMpBelow: ["foe", (v) => `MP が <b>${v}</b> より少ない`, 5, 1],
  foeDebuffs: ["foe", (v) => `デバフが <b>${v}</b> つ以上`, 2, 1], foeHas: ["foe", (v) => `<b>${EF(v)}</b> になっている`, "paralysis"], foeNotHas: ["foe", (v) => `<b>${EF(v)}</b> になっていない`, "paralysis"],
  foeUsedPrank: ["foe", () => "前の番にイタズラをした"], foeStronger: ["foe", () => "自分より強い"],
  first: ["turn", () => "最初のターン"], every: ["turn", (v) => `<b>${v}</b> ターンごと`, 2, 1], after: ["turn", (v) => `<b>${v}</b> ターン目より後`, 3, 1], always: ["etc", () => "いつでも"],
};
const WHO = { me: ["自分", ""], foe: ["相手", "foe"], turn: ["ターン", "turn"], etc: ["そのほか", ""] };
const isNum = (k) => typeof CD[k][2] === "number", isFx = (k) => typeof CD[k][2] === "string";
const condHtml = (g) => { const [k, v] = g.if, c = CD[k] || CD.always; return `${c[0] === "etc" ? "" : `<span class="who ${WHO[c[0]][1]}">${WHO[c[0]][0]}</span>`}${c[1](v)}`; };
const STYLES = [["attack", "こうげき重視"], ["defense", "防御重視"], ["balance", "バランス"], ["mp", "MP を大事に"]];
const kindOf = (id) => (SKILL[id].type === null ? ["通常", "plain"] : SKILL[id].kind === "itazura" ? ["イタズラ", "magic"] : ["技", "skill"]);

let ME = await me(), MP = ME.pets && ME.pets[0];
const W = { list: [], style: "balance", dirty: false, row: -1, sheet: null, pick: null, val: null, seed: 1, reset: false };
// 覚えて いる 技（職業ツリー・サブツリー・持ちこし）と ガンビットの 枠の 数
const skillsOf = () => [MP.type, ...(MP.subs || [])].flatMap((id) => learned(id, new Set((MP.taken || {})[id] || []), MP.seed).skills).concat(MP.carry ? [MP.carry] : []).filter((v, i, a) => a.indexOf(v) === i);
const slotsOf = () => gambitSlots(MP.lv, [MP.type, ...(MP.subs || [])].reduce((a, id) => a + learned(id, new Set((MP.taken || {})[id] || []), MP.seed).keywords, 0));
function load() {
  if (!MP || !MP.type) return;
  W.list = (MP.gambits || MP.build.gambits).map((g) => ({ ...g, if: [...g.if] }));
  W.style = MP.style || MP.build.auto || "balance"; W.dirty = false; W.row = -1;
}
load();

function rowHtml(g, i) {
  const [kn, kc] = kindOf(g.do);
  return `<li class="g ${g.on === false ? "off" : ""}" ${W.row === i ? 'style="border-color:var(--ink);box-shadow:0 0 0 3px rgba(27,35,64,.12)"' : ""}><button class="no" data-row="${i}" aria-label="${i + 1} 番を えらぶ（並べかえ・けす）" style="border:0">${i + 1}</button><button class="sw" role="switch" data-sw="${i}" aria-checked="${g.on !== false}" aria-label="${i + 1} をつかう"></button>
    <button class="cond" data-cond="${i}">${condHtml(g)}</button><span class="arr"></span>
    <button class="act ${kc}" data-act="${i}"><span class="kind">${kn}</span><span class="nm">${esc(SKILL[g.do].name)}</span>${g.do === MP.carry ? `<span class="carry">持ちこし</span>` : ""}<span class="mp">MP <b>${SKILL[g.do].mp}</b></span></button><span class="grip"></span></li>`;
}
// ためしに戦う：練習用の かかし（同じ Lv の ディフェンダー）と。いま 画面で なおした ガンビットで
function testHtml() {
  const A = { ...MP.build, gambits: W.list, auto: W.style, owner: ME.name }, B = { ...petAt("defender", MP.lv), name: "練習用のかかし", owner: "VR", species: null };
  const EV = simulate(A, B, W.seed), END = EV.at(-1), acts = EV.filter((e) => e.type === "act" && e.who === 0 && !e.sim), used = {};
  for (const e of EV) if (e.type === "act" && e.who === 0) used[e.by] = (used[e.by] || 0) + 1;
  const li = acts.slice(0, 9).map((e) => { const hits = (e.hits || []).filter((h) => h.dmg > 0).map((h) => h.dmg);
    return `<li><span class="n ${e.by === "auto" ? "auto" : ""}">${e.by === "auto" ? "他" : e.by}</span><div><span class="t">ターン<b>${e.turn}</b></span><span class="d">${esc(e.name || "")}${hits.length ? ` <span class="dmg">${hits.join("+")}</span>` : ""}${e.heal ? ` <span class="heal">+${e.heal}</span>` : ""}${e.kind === "skip" ? " <em>（動けない）</em>" : ""}</span></div></li>`; }).join("");
  const hp = Math.max(0, Math.round((END.final[0].hp / vitalsOf(A).maxHp) * 100));
  return `<details class="panel test" aria-label="ためしに戦う" ${(W.testOpen ?? innerWidth > 820) ? "open" : ""}>
      <summary><h2>ためしに戦う</h2><button class="jelly sky small again" data-do="again">もう一度</button></summary>
      <p class="vs">練習用のかかし（Lv${MP.lv}）と。丸の数字は動いたガンビットの番号</p>
      <ol class="log">${li}</ol>
      <div class="result" ${END.winner === 0 ? "" : 'style="background:#FFF0F1;color:#C23B47"'}>ターン ${END.turns} で${END.winner === 0 ? `勝ち。HP は ${hp}% 残った` : "負け"}</div>
      <p class="used">動いた回数　${W.list.map((g, i) => (used[i + 1] ? `${i + 1} 番 <b>${used[i + 1]}</b>` : "")).filter(Boolean).join("・")}${used.auto ? `・オート <b>${used.auto}</b>` : ""}</p></details>`;
}
function render() {
  const gate = gateHtml(ME, esc); if (gate) return gate;
  const info = petInfo(MP), ty = TYPES[MP.type], st = MP.build.stats, max = slotsOf(), nextLv = [5, 10, 15, 20, 30].filter((x) => x > MP.lv);
  const tools = W.row >= 0 ? `<div class="row-btns" style="margin:8px 0 0;justify-content:flex-start"><span style="font:700 12px/2.4 var(--jp);color:var(--soft)">${W.row + 1} 番を</span><button class="jelly light small" data-do="up" ${W.row ? "" : "disabled"}>上へ</button><button class="jelly light small" data-do="down" ${W.row < W.list.length - 1 ? "" : "disabled"}>下へ</button><button class="jelly light small" data-do="del">けす</button></div>` : "";
  return `
  <section class="panel pet" aria-label="ペット">
    <div class="pic"><img src="${info.img}" alt="${esc(info.label)}の${esc(MP.name)}"></div>
    <div><h1>${esc(MP.name)}<small>${esc(info.label)} ／ ${esc(ME.name)} の相棒</small></h1><div class="meta"><span class="badge" style="--c:${ty.color}">${ty.label}</span><span class="lv"><small>Lv</small>${MP.lv}</span></div></div>
    <div class="stats" aria-label="ステータス">${Object.keys(SL).map((k) => `<span>${SL[k]}<b>${st[k]}</b></span>`).join("")}</div>
  </section>
  <nav class="tabs" role="tablist"><button role="tab" aria-selected="false">ステータス</button><button role="tab" aria-selected="false">スキルツリー</button><button role="tab" aria-selected="true">ガンビット</button><button role="tab" aria-selected="false">装備</button><button role="tab" aria-selected="false">冒険</button><button role="tab" aria-selected="false">なかま</button></nav>
  <div class="cols">
    <section class="panel" aria-label="ガンビット">
      <div class="head"><h2>ガンビット</h2><span>枠 ${W.list.length} / ${max}</span><div class="btns"><button class="jelly light small" data-do="tmpl">${W.reset ? "もう 1 回 押すと もどす" : "お手本に もどす"}</button><button class="jelly small" data-do="save" ${W.dirty ? "" : "disabled"} style="${W.dirty ? "" : "opacity:.45"}">保存</button></div></div>
      <p class="hint">上から順に見て、最初に当てはまったものをします。番号を 押すと 並べかえ・けす。</p>
      <ol class="gb">${W.list.map(rowHtml).join("")}
        ${W.list.length < max ? `<li class="g lock" style="cursor:pointer"><button class="no" data-do="add" aria-label="行を 足す" style="border:1.5px dashed var(--line);background:#fff;color:var(--sky)">＋</button><span>行を 足す（あと ${max - W.list.length}）</span></li>` : ""}
        ${nextLv.length ? `<li class="g lock"><span class="no">+${nextLv.length}</span><span>${max + 1}〜${max + nextLv.length} 番は Lv${nextLv.join("・")} で開く</span></li>` : ""}
      </ol>${tools}
      <div class="fallback">
        <p><span class="no">他</span>どれでもないときのオート</p>
        <div class="seg" role="group" aria-label="オートの作戦">${STYLES.map(([k, n]) => `<button data-style="${k}" aria-pressed="${W.style === k}">${n}</button>`).join("")}</div>
      </div>
    </section>
    ${testHtml()}
  </div>`;
}
// 下から 出る シート：条件 か 行動を えらぶ
function sheetHtml() {
  const i = W.row, g = W.list[i];
  if (W.sheet === "act") {
    const list = ["kogeki", "bougyo", ...skillsOf().filter((id) => SKILL[id] && SKILL[id].kind !== "passive")];
    return `<h3>${i + 1} 番で する ことを えらぶ</h3><p>覚えて いる 技と、こうげき・ぼうぎょ</p><div class="opts">${list.map((id) => { const [kn] = kindOf(id); return `<button data-pickact="${id}" aria-pressed="${g.do === id}">${esc(SKILL[id].name)} <small style="color:var(--soft);font:700 11px/1 var(--jp)">${kn}・MP ${SKILL[id].mp}</small></button>`; }).join("")}</div>`;
  }
  const k = W.pick || g.if[0], v = W.val, groups = [["me", "--soft"], ["foe", "--coral"], ["turn", "--sky"], ["etc", "--leaf"]];
  const val = isNum(k) ? `<div class="opts" style="margin-top:12px;align-items:center"><span style="font:700 13px/1 var(--jp)">数</span><button data-val="-1">−</button><b style="font:600 22px/1 var(--num);min-width:48px;text-align:center">${v}</b><button data-val="1">＋</button></div>`
    : isFx(k) ? `<div class="opts" style="margin-top:12px;align-items:center"><span style="font:700 13px/1 var(--jp)">状態</span><select id="fxsel" style="font:700 14px/1.2 var(--jp);padding:8px;border-radius:10px;border:1.5px solid var(--line)">${Object.keys(EFFECTS).filter((x) => (k.startsWith("self") ? EFFECTS[x].buff : !EFFECTS[x].buff)).map((x) => `<option value="${x}" ${x === v ? "selected" : ""}>${esc(EFFECTS[x].label)}</option>`).join("")}</select></div>` : "";
  return `<h3>${i + 1} 番の条件をえらぶ</h3><p>◯ の数字と ◯◯ の状態は、えらんだあとに変えられます</p>
    ${groups.map(([w, c]) => `<h4 style="--c:var(${c})"><i></i>${WHO[w][0]}</h4><div class="opts">${Object.keys(CD).filter((x) => CD[x][0] === w).map((x) => `<button data-pickcond="${x}" aria-pressed="${x === k}">${CD[x][1](x === k && v != null ? v : isNum(x) ? "◯" : isFx(x) ? "◯◯" : undefined).replace(/<b>◯%<\/b>/, "<b>◯%</b>")}</button>`).join("")}</div>`).join("")}
    ${val}<div class="row-btns"><button class="jelly light small" data-do="close">やめる</button><button class="jelly sky small" data-do="setcond">決める</button></div>`;
}
const openSheet = (kind, i) => { W.row = i; W.sheet = kind; W.pick = W.list[i].if[0]; W.val = W.list[i].if[1] ?? (CD[W.pick][2] ?? null); paint(); document.body.classList.add("sheet-on"); };
const closeSheet = () => { W.sheet = null; document.body.classList.remove("sheet-on"); paint(); };
function paint() {
  document.getElementById("app").innerHTML = render(); linkTabs();
  document.getElementById("sheet").innerHTML = W.sheet ? sheetHtml() : "";
}
const touch = () => { W.dirty = true; W.reset = false; };
addGateCss();
document.addEventListener("toggle", (e) => { if (e.target.classList && e.target.classList.contains("test")) W.testOpen = e.target.open; }, true);   // 描きなおしても 開け閉めを のこす
document.body.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) { if (e.target.id === "dim") closeSheet(); return; }
  const d = b.dataset;
  if (d.row) { W.row = W.row === +d.row ? -1 : +d.row; return paint(); }
  if (d.sw) { const g = W.list[+d.sw]; if (g.on === false) delete g.on; else g.on = false; touch(); return paint(); }
  if (d.cond) return openSheet("cond", +d.cond);
  if (d.act) return openSheet("act", +d.act);
  if (d.pickact) { W.list[W.row].do = d.pickact; touch(); return closeSheet(); }
  if (d.pickcond) { W.pick = d.pickcond; W.val = CD[W.pick][2] ?? null; return paint(); }
  if (d.val) { W.val = Math.max(1, Math.min(100, W.val + (+d.val) * CD[W.pick][3])); return paint(); }
  if (d.style) { const was = W.style; W.style = d.style; paint(); const r = await act("pet.style", { style: d.style }); if (!r.ok) { W.style = was; paint(); return toast(r.why || "かえられませんでした"); } ME = await me(); MP = ME.pets[0]; return toast(`作戦：${STYLES.find(([k]) => k === d.style)[1]}`); }
  const x = d.do;
  if (x === "close") return closeSheet();
  if (x === "setcond") { const k = W.pick; let v = W.val; if (isFx(k)) v = document.getElementById("fxsel").value; W.list[W.row].if = isNum(k) || isFx(k) ? [k, v] : [k]; touch(); return closeSheet(); }
  if (x === "up" || x === "down") { const j = W.row + (x === "up" ? -1 : 1); [W.list[W.row], W.list[j]] = [W.list[j], W.list[W.row]]; W.row = j; touch(); return paint(); }
  if (x === "del") { W.list.splice(W.row, 1); W.row = -1; touch(); return paint(); }
  if (x === "add") { W.list.push({ if: ["always"], do: "kogeki" }); W.row = W.list.length - 1; touch(); return paint(); }
  if (x === "again") { e.preventDefault(); W.seed++; return paint(); }
  if (x === "save" || (x === "tmpl" && W.reset)) {
    const r = await busy(b, () => act("pet.gambits", { list: x === "save" ? W.list : null }));
    if (!r.ok) return toast(r.wait ? waitText : r.why || "保存できませんでした");
    ME = await me(); MP = ME.pets[0]; W.reset = false; load(); paint(); return toast(x === "save" ? "ガンビットを 保存した" : "お手本に もどした");
  }
  if (x === "tmpl") { W.reset = true; return paint(); }
});
paint();
window.ready = true;
</script>
</body>
