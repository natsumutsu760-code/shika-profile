<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Adventure</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：冒険（VR ゲームの行き先）の画面。門番の 記録で 動く：ペットが いない → 性格診断へ、職業が まだ → えらぶ、出かけて いる → ようす、帰って きた → 結果と日記
     部品と色は装備・ガンビットの画面と同じ。ゲームの中の画面（ワールドマップ・戦い）だけ「ゴーグルの中」として黒いふちで囲む
     ワールドマップは鹿さんの参考ゲーム「魔界派遣ヴェルヴェット(株) M1試作」と同じ描き方。絵（img/world.jpg）は worldmap.py で Blender の 3D の島を写したもの */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF;
    --r1:#9AA0B8; --r2:#2F7BFF; --r3:#9B4DFF; --r4:#FFB300; --r5:#FF2E4D;
    --visor:#141826; --led:#52F2A0; --cyan:#46D4FF;
    --myth:linear-gradient(90deg, #FF8FC4, #FFE27A, #8FF0C8, #8FC8FF, #C4A0FF);
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif; --game:"DotGothic16", "Zen Maru Gothic", monospace;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  h2, h3, p { margin:0; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.9); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 18px); }
  .pet { display:grid; grid-template-columns:60px auto 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #E4F7EE 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:150%; margin-top:-4%; }
  .pet h1 { margin:0; font:900 24px/1.1 var(--jp); display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }
  .pet .meta { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }
  .res { justify-self:end; text-align:right; font:700 12px/1.2 var(--jp); color:var(--soft); }
  .res b { display:block; font:600 24px/1 var(--num); color:var(--ink); }
  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); display:inline-flex; align-items:center; gap:6px; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }
  .tabs .away { width:8px; height:8px; border-radius:50%; background:var(--led); box-shadow:0 0 0 3px rgba(82,242,160,.25); }
  .jelly { border:0; border-radius:999px; padding:11px 16px; font:900 14px/1 var(--jp); background:var(--ink); color:#fff; box-shadow:0 5px 0 rgba(27,35,64,.25); }
  .jelly.light { background:#fff; color:var(--ink); box-shadow:0 5px 0 var(--line); border:1.5px solid var(--line); }
  .jelly.sky { background:var(--sky); box-shadow:0 5px 0 rgba(46,168,255,.3); }
  .stars { display:inline-flex; gap:1px; font-size:13px; line-height:1; color:var(--rc); letter-spacing:-1px; }
  .r1 { --rc:var(--r1); } .r2 { --rc:var(--r2); } .r3 { --rc:var(--r3); } .r4 { --rc:var(--r4); } .r5 { --rc:var(--r5); }
  .ico { display:grid; place-items:center; border-radius:12px; background:radial-gradient(circle at 50% 40%, #fff 0, color-mix(in srgb, var(--rc, var(--r1)) 16%, #fff) 85%); }
  .ico img { width:86%; height:86%; object-fit:contain; }
  .sub { font:900 12px/1.2 var(--jp); color:var(--soft); margin:12px 0 6px; }

  /* ゴーグルの中の画面：黒いふち・右上の緑のランプ・下の水色の線（3D のゴーグルと同じ） */
  .visor { position:relative; display:block; border-radius:22px; border:6px solid var(--visor); background:var(--visor); overflow:hidden; isolation:isolate; }
  .visor svg { display:block; width:100%; height:100%; }
  .visor::after { content:""; position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:16px;
    background:repeating-linear-gradient(0deg, rgba(20,24,38,.12) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 45%, transparent 60%, rgba(20,24,38,.35) 100%); }

  /* ===== えらぶ ===== */
  .pick { display:grid; grid-template-columns:minmax(0, 1fr) 380px; gap:16px; align-items:start; }
  /* ワールドマップ：絵の地図にピンと道。奥へ行くほど敵が強い。スマホでは地図を指で動かす */
  .world { padding:0; }
  .world::after { display:none; }
  .world::before { content:""; position:absolute; z-index:4; right:12px; top:10px; width:9px; height:9px; border-radius:50%; background:var(--led); box-shadow:0 0 8px var(--led); }
  .wtitle { position:absolute; z-index:4; left:10px; top:9px; padding:5px 10px; border-radius:10px; background:rgba(20,24,38,.72); color:#fff; font:400 13px/1 var(--game); pointer-events:none; }
  .wscroll { overflow:auto; overscroll-behavior:contain; scrollbar-width:none; }
  .wscroll::-webkit-scrollbar { display:none; }
  .wmap { position:relative; width:100%; aspect-ratio:16 / 10; background:#1d3b55 url(img/world.jpg) center / cover no-repeat; }
  .wmap::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(20,24,38,.04) 0 1px, transparent 1px 3px), radial-gradient(120% 90% at 50% 45%, transparent 62%, rgba(20,24,38,.4) 100%); }
  .wmap svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .road { fill:none; stroke-linecap:round; } .road.under { stroke:rgba(20,24,38,.5); stroke-width:9; } .road.top { stroke:#F3E2B8; stroke-width:4.5; stroke-dasharray:14 11; }
  .wpin { position:absolute; z-index:2; left:var(--x); top:var(--y); width:0; height:0; padding:0; border:0; background:none; }
  /* ピンは地図の場所（町・遺跡・村・水晶）を隠さないように、細い棒で上に浮かせる */
  .wpin::before { content:""; position:absolute; left:-4px; top:-4px; width:8px; height:8px; border-radius:50%; background:var(--dc, #fff); box-shadow:0 0 0 2px #fff, 0 1px 4px rgba(20,24,38,.6); }
  .wpin .chip { position:absolute; left:0; bottom:26px; transform:translateX(-50%); display:inline-flex; align-items:stretch; border-radius:10px; white-space:nowrap; background:rgba(20,24,38,.8); color:#fff; box-shadow:0 3px 10px rgba(20,24,38,.45); }
  .wpin .chip::after { content:""; position:absolute; left:calc(50% - 1px); top:100%; width:2px; height:22px; background:rgba(255,255,255,.9); box-shadow:0 0 3px rgba(20,24,38,.5); }
  .wpin .chip b { display:grid; place-items:center; padding:0 7px; border-radius:10px 0 0 10px; background:var(--fit); color:var(--visor); font:600 12px/1 var(--num); }
  .wpin .chip span { padding:6px 9px 5px 8px; font:400 13px/1 var(--game); }
  .wpin.home::before { background:var(--visor); }
  .wpin.home .chip { bottom:auto; top:26px; background:rgba(255,255,255,.92); color:var(--visor); }
  .wpin.home .chip::after { top:auto; bottom:100%; }
  .wpin.home .chip span { padding:5px 9px 4px; }
  .wpin[aria-pressed="true"] { z-index:3; }
  .wpin[aria-pressed="true"] .chip { background:var(--cyan); color:var(--visor); box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--dc), 0 6px 14px rgba(20,24,38,.5); }
  .wpin[aria-pressed="true"]::after { content:""; position:absolute; left:-22px; top:-22px; width:44px; height:44px; border-radius:50%; border:2px solid var(--cyan); animation:ping 1.6s ease-out infinite; }
  .wpin:focus-visible { outline:none; } .wpin:focus-visible .chip { outline:3px solid var(--sky); outline-offset:2px; }
  @keyframes ping { from { transform:scale(.45); opacity:1; } to { transform:scale(1.25); opacity:0; } }
  .wleg { margin-top:8px; display:flex; align-items:center; flex-wrap:wrap; gap:4px 6px; font:700 12px/1.4 var(--jp); color:var(--soft); }
  .wleg span { margin-right:4px; color:var(--ink); } .wleg i { width:10px; height:10px; border-radius:3px; background:var(--c); margin-left:6px; }
  .hist { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
  .hist li { display:grid; grid-template-columns:84px 132px 92px 72px minmax(0, 1fr); gap:10px; align-items:center; padding:6px 12px; border-radius:12px; background:var(--space); font:700 12px/1.3 var(--jp); color:var(--soft); }
  .hist b { font:700 13px/1.3 var(--jp); color:var(--ink); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; } .hist b::before { content:""; width:9px; height:9px; border-radius:3px; background:var(--dc); }
  .hist .when, .hist .rk { font-family:var(--num); font-weight:500; } .hist .out { color:#13A36A; } .hist .out.ng { color:var(--soft); }
  .hist .it { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .detail h2 { font:900 22px/1.25 var(--jp); display:flex; align-items:center; gap:8px; }
  .detail h2::before { content:""; width:14px; height:14px; border-radius:5px; background:var(--dc); flex:none; }
  .detail h2 .rec { margin-left:auto; font:700 12px/1 var(--jp); color:var(--soft); white-space:nowrap; }
  .detail .desc { margin-top:4px; font:700 13px/1.6 var(--jp); color:var(--soft); }
  .foes { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
  .foes li { display:inline-flex; align-items:center; gap:6px; padding:4px 10px 4px 7px; border-radius:999px; border:1.5px solid var(--line); background:#fff; font:700 12px/1.2 var(--jp); }
  .foes li i { width:9px; height:9px; border-radius:50%; background:var(--c); }
  .foes li small { font:600 12px/1 var(--num); color:var(--soft); }
  .foes li.boss { border-color:#FFD98A; background:#FFF8E6; }
  .foes li.boss.off { opacity:.45; }
  .foes li.rare { border-color:#D9C8FF; background:#F7F2FF; }
  .foes li .tg { font:700 10px/1 var(--jp); color:#7A55E0; }
  .myth { margin-top:8px; display:grid; grid-template-columns:46px 1fr; gap:10px; align-items:center; padding:6px 10px 6px 6px; border-radius:16px; border:2px solid transparent; background:linear-gradient(#fff, #fff) padding-box, var(--myth) border-box; }
  .myth .ico { width:46px; height:46px; background:#F1F3F9; }
  .myth .ico img { filter:brightness(0) opacity(.28); }
  .myth b { font:900 14px/1.2 var(--jp); letter-spacing:.1em; }
  .myth small { display:block; font:700 11px/1.45 var(--jp); color:var(--soft); }
  .runs { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; }
  .fls { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:6px; }
  .fls button { position:relative; border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:9px 2px 7px; text-align:center; }
  .fls button b { display:block; font:600 18px/1 var(--num); } .fls button b small { font:700 11px/1 var(--jp); margin-left:1px; }
  .fls button span { display:block; margin-top:4px; font:700 10.5px/1.25 var(--jp); color:var(--soft); }
  .fls button[aria-pressed="true"] { border-color:var(--sky); background:#EAF6FF; box-shadow:0 0 0 3px rgba(46,168,255,.16); }
  .fls button[aria-pressed="true"] span { color:var(--ink); }
  .fls button:disabled { opacity:.45; cursor:default; }
  .fls .rec { position:absolute; left:50%; top:-8px; transform:translateX(-50%); padding:2px 6px; border-radius:99px; background:var(--leaf); color:#fff; font:700 9.5px/1.3 var(--jp); font-style:normal; white-space:nowrap; }
  .runs button { border:1.5px solid var(--line); background:#fff; border-radius:16px; padding:8px 6px 7px; text-align:center; }
  .runs button b { display:block; font:600 20px/1 var(--num); } .runs button b small { font:700 12px/1 var(--jp); margin-left:1px; }
  .runs button span { display:block; margin-top:4px; font:700 11px/1.3 var(--jp); color:var(--soft); }
  .runs button[aria-pressed="true"] { border-color:var(--sky); background:#EAF6FF; box-shadow:0 0 0 3px rgba(46,168,255,.16); }
  .runs button[aria-pressed="true"] span { color:var(--ink); }
  .est { margin-top:10px; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; font:700 12px/1.3 var(--jp); color:var(--soft); }
  .est .bar { height:10px; border-radius:99px; background:#EDF1F8; overflow:hidden; }
  .est .bar i { display:block; height:100%; border-radius:99px; background:var(--ec); }
  .est b { font:600 18px/1 var(--num); color:var(--ink); } .est b small { font:700 11px/1 var(--jp); color:var(--soft); margin-left:4px; }
  .starline { margin-top:6px; font:700 12px/1.4 var(--jp); color:var(--soft); }
  .starline b { font:600 13px/1 var(--num); color:var(--ink); }
  .go { margin-top:14px; width:100%; padding:15px 16px; font-size:16px; display:flex; align-items:center; justify-content:center; gap:10px; }
  .go svg { width:30px; height:18px; }

  /* ===== 出かけている途中 ===== */
  .play { display:grid; grid-template-columns:270px minmax(0, 1fr); gap:16px; align-items:stretch; }
  .real { display:flex; flex-direction:column; align-self:start; }
  .real .stage { height:220px; border-radius:20px; background:radial-gradient(circle at 50% 36%, #fff 0, #E4F7EE 82%); display:flex; justify-content:center; overflow:hidden; }
  .real .stage img { height:116%; margin-top:-3%; }
  .real .where { margin-top:10px; font:900 15px/1.3 var(--jp); }
  .real .where small { display:block; font:700 12px/1.4 var(--jp); color:var(--soft); }
  .timer { margin-top:8px; display:flex; align-items:baseline; gap:8px; }
  .timer b { font:600 40px/1 var(--num); letter-spacing:.02em; } .timer small { font:700 13px/1 var(--jp); color:var(--soft); }
  /* 周回：スイッチ ＋ 回数の チップ */
  .loop { display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; margin-top:12px; padding:8px 10px; border-radius:16px; background:var(--space); }
  .loop .sw { display:inline-flex; align-items:center; gap:8px; border:0; background:none; padding:2px 0; font:900 14px/1 var(--jp); color:var(--ink); }
  .loop .sw i { position:relative; width:38px; height:22px; border-radius:99px; background:#CDD5E5; transition:background .15s; }
  .loop .sw i::after { content:""; position:absolute; left:3px; top:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(27,35,64,.3); transition:left .15s; }
  .loop.on .sw i { background:var(--leaf); } .loop.on .sw i::after { left:19px; }
  .loop .lnow { font:700 12px/1.2 var(--jp); color:#0E8F5A; } .loop .lnow.off { color:var(--soft); }
  .loop .lcnt { display:flex; gap:4px; margin-left:auto; }
  .loop .lcnt button { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:4px 9px; font:700 12px/1 var(--jp); color:var(--soft); white-space:nowrap; }
  .real .loop .lcnt { flex-basis:100%; margin-left:0; } .real .loop .lcnt button { flex:1; padding:5px 4px; }   /* 出かけて いる ときは 列が 細いので 回数を 下の 行に */
  .loop .lcnt button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  @media (prefers-reduced-motion:reduce) { .loop .sw i, .loop .sw i::after { transition:none; } }
  /* 周回の まとめ */
  .lsum { margin-bottom:12px; padding:12px 16px; border:2px solid #BDEBD3; background:#F3FCF7; }
  .lsum.stop { border-color:#FFD98A; background:#FFFBEF; }
  .lsum .lh { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .lsum .lh b { font:900 15px/1.2 var(--jp); } .lsum .lh span { font:700 12px/1.2 var(--jp); color:var(--soft); }
  .lsum .lx { margin-left:auto; border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:5px 12px; font:900 12px/1 var(--jp); }
  .lsum .lc { margin:8px 0 0; display:flex; flex-wrap:wrap; gap:6px; } .lsum .lc span { padding:3px 10px; border-radius:99px; background:#fff; font:700 12px/1.4 var(--jp); } .lsum .lc b { font:600 13px/1 var(--num); }
  .lsum .lw { margin:8px 0 0; font:900 13px/1.4 var(--jp); color:#A56A00; }
  .lsum .lgo { display:inline-block; margin-top:8px; font:900 13px/1 var(--jp); color:#1E6FB0; }
  .timer.back { flex-wrap:wrap; row-gap:4px; } .timer.back b { font:900 24px/1.15 var(--jp); letter-spacing:0; white-space:nowrap; } .timer.back small { white-space:nowrap; } .pbar.cut i { background:var(--leaf); } .pbar.cut.wipe i { background:var(--coral); }   /* 早めに 帰る：バーは そこで 止まる */
  .pbar { margin-top:8px; height:10px; border-radius:99px; background:#EDF1F8; overflow:hidden; } .pbar i { display:block; height:100%; border-radius:99px; background:var(--sky); }
  .real .jelly { margin-top:auto; } .real .note { margin:8px 0 0; font:700 11px/1.5 var(--jp); color:var(--soft); }
  .real .spacer { flex:1; min-height:12px; }
  .inside { min-height:420px; border-width:8px; border-radius:30px; }
  .inside > svg { position:absolute; inset:0; z-index:0; }
  .inside .shade { position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(20,24,38,0) 30%, rgba(20,24,38,.82) 78%); }
  .hud { position:absolute; z-index:3; left:16px; right:16px; top:14px; display:flex; gap:6px; flex-wrap:wrap; }
  .hud span { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:10px; background:rgba(20,24,38,.7); color:rgba(255,255,255,.55); font:400 13px/1 var(--game); }
  .hud span.done { color:#fff; } .hud span.done::before { content:"✓"; color:var(--led); } .hud span i { font-style:normal; }
  .hud span.now { color:var(--visor); background:var(--cyan); }
  .hud span.boss { box-shadow:inset 0 0 0 1.5px #FFD98A; }
  .glog { position:absolute; z-index:3; left:18px; right:18px; bottom:16px; list-style:none; margin:0; padding:0; display:grid; gap:4px; font:400 15px/1.45 var(--game); color:#fff; }
  .glog li { opacity:.55; } .glog li:nth-last-child(-n+3) { opacity:.8; } .glog li:last-child { opacity:1; }
  .glog li.sys { color:var(--cyan); }
  .glog li em { font-style:normal; display:inline-block; min-width:1.6em; color:var(--led); }
  .glog li:last-child::after { content:"▍"; margin-left:3px; color:var(--cyan); animation:blink 1s steps(1) infinite; }
  @keyframes bob { 50% { transform:translateY(-4px); } }
  .meter { background:rgba(20,24,38,.7); border-radius:12px; padding:6px 10px 8px; color:#fff; font:400 12px/1.2 var(--game); }

      <p class="where">${esc(d.name)} ${actAt}<small>${run.sec / 60} 分コース・${PURPOSES[pu].name}・${wonSoFar} 戦 勝った</small></p>
      ${back ? `<div class="timer back"><b>帰って くる</b><small>${BACK_WHY[res.reason === "wipe" ? "wipe" : pu] || ""}</small></div>` : `<div class="timer"><b>${mm(Math.max(0, (full - now) / 1000))}</b><small>のこり</small></div>`}
      <div class="pbar ${back ? `cut ${res.reason === "wipe" ? "wipe" : ""}` : ""}"><i style="width:${Math.round(Math.min(1, (Math.min(now, t.end) - t.start) / Math.max(1, full - t.start)) * 100)}%"></i></div>
      ${loopHtml("play")}
      <div class="spacer"></div>
    </section>
    <section class="visor inside ex th-${did}" style="--dc:${d.color}" aria-label="ゴーグルの中">
      ${scene(d.id, "p")}<div class="shade"></div>
      <div class="hud">${hud}<span class="act ${tr.a}">${act}</span></div>
      <div class="pgrid">${mapHtml(did, f, seen, opened, hidOpen, tr)}<div class="side"><div class="party">${party}</div>${side}</div></div>
      <ol class="glog">${lines.map((l) => `<li class="${l.sys ? "sys" : ""}">${l.sys ? "▶ " : l.by !== undefined ? `<em>${l.by}</em>` : ""}${esc(l.t)}</li>`).join("")}</ol>
    </section></div>`;
}

// ---------- 結果と日記（門番が 出かける ときに 決めた ごほうび：TRIP.got）----------
let GOT = null;   // うけとった ときの 門番の 返事
const hl = (text, s) => text.replace(esc(s), (m) => `<span class="m">${m}</span>`);
function renderDone() {
  const t = TRIP, g = t.got, d = DUNGEONS.find((x) => x.id === t.did), myth = g.mythic && d.mythic.id === g.mythic ? d.mythic : null, eq = g.equip.filter((it) => it.base !== g.mythic);
  let text = esc(g.diary);
  for (const it of eq) text = hl(text, `${baseName(it.base)}（★${it.star}）`);
  if (myth) text = hl(text, `★ミシック★ ${myth.name}を 手に入れた！`);
  for (const f of g.captured) text = hl(text, `${f.name}を 捕まえた！`);
  const items = eq.map((it) => `<li class="r${it.star}"><span class="ico">${gearImg(it.base, { dir: IMG })}</span><div><b>${esc(baseName(it.base))}</b>${stars(it.star)}<span class="ops">${it.ops.map((o) => esc(OPS[o].fmt(OPS[o].v[it.star - 1]))).join("・")}</span></div></li>`).join("");
  const mythLi = myth ? `<li class="mythic"><span class="ico">${gearImg(myth.id, { dir: IMG })}</span><div><span class="tag">ミシック</span><b>${esc(myth.name)}</b><span class="fx">${esc(myth.text)}</span></div></li>` : "";
  const title = g.reason === "wipe" ? "力つきて 帰ってきた" : g.boss ? "ボスを たおした！" : g.reason === "done" ? "目的を はたして 帰ってきた" : "時間に なって 帰ってきた";
  const [r0, r1] = g.ratio, date = new Date(t.end), wd = "日月火水木金土"[date.getDay()];
  const mats = g.materials.map((m) => ({ ...m, name: MAT_NAME[m.id] || m.id }));
  const split = toStash(mats, STASH.cap, STASH.have), chip = (m) => `<li class="${MAT_FROM[m.id] ? "en" : HIDDEN_MAT.has(m.id) ? "hd" : "ga"}">${MAT_FROM[m.id] ? `<img src="${spriteURL(MAT_FROM[m.id])}" alt="">` : "<i></i>"}<b>${esc(m.name)}</b>${m.q ? `<span class="q" aria-label="品質 ${m.q}">${"◆".repeat(m.q)}${"◇".repeat(5 - m.q)}</span>` : ""}<em>×${m.n}</em></li>`;
  const btns = GOT ? `<div class="btns"><button class="jelly sky" id="again">もう一度 出発</button><a class="jelly light" href="equip.html" style="text-align:center;text-decoration:none">装備を見る</a></div>`
    : `<button class="jelly sky go" id="collect">うけとる</button><p class="why" id="cWhy"></p>`;
  return `<div class="done">
    <section class="panel diary" style="--dc:${d.color}" aria-label="${esc(MP.name)}の日記">
      <header><b>${date.getMonth() + 1}月${date.getDate()}日（${wd}）</b><small>${esc(MP.name)}の日記</small><span class="stamp">${esc(d.name)} ${RUNS[t.run].sec / 60}分</span></header>
      <div class="page"><p>${text}</p><img class="sticker" src="${VR_IMG}" alt=""></div>
    </section>
    <aside class="panel result" style="--dc:${d.color}" aria-label="結果">
      <h2 class="${g.reason === "wipe" ? "lose" : ""}">${title}</h2>
      <p class="sum">${g.wins} 戦 勝った・${g.kills} たい たおした・休憩 ${(g.stats && g.stats.rests) || 0} 回</p>
      <div class="exbox"><span>探索率</span><b>${Math.round(r0 * 100)}%<i>→</i>${Math.round(r1 * 100)}%</b><small>+${Math.max(0, Math.round((r1 - r0) * 100))}%</small></div>
      <div class="gain"><span>経験値<b>+${GOT ? GOT.exp : g.exp}</b></span><span>クレジット<b>+${g.credits.toLocaleString("ja-JP")}</b></span>${g.snacks ? `<span>おやつ<b>+${g.snacks}</b></span>` : ""}${g.resource ? `<span>リソース<b>+${g.resource}</b></span>` : ""}${g.stats && g.stats.gather ? `<span>採取<b>${g.stats.gather}</b> か所</span>` : ""}</div>
      ${g.captured.length ? `<h3 class="sub">捕まえた</h3><ul class="caught">${g.captured.map((f) => { const TR = ENEMY_TREES[f.tree], rk2 = rankOf(f); return `<li><span class="orb spr" style="--c:${TYPES[f.type].color}"><img src="${spriteURL(f.tree)}" alt=""></span><div><b>${esc(f.name)}</b><span class="lvb">Lv${f.lv}</span>${rk2 === "通常" ? "" : `<span class="rk">${rk2}</span>`}<span class="tr">スキルツリー「${esc(TR.name)}」</span><span class="lab">なかまの画面で 研究（リソース ${RESEARCH[rk2]}）・懐柔できる</span></div></li>`; }).join("")}</ul>` : ""}
      <h3 class="sub">宝箱から 届いた装備</h3>
      ${mythLi || items ? `<ul class="got">${mythLi}${items}</ul>` : `<p class="none">今回は 宝箱を 見つけられなかった。地図が うまるほど 見つけやすい</p>`}
      ${mats.length ? `<h3 class="sub">拾った素材<small>売ると 玉 ${mats.reduce((a, m) => a + sellPrice(m) * m.n, 0).toLocaleString("ja-JP")}</small></h3>
      ${split.stash.length ? `<ul class="mats">${split.stash.map(chip).join("")}</ul>` : ""}
      ${split.box.length ? `<h3 class="sub">あずかり箱へ<small>倉庫が いっぱい・${BOX_DAYS} 日 のこる</small></h3><ul class="mats bx">${split.box.map(chip).join("")}</ul><a class="boxgo" href="hideout.html?t=store">倉庫で うけとる</a>` : ""}` : ""}
      ${btns}
    </aside></div>`;
}

// ---------- まだ ペットが いない・職業を えらぶ ----------
function renderGate() {
  if (ME.denied || ME.ok === false) return gateHtml(ME, esc);   // ログインが 切れて いれば MONO LINK で ログインする 道も
  return `<section class="panel gate"><h2>まず 1 匹目を むかえる</h2><p>6 つの 質問で、いっしょに 冒険する 子が 決まります</p><a class="jelly sky go" href="quiz.html" style="text-decoration:none">性格診断へ</a></section>`;
}
// 職業は 派遣を はじめて 開いた ときに えらぶ（鹿さんの決め、2026-10-23）。合う 2 つを 大きく、ほかは 小さく（A 案）
const jobOf = (label) => Object.keys(TYPES).find((k) => TYPES[k].label === label);
let JOB = null;
function renderJob() {
  const fit = (INFO.jobs || []).map(jobOf).filter(Boolean), rest = Object.keys(TYPES).filter((k) => !fit.includes(k));
  JOB ||= fit[0] || rest[0];
  const T = TYPES[JOB];
  return `<div class="job">
    <section class="panel" aria-label="職業">
      <h2 class="jt">${esc(MP.name)}の 職業を えらぶ</h2>
      <h3 class="sub">${esc(INFO.label)}に 合う</h3>
      <div class="jbig" role="group" aria-label="合う 職業">${fit.map((k) => `<button data-job="${k}" aria-pressed="${k === JOB}" style="--c:${TYPES[k].color}"><em>合う</em><b>${TYPES[k].label}</b><span>${esc(TYPES[k].role)}</span></button>`).join("")}</div>
      <h3 class="sub">ほかの 職業</h3>
      <div class="jsmall" role="group" aria-label="ほかの 職業">${rest.map((k) => `<button data-job="${k}" aria-pressed="${k === JOB}" style="--c:${TYPES[k].color}">${TYPES[k].label}</button>`).join("")}</div>
    </section>
    <aside class="panel jdet" id="jdet" style="--c:${T.color}" aria-label="えらんだ 職業">
      <h2>${T.label}</h2><p class="role">${esc(T.role)}</p>
      <h3 class="sub">よく 伸びる</h3><ul class="jgrow">${T.grow.map((k) => `<li>${k.toUpperCase()}</li>`).join("")}</ul>
      <button class="jelly sky go" id="jobGo">この 職業に する</button><p class="why" id="jobWhy"></p><p class="later">あとで かえられる</p>
    </aside></div>`;
}

// ---------- 上の ペットの 札 ----------
function fillHead() {
  document.querySelector(".pet").hidden = document.querySelector(".tabs").hidden = !MP;
  if (!MP) return;
  fillPet(ME);
}
let toastT = 0;
function toast(html) { const el = document.getElementById("toast"); el.innerHTML = html; el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 4200); }

// ---------- どの 画面を 出すか：門番の 記録で 決める ----------
const route = () => (!MP ? renderGate() : !MP.type ? renderJob() : TRIP ? (TRIP.got ? renderDone() : renderPlay()) : renderPick());
function paint() { document.getElementById("app").innerHTML = (MP && MP.type ? loopSumHtml() : "") + route(); bind(); }
const reopen = (k, v) => { q.set(k, v); location.search = q.toString(); };   // 行き先・目的・時間は アドレスに のこす（開きなおしても 同じ）
function bind() {
  const on = (sel, f) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => f(b)));
  on("[data-d]", (b) => reopen("d", b.dataset.d));
  on("[data-run]", (b) => reopen("run", b.dataset.run));
  on("[data-pu]", (b) => reopen("pu", b.dataset.pu));
  on("[data-fl]", (b) => reopen("fl", b.dataset.fl));
  on("[data-tg]", (b) => reopen("tg", b.dataset.tg));
  on("[data-tool]", (b) => { if (b.dataset.tool) q.set("tool", b.dataset.tool); else q.delete("tool"); location.search = q.toString(); });
  on("[data-step]", (b) => { if (b.dataset.step) q.set("step", b.dataset.step); else q.delete("step"); location.search = q.toString(); });
  // 職業：えらぶと 右（スマホは 下）の くわしい所が かわる
  on("[data-job]", (b) => { JOB = b.dataset.job; paint(); if (innerWidth <= 820) document.getElementById("jdet").scrollIntoView({ behavior: "smooth", block: "start" }); });
  on("#jobGo", async (b) => {
    const r = await busy(b, () => act("pet.job", { type: JOB }));
    if (r.ok) location.reload(); else document.getElementById("jobWhy").textContent = r.why || "決められませんでした";
  });
  // 出発：門番が 行き先・時間・目的・道具を たしかめて、道のりを 1 回 計算する
  on("[data-go]", async (b) => {
    const { did, rk, pu, tg, tool, fl } = opts(), html = b.innerHTML;
    const r = await busy(b, () => act("trip.start", { did, run: rk, purpose: pu, target: tg, tool, floor: fl || undefined, loop: prepLoop() ?? undefined }), "出発して います…");
    if (r.ok) { if (r.enc) try { sessionStorage.setItem("ml-enc", JSON.stringify({ name: r.enc.foe.name, pet: r.enc.foe.pet, win: r.enc.win, credits: r.enc.credits, res: r.enc.res })); } catch (e) {} location.href = location.pathname; return; }   // 派遣先で ばったり（⑤）：読みなおした あとで 知らせる
    b.innerHTML = html; document.getElementById("goWhy").textContent = r.why || "出発できませんでした";
  });
  // うけとる：経験値・クレジット・素材・装備・捕まえた 子が 入る（リソースは 帳簿へ）
  on("#collect", async (b) => {
    const r = await busy(b, () => act("trip.collect", { uid: TRIP.uid }));
    if (!r.ok) { document.getElementById("cWhy").textContent = r.why || "うけとれませんでした"; return; }
    if (r.next) { location.reload(); return; }   // 周回中：つぎの 派遣が もう 出発した（まとめに 入る）
    GOT = r; MP.lv = r.lv || MP.lv; fillHead(); paint();
    toast(`経験値 <b>+${r.exp}</b>${r.up ? `・Lv <b>${r.lv}</b> に 上がった` : ""}${r.boxed ? `・${r.boxed} こ あずかり箱へ` : ""}`);
  });
  // 周回：じゅんびでは アドレスに のこす（ほかの えらびと 同じ）。出かけて いる あいだは 門番に 頼む
  on("[data-loop-sw]", async (b) => {
    if (b.dataset.loopSw === "prep") { if (prepLoop() !== null) q.delete("loop"); else q.set("loop", "3"); location.search = q.toString(); return; }
    const on = !(LOOP && LOOP.on), r = await busy(b, () => act("loop.set", on ? { on: true, count: LOOP && LOOP.max != null ? LOOP.max : 3 } : { on: false }));
    if (r.ok) location.reload(); else toast(esc(r.why || "できませんでした"));
  });
  on("[data-loop-n]", async (b) => {
    if (b.dataset.where === "prep") { q.set("loop", b.dataset.loopN); location.search = q.toString(); return; }
    const r = await busy(b, () => act("loop.set", { on: true, count: +b.dataset.loopN })); if (r.ok) location.reload(); else toast(esc(r.why || "できませんでした"));
  });
  on("#loopSeen", async (b) => { const r = await busy(b, () => act("loop.seen", {})); if (r.ok) location.reload(); });
  on("#again", () => { const t = TRIP, p = new URLSearchParams({ step: "prep", d: t.did, run: t.run, pu: t.purpose }); if (t.target) p.set("tg", t.target); if (t.tool) p.set("tool", t.tool); if (t.floor) p.set("fl", t.floor); location.search = p.toString(); });
  // スマホ：地図は えらんだ 行き先の まわりから 見せる
  const ws = document.querySelector(".wscroll"), pin = document.querySelector('.wpin[aria-pressed="true"]');
  if (ws && pin) { ws.scrollLeft = pin.offsetLeft - ws.clientWidth / 2; ws.scrollTop = pin.offsetTop - ws.clientHeight / 2; }
}

fillHead();
linkTabs();
paint(); watchIcons();
document.querySelector(".tabs").scrollLeft = 9999;   // スマホ：えらんでいるタブ（冒険）を見えるところに
// 出かけて いる あいだは 2 秒ごとに ようすを 進める。帰る 時間を すぎたら 門番に 聞きなおす（ごほうびは 帰って から 見える）
// 早めに 帰る ときは「帰って くる」を 少し 見せてから（6 秒）
// 周回中は 門番が うけとって つぎを 出すのを 待つ（6 秒）
if (MP && MP.type && TRIP && !TRIP.got) setInterval(() => { const early = TRIP.end < TRIP.start + RUNS[TRIP.run].sec * 1000; if (Date.now() >= TRIP.end + (early || (LOOP && LOOP.on) ? 6000 : TRIP.calc ? 4000 : 1500)) location.reload(); else paint(); }, 2000);
// 派遣先で ばったり（⑤。出発の あとに 1 回だけ）：同じ 行き先の ほかの 人の ペットと 戦った。探索は そのまま
try { const en = JSON.parse(sessionStorage.getItem("ml-enc") || "null"); sessionStorage.removeItem("ml-enc");
  if (en) toast(`派遣先で ばったり！ ${esc(en.name)} の ${esc(en.pet)}に ${en.win ? "勝った" : "負けた"}（${en.credits ? `クレジット <b>+${Number(en.credits)}</b>・` : ""}リソース <b>+${Number(en.res)}</b>）　<a href="arena.html?t=log" style="color:inherit">見る ›</a>`); } catch (e) {}
window.ready = true;
</script>
</body>
</html>
