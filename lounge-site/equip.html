<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Equipment</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：ペットの装備の画面の見本。?view=gousei で合成（OP うつし）。部品と色はガンビット・スキルツリーの画面と同じ
     持っている装備は 倉庫と 同じ マス目（stash-grid.js）。ならべる：部位別（あたま → … → アクセサリー、その中は ★の多い順）・★の多い順・新しい順（鹿さんの決め、2026-10-25） */
  :root {
    --space:#F6F8FC; --ink:#1B2340; --soft:#6A7394; --line:#DCE3F0;
    --sky:#2EA8FF; --coral:#FF5A64; --sun:#FFC21A; --leaf:#22CC88; --violet:#8E6CFF;
    --r1:#9AA0B8; --r2:#2F7BFF; --r3:#9B4DFF; --r4:#FFB300; --r5:#FF2E4D;
    --jp:"Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif; --num:"Fredoka", "Zen Maru Gothic", sans-serif;
    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:3px solid var(--sky); outline-offset:3px; border-radius:12px; }
  .top { display:flex; align-items:center; gap:10px; padding:12px clamp(16px, 4vw, 40px); }
  .top b { font:700 22px/1 var(--num); letter-spacing:.06em; } .top b i { font-style:normal; color:var(--sky); }
  .top small { font:700 13px/1 var(--jp); color:var(--soft); margin-left:6px; }
  main { max-width:1100px; margin:0 auto; padding:0 clamp(16px, 4vw, 40px) 40px; }
  .panel { background:rgba(255,255,255,.9); border-radius:26px; box-shadow:var(--lift); padding:clamp(14px, 2.4vw, 18px); }
  .pet { display:grid; grid-template-columns:60px auto 1fr; gap:14px; align-items:center; padding:8px 20px 8px 8px; border-radius:22px; }
  .pet .pic { width:60px; height:60px; border-radius:16px; background:radial-gradient(circle at 50% 38%, #fff 0, #E4F7EE 80%); display:flex; justify-content:center; overflow:hidden; }
  .pet .pic img { height:150%; margin-top:-4%; }
  .pet h1 { margin:0; font:900 24px/1.1 var(--jp); display:flex; align-items:baseline; gap:10px; white-space:nowrap; }
  .pet h1 small { font:700 13px/1 var(--jp); color:var(--soft); }
  .pet .meta { margin-top:6px; display:flex; gap:8px; align-items:center; }
  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; padding:4px 10px 4px 5px; font:700 12px/1 var(--jp); color:#fff; background:var(--c); }
  .badge::before { content:""; width:11px; height:11px; border-radius:50%; background:#fff; opacity:.85; }
  .lv { font:600 16px/1 var(--num); } .lv small { font:700 12px/1 var(--jp); color:var(--soft); margin-right:3px; }
  .res { justify-self:end; text-align:right; font:700 12px/1.2 var(--jp); color:var(--soft); }
  .res b { display:block; font:600 24px/1 var(--num); color:var(--ink); }
  .tabs { display:flex; gap:8px; margin:12px 0 10px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { flex:none; border:1.5px solid var(--line); background:rgba(255,255,255,.9); border-radius:999px; padding:8px 16px; font:700 14px/1 var(--jp); }
  .tabs button[aria-selected="true"] { background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 0 rgba(27,35,64,.22); }
  .seg { display:inline-grid; grid-auto-flow:column; gap:3px; padding:3px; border-radius:13px; background:#fff; border:1.5px solid var(--line); }
  .seg button { border:0; background:none; border-radius:10px; padding:6px 14px; font:700 13px/1.2 var(--jp); color:var(--soft); white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--sky); color:#fff; box-shadow:0 4px 0 rgba(46,168,255,.28); }
  .head { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .head h2 { margin:0; font:900 20px/1.3 var(--jp); }
  .head .cnt { margin-left:auto; font:700 12px/1 var(--jp); color:var(--soft); } .head .cnt b { font:600 14px/1 var(--num); color:var(--ink); }
  .stars { display:inline-flex; gap:1px; font-size:13px; line-height:1; color:var(--rc); letter-spacing:-1px; }
  .r1 { --rc:var(--r1); } .r2 { --rc:var(--r2); } .r3 { --rc:var(--r3); } .r4 { --rc:var(--r4); } .r5 { --rc:var(--r5); }
  .ico { display:grid; place-items:center; border-radius:14px; background:radial-gradient(circle at 50% 40%, #fff 0, color-mix(in srgb, var(--rc) 16%, #fff) 85%); }
  .ico img { width:86%; height:86%; object-fit:contain; }
  .r5 .ico { background:radial-gradient(circle at 50% 40%, #fff 0, #FFE9EC 60%, #FFF5D6 100%); box-shadow:inset 0 0 0 2px #FFD0D8; }

  .cols { display:grid; grid-template-columns:250px minmax(0, 1fr) 290px; gap:16px; align-items:start; }
  /* 左：着せかえ（ペットの まわりに 9 つの 枠。アクセサリーは 下に 3 つ） */
  .doll { --t:52px; display:grid; grid-template-columns:var(--t) minmax(0, 1fr) var(--t); grid-template-rows:repeat(4, var(--t)); gap:6px; padding:8px; border-radius:20px; background:radial-gradient(circle at 50% 44%, #fff 0, #E4F7EE 80%);
    grid-template-areas:". head ." "weapon pet off" "arm pet neck" ". leg ."; }
  .doll .me { grid-area:pet; display:flex; justify-content:center; align-items:center; overflow:hidden; min-width:0; }
  .doll .me img { height:128%; } .doll .me img.px { height:auto; width:min(96px, 90%); image-rendering:pixelated; }
  /* だれの 装備（ペット ＋ パーティの なかま） */
  .whos { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .whos button { display:inline-flex; align-items:center; gap:7px; border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:4px 14px 4px 4px; font:700 13px/1 var(--jp); }
  .whos img { width:30px; height:30px; border-radius:50%; object-fit:cover; object-position:50% 20%; background:#EAF6EF; }
  .whos img.px { object-fit:contain; image-rendering:pixelated; background:#F1F3F9; }
  .whos small { font:700 10px/1 var(--jp); color:var(--soft); }
  .whos button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; } .whos button[aria-pressed="true"] small { color:rgba(255,255,255,.7); }
  .sl { position:relative; width:var(--t); height:var(--t); padding:0; display:grid; place-items:center; border:1.5px solid color-mix(in srgb, var(--rc, var(--line)) 55%, #fff); border-radius:14px;
    background:radial-gradient(circle at 50% 40%, #fff 0, color-mix(in srgb, var(--rc, #fff) 16%, #fff) 85%); }
  .sl img { width:86%; height:86%; object-fit:contain; }
  .sl.none { --rc:var(--line); border-style:dashed; background:rgba(255,255,255,.72); font:700 10px/1.15 var(--jp); color:var(--soft); white-space:pre-line; }
  .sl.on { border-color:var(--sky); box-shadow:0 0 0 3px rgba(46,168,255,.3); }
  .doll .sl { justify-self:center; }
  .accs { --t:52px; margin-top:8px; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; }
  .accs small { flex-basis:100%; font:700 12px/1.2 var(--jp); color:var(--soft); }   /* PC の 細い 列では 名前を 上の 行に */
  .sum { margin-top:10px; padding:8px 10px; border-radius:14px; background:var(--space); font:700 12px/1.6 var(--jp); color:var(--soft); }
  .sum b { font:600 13px/1 var(--num); color:var(--ink); }
  /* まん中：持っている装備 */
  .filters { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .filters button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:5px 12px; font:700 12px/1 var(--jp); color:var(--soft); }
  .filters button[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .ptabs { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:5px; margin-bottom:10px; }
  .ptabs button { display:flex; align-items:center; justify-content:center; gap:5px; min-width:0; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:7px 4px; font:700 13px/1 var(--jp); color:var(--ink); white-space:nowrap; }
  .ptabs small { font:600 11px/1 var(--num); color:var(--soft); }
  .ptabs button[aria-selected="true"] { background:var(--ink); border-color:var(--ink); color:#fff; box-shadow:0 4px 0 rgba(27,35,64,.2); } .ptabs button[aria-selected="true"] small { color:rgba(255,255,255,.7); }
  .ptabs button.zero { color:#A9B0C6; border-style:dashed; }   /* 0 こ の 部位も 押せる（着せかえの 枠と 同じ。「まだ ない」と 手に 入れる 場所を 出す） */
  .sorts { display:flex; align-items:center; gap:6px; margin:-2px 0 10px; } .sorts span { font:900 11px/1 var(--jp); color:var(--soft); margin-right:2px; }   /* ならべる */
  .list-tk { --tk-c:76px; }
  /* 右：えらんだ装備 */
  .detail .top2 { display:grid; grid-template-columns:76px 1fr; gap:10px; align-items:center; }
  .detail .ico { width:76px; height:76px; }
  .detail h2 { margin:0; font:900 18px/1.25 var(--jp); }
  .detail .stars { font-size:16px; margin-top:4px; }
  .detail .slotname { display:inline-block; margin-left:6px; font:700 11px/1 var(--jp); color:var(--soft); border:1.5px solid var(--line); border-radius:99px; padding:3px 7px; vertical-align:2px; }
  .main { margin-top:10px; padding:7px 10px; border-radius:12px; background:var(--space); font:700 13px/1.4 var(--jp); display:flex; justify-content:space-between; }
  .main b { font:600 15px/1 var(--num); }
  .ops { list-style:none; margin:8px 0 0; padding:0; display:grid; gap:4px; }
  .ops li { display:flex; align-items:center; gap:7px; font:700 13px/1.35 var(--jp); padding:4px 8px; border-radius:10px; border:1.5px solid var(--line); background:#fff; }
  .ops li::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--rc, var(--soft)); flex:none; }
  .ops li.sp { border-color:#FFD98A; background:#FFF8E6; }
  .ops li.sp::after { content:"★3〜"; margin-left:auto; font:600 10px/1 var(--num); color:#C98A00; }
  .cmp { margin-top:10px; padding:8px 10px; border-radius:14px; border:1.5px dashed var(--line); }
  .cmp h3 { margin:0 0 4px; font:900 12px/1.3 var(--jp); color:var(--soft); }
  .cmp div { display:flex; justify-content:space-between; font:700 13px/1.6 var(--jp); }
  .cmp .up { color:#13A36A; } .cmp .dn { color:var(--coral); } .cmp .eq0 { color:var(--soft); }
  .cmp b { font:600 13px/1 var(--num); }
  .btns { margin-top:12px; display:grid; gap:8px; }
  .jelly { border:0; border-radius:999px; padding:11px 16px; font:900 14px/1 var(--jp); background:var(--ink); color:#fff; box-shadow:0 5px 0 rgba(27,35,64,.25); }
  .jelly.light { background:#fff; color:var(--ink); box-shadow:0 5px 0 var(--line); border:1.5px solid var(--line); }
  .jelly.sky { background:var(--sky); box-shadow:0 5px 0 rgba(46,168,255,.3); }
  .linkish { border:0; background:none; font:700 12px/1.2 var(--jp); color:var(--soft); text-decoration:underline; text-underline-offset:3px; }
  .linkish b { font:600 13px/1 var(--num); color:var(--ink); }

  /* 合成（OP うつし） */
  .dim { position:fixed; inset:0; background:rgba(27,35,64,.38); display:none; z-index:10; }
  .mix { display:grid; grid-template-columns:minmax(0, 1fr) 40px minmax(0, 1fr); gap:10px; align-items:start; }
  .pick { border:1.5px solid var(--line); border-radius:18px; padding:10px; background:#fff; }
  .pick h3 { margin:0 0 6px; font:900 13px/1.2 var(--jp); color:var(--soft); }
  .pick .row { display:grid; grid-template-columns:56px 1fr; gap:8px; align-items:center; }
  .pick .ico { width:56px; height:56px; }
  .pick b { font:700 14px/1.3 var(--jp); }
  .pick .ops li { cursor:pointer; }
  .pick .ops li.out { border-color:var(--coral); background:#FFF0F1; text-decoration:line-through; text-decoration-color:var(--coral); }
  .pick .ops li.take { border-color:var(--sky); background:#E8F5FF; box-shadow:inset 0 0 0 1.5px var(--sky); }
  .pick .ops li em { margin-left:auto; font:700 10px/1 var(--jp); font-style:normal; color:#fff; background:var(--coral); border-radius:6px; padding:3px 5px; }
  .pick .ops li.take em { background:var(--sky); }
  .arrow { align-self:center; height:40px; display:grid; place-items:center; font:900 22px/1 var(--jp); color:var(--sky); }
  .result { margin-top:12px; padding:10px 12px; border-radius:18px; background:linear-gradient(135deg, #EEF6FF, #F6F2FF); border:1.5px solid #D7E4FA; }
  .result h3 { margin:0 0 6px; font:900 13px/1.2 var(--jp); }
  .result .ops li.newop { border-color:var(--sky); background:#fff; }
  .result .note { margin:6px 0 0; font:700 11px/1.5 var(--jp); color:var(--soft); }
  .cost { margin-top:12px; display:flex; align-items:center; gap:10px; }
  .cost span { font:700 13px/1.3 var(--jp); color:var(--soft); } .cost b { font:600 16px/1 var(--num); color:var(--ink); }
  .cost .jelly { margin-left:auto; }

  .note { margin:6px 0; font:700 12px/1.5 var(--jp); color:var(--soft); } .note a { color:var(--ink); font-weight:900; }
  .list-tk + .note, .list .note { margin-top:8px; }
  a.linkish { align-self:center; }
  /* 配信ページの ラウンジの 枠（820〜1100px）：着せかえを 上の 1 行に（右に アクセサリーと ふえる分）、下に 持っている装備と えらんだ装備（3 列だと まん中が つぶれる） */
  @media (min-width:821px) and (max-width:1100px) {
    .cols { grid-template-columns:minmax(0, 1fr) 270px; }
    .cols > .wear { grid-column:1 / -1; display:grid; grid-template-columns:250px minmax(0, 1fr); gap:16px; align-items:center; }
    .doll { --t:46px; } .accs { --t:46px; margin-top:0; justify-content:flex-start; } .accs small { flex-basis:auto; margin-right:4px; } .side { align-self:stretch; display:flex; flex-direction:column; justify-content:center; gap:10px; } .sum { margin-top:0; }
  }
  @media (max-width:820px) {
    .pet { grid-template-columns:48px 1fr auto; padding:6px 12px 6px 6px; gap:10px; border-radius:18px; }
    .pet .pic { width:48px; height:48px; border-radius:12px; } .pet h1 { font-size:20px; } .pet h1 small { font-size:12px; }
    .cols { grid-template-columns:minmax(0, 1fr); } .cols > * { min-width:0; }
    .doll { --t:50px; max-width:340px; margin:0 auto; } .accs { --t:50px; max-width:340px; margin:8px auto 0; } .accs small { flex-basis:auto; margin-right:auto; } .sum { display:none; }
    .list-tk { --tk-c:60px; }
    .detail .btns { grid-template-columns:1fr 1fr; } .detail .btns .linkish { grid-column:1 / -1; }
    /* スマホ：えらんだ装備は、カードを押すと下から出るシート */
    .detail { display:none; }
    body.sheet-on .detail { display:block; background:#fff; position:fixed; left:0; right:0; bottom:0; z-index:11; border-radius:26px 26px 0 0; max-height:82vh; overflow:auto; box-shadow:0 -18px 40px -18px rgba(27,35,64,.4); }
    body.sheet-on .detail::before { content:""; display:block; width:44px; height:5px; border-radius:9px; background:var(--line); margin:0 auto 10px; }
    body.sheet-on .dim { display:block; }
    .mix { grid-template-columns:minmax(0, 1fr); } .arrow { transform:rotate(90deg); height:24px; }
    .cost { flex-direction:column; align-items:stretch; } .cost .jelly { margin-left:0; }
  }
</style>
</head>
<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ ペット</small></header>
<main id="app"></main>
<div class="dim" id="dim"></div>
<script type="module">
import { me, act, busy, waitText } from "./lounge-client.js";   // 持って いる 装備・付ける／はずすは 門番の 記録（見本では ブラウザの 中の ためしの 門番）
import { petInfo, linkTabs, gateHtml, addGateCss, toast } from "./pet-head.js";
import { TYPES } from "./skills.js";
import { SLOTS, KINDS, OPS, baseOf, itemStats, mainStats, hasFx } from "./equip.js";
import { SYNTH } from "./recipes.js";
import { gearImg, watchIcons } from "./gear-icon.js";
import { addTkCss, padGrids, watchPad } from "./stash-grid.js";
import { spriteURL } from "./sprites.js";

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SL = { hp: "HP", mp: "MP", atk: "ATK", def: "DEF", int: "INT", res: "RES", agi: "AGI", dex: "DEX", luk: "LUK" };
const EQUIP_MAX = 200;
const stars = (n) => `<span class="stars">${"★".repeat(n)}</span>`;
const sign = (v) => (v < 0 ? `−${Math.abs(v)}` : `+${v}`);
const SPECIAL = new Set(["mpRegen", "firstStrike", "endure", "focusStart"]);
const opLine = (it, o) => esc(OPS[o].fmt(OPS[o].v[it.star - 1]));
const mainLine = (it) => Object.entries(mainStats(it)).map(([k, v]) => `${SL[k]} ${sign(v)}`).join("・");
// 数の ちがい（ステータスと % の OP。とくべつな OP は 一覧で 見る）
const diffOf = (a, b) => { const x = a ? itemStats(a) : {}, y = b ? itemStats(b) : {}, out = [];
  for (const k of new Set([...Object.keys(x), ...Object.keys(y)])) { if (SPECIAL.has(k)) continue; const d = (x[k] || 0) - (y[k] || 0); if (d) out.push([k, d]); }
  return out; };
const nameOf = (k) => SL[k] || OPS[k].label, unit = (k) => (SL[k] ? "" : "%");
const val = (k, v) => `${sign(k === "dmgCut" ? -v : v)}${unit(k)}`;   // 受けるダメージは へる ほど いい（−で 出す）
// 部位の タブ：えらんだ 部位 だけを 出す（縦に ぜんぶ 並べると 分けた 意味が ない。鹿さんの声、2026-10-25）
// 1 行め あたま・くび・うで・あし、2 行め 武器・オフハンド・アクセ。着せかえの 枠を 押しても 同じ 部位に なる
const PARTS = Object.keys(KINDS), PART_LABEL = { acc: "アクセ" };
const kindOf = (e) => baseOf(e.base).slot;
const inF = (e, f) => kindOf(e) === f;
const DOLL = ["head", "weapon", "off", "arm", "neck", "leg"], ACCS = ["acc1", "acc2", "acc3"];
const EMPTY = { off: "オフ\nハンド" };

let ME = await me(), MP = ME.pets && ME.pets[0];
const V = { f: null, sort: "star", sel: null, slot: null, who: new URLSearchParams(location.search).get("who") || "pet" };
// だれの 装備（鹿さんの決め、2026-10-25）：ペットと パーティの 2 体。部屋に いる 子でも 何か 付けて いれば 出す（はずせる ように）
const mates = () => (ME.tamed || []).filter((c) => (ME.party || []).includes(c.uid) || Object.values(c.equip || {}).some(Boolean));
const holder = () => (V.who !== "pet" && mates().find((c) => c.uid === V.who)) || MP;
const isPet = () => holder() === MP;
const nameOfWho = (w) => (w === "pet" ? MP.name : ((ME.tamed || []).find((c) => c.uid === w) || { name: "なかま" }).name);
const away = (uid) => (ME.trips || []).some((t) => !t.done && t.party.includes(uid));
const SORTS = [["star", "★の多い順"], ["new", "新しい順"]];
// 付けて いる 子：who は "pet" か なかまの uid。me は いま 見て いる 子が 付けて いる
const wornBy = () => { const m = {}, here = isPet() ? "pet" : holder().uid;
  for (const [s, u] of Object.entries((MP && MP.equip) || {})) if (u) m[u] = { who: "pet", slot: s, me: here === "pet" };
  for (const c of ME.tamed || []) for (const [s, u] of Object.entries(c.equip || {})) if (u) m[u] = { who: c.uid, slot: s, me: here === c.uid };
  return m; };
const cur = (s) => (ME.own.equip || []).find((e) => e.uid === (holder().equip || {})[s]);
const equipAct = (who, slot, uid) => (who === "pet" ? act("pet.equip", { slot, uid }) : act("tame.equip", { who, slot, uid }));
// 付ける 枠：アクセサリーは えらんだ 枠 → あいて いる 枠 → 1 つめ（入れかえ）
const slotFor = (kind) => (kind !== "acc" ? kind : V.slot && SLOTS[V.slot].kind === "acc" ? V.slot : ACCS.find((s) => !cur(s)) || "acc1");

function render() {
  const gate = gateHtml(ME, esc); if (gate) return gate;
  const info = petInfo(MP), ty = TYPES[MP.type], own = ME.own.equip || [], W = wornBy();
  const total = {}; for (const s of Object.keys(SLOTS)) { const it = cur(s); if (it) for (const [k, v] of Object.entries(itemStats(it))) total[k] = (total[k] || 0) + v; }
  const sum = Object.entries(total).filter(([k]) => !SPECIAL.has(k)).map(([k, v]) => `${nameOf(k)} <b>${val(k, v)}</b>`).join("・");
  if (!PARTS.includes(V.f)) V.f = PARTS.find((k) => own.some((e) => kindOf(e) === k)) || "head";   // はじめは 持って いる 物が ある 部位
  const vis = own.map((e, i) => ({ e, i })).filter(({ e }) => inF(e, V.f)).sort((a, b) => (V.sort === "new" ? b.i - a.i : b.e.star - a.e.star || b.i - a.i));
  if (!vis.some(({ e }) => e.uid === V.sel)) V.sel = (Object.keys(SLOTS).filter((s) => SLOTS[s].kind === V.f).map(cur).find(Boolean) || (vis[0] || {}).e || {}).uid || null;   // えらぶのは いま 見て いる 部位の 物
  const n = (f) => own.filter((e) => inF(e, f)).length;
  const tile = (s) => { const e = cur(s), lab = SLOTS[s].label, on = V.slot === s ? " on" : "", pos = DOLL.includes(s) ? ` style="grid-area:${s}"` : "";
    return e ? `<button class="sl r${e.star}${on}" data-slot="${s}"${pos} title="${lab}：${esc(baseOf(e.base).name)} ★${e.star}" aria-label="${lab}：${esc(baseOf(e.base).name)}">${gearImg(e.base)}</button>`
      : `<button class="sl none${on}" data-slot="${s}"${pos} aria-label="${lab}：なし">${s.startsWith("acc") ? "" : EMPTY[s] || lab}</button>`; };
  // マス：色は ★、左下に ★、右上に 付けて いる 印（装＝この 子・仲＝なかま）
  const card = ({ e }) => { const w = W[e.uid], nm = esc(baseOf(e.base).name);
    return `<li><button class="tc t${e.star}${w ? " tw-on" : ""}" data-u="${e.uid}" aria-pressed="${e.uid === V.sel}" aria-label="${nm} ★${e.star}${w ? (w.me ? "（そうび中）" : `（${esc(nameOfWho(w.who))}）`) : ""}" title="${nm}"><span class="tn">${nm}</span>${gearImg(e.base, { cls: "hd" })}<span class="ts">${"★".repeat(e.star)}</span>${w ? `<span class="tw${w.me ? "" : " mate"}">${w.me ? "装" : w.who === "pet" ? "ペ" : "仲"}</span>` : ""}</button></li>`; };
  // 部位別：あたま・くび・うで・あし・武器・オフハンド・アクセサリーの 見出し（ない 部位は 出さない）
  const listHtml = !vis.length ? `<p class="note">${KINDS[V.f].label}の 装備は まだ ない。<a href="dungeon.html">冒険</a>の 宝箱か <a href="bench.html">作業台</a>で 手に 入る</p>` : `<div class="tk list-tk"><ul class="tk-g">${vis.map(card).join("")}</ul></div>`;
  const it = own.find((e) => e.uid === V.sel);
  let det = `<p class="note">まだ 装備が ない。<a href="dungeon.html">冒険</a>の 宝箱か <a href="bench.html">作業台</a>で 手に 入る</p>`;
  if (it) {
    const b = baseOf(it.base), w = W[it.uid], to = slotFor(b.slot), now = cur(to), cmp = now && now.uid !== it.uid ? diffOf(it, now) : null, sy = SYNTH.find((r) => r.main === it.base);
    const here = isPet() ? "pet" : holder().uid, busyAway = away(isPet() ? MP.uid : here) || (w && !w.me && away(w.who === "pet" ? MP.uid : w.who));
    const btn = busyAway ? `<p class="note">出かけて いる あいだは かえられない</p>`
      : w && w.me ? `<button class="jelly light" data-off="${w.slot}">はずす</button>`
      : w ? `<button class="jelly" data-move="${it.uid}">${esc(nameOfWho(w.who))}から はずして つける</button>`   // ほかの 子の 物は、はずして から この 子に
      : `<button class="jelly" data-on="${it.uid}">${b.slot === "acc" ? `${SLOTS[to].label}に つける` : "つける"}</button>`;
    det = `<div class="top2"><span class="ico">${gearImg(it.base)}</span>
        <div><h2>${esc(b.name)}<span class="slotname">${KINDS[b.slot].label}</span></h2>${stars(it.star)}</div></div>
      <div class="main"><span>もとの強さ</span><b>${esc(mainLine(it))}</b></div>
      ${it.ops.length ? `<ul class="ops">${it.ops.map((o) => `<li class="${SPECIAL.has(o) ? "sp" : ""}">${opLine(it, o)}</li>`).join("")}</ul>` : ""}
      ${hasFx(it) ? `<p class="note">とくべつな効果：${esc(b.fx || b.text || "")}</p>` : ""}
      ${cmp ? `<div class="cmp"><h3>いまの ${esc(baseOf(now.base).name)} ★${now.star} とくらべると</h3>${cmp.length ? cmp.map(([k, d]) => `<div class="${d > 0 ? "up" : "dn"}"><span>${nameOf(k)}</span><b>${val(k, d)}</b></div>`).join("") : `<p class="note">数は おなじ</p>`}</div>` : ""}
      <div class="btns">${btn}${sy ? `<a class="linkish" href="bench.html?k=s:${sy.out}">作業台で 合成する</a>` : ""}</div>`;
  }
  return `
  <section class="panel pet" aria-label="ペット">
    <div class="pic"><img src="${info.img}" alt="${esc(info.label)}の${esc(MP.name)}"></div>
    <div><h1>${esc(MP.name)}<small>${esc(info.label)} ／ ${esc(ME.name)} の相棒</small></h1><div class="meta"><span class="badge" style="--c:${ty.color}">${ty.label}</span><span class="lv"><small>Lv</small>${MP.lv}</span></div></div>
    <div class="res">リソース<b>${ME.wallet && ME.wallet.known ? ME.wallet.res : "？"}</b></div>
  </section>
  <nav class="tabs" role="tablist"><button role="tab" aria-selected="false">ステータス</button><button role="tab" aria-selected="false">スキルツリー</button><button role="tab" aria-selected="false">ガンビット</button><button role="tab" aria-selected="true">装備</button><button role="tab" aria-selected="false">冒険</button><button role="tab" aria-selected="false">なかま</button></nav>
  ${whoHtml()}
  <div class="cols equip-view">
    <section class="panel wear" aria-label="着ているもの">
      <div class="doll"><div class="me">${isPet() ? `<img src="${info.img}" alt="${esc(MP.name)}">` : `<img class="px" src="${spriteURL(holder().tree)}" alt="${esc(holder().name)}">`}</div>${DOLL.map(tile).join("")}</div>
      <div class="side">
        <div class="accs"><small>アクセサリー</small>${ACCS.map(tile).join("")}</div>
        ${sum ? `<div class="sum">装備でふえる分　${sum}</div>` : ""}
      </div>
    </section>
    <section class="panel" aria-label="持っている装備" id="list">
      <div class="head"><h2>持っている装備</h2><span class="cnt"><b>${own.length}</b> / ${EQUIP_MAX}</span></div>
      <div class="ptabs" role="tablist" aria-label="部位">${PARTS.map((k) => `<button role="tab" data-f="${k}" aria-selected="${V.f === k}" class="${n(k) ? "" : "zero"}">${PART_LABEL[k] || KINDS[k].label}<small>${n(k)}</small></button>`).join("")}</div>
      <div class="filters sorts" role="group" aria-label="ならべる"><span>ならべる</span>${SORTS.map(([k, l]) => `<button data-sort="${k}" aria-pressed="${V.sort === k}">${l}</button>`).join("")}</div>
      ${listHtml}
    </section>
    <aside class="panel detail ${it ? `r${it.star}` : ""}" aria-label="えらんだ装備" id="det">${det}</aside>
  </div>`;
}
// だれの 装備：ペット ＋ なかま（いなければ 出さない）
function whoHtml() {
  const ms = mates(); if (!ms.length) return "";
  const b = (w, img, name, px, note) => `<button data-who="${w}" aria-pressed="${(isPet() ? "pet" : holder().uid) === w}"><img class="${px ? "px" : ""}" src="${img}" alt="">${esc(name)}${note ? `<small>${note}</small>` : ""}</button>`;
  return `<div class="whos" role="group" aria-label="だれの 装備">${b("pet", petInfo(MP).img, MP.name, false, "")}${ms.map((c) => b(c.uid, spriteURL(c.tree), c.name, true, (ME.party || []).includes(c.uid) ? "" : "部屋")).join("")}</div>`;
}
function paint() { document.getElementById("app").innerHTML = render(); linkTabs(); const tk = document.querySelector("#list .tk"); if (tk) padGrids(tk); }
addGateCss(); addTkCss(); watchPad(() => document.querySelector("#list .tk"));
const small = () => matchMedia("(max-width:820px)").matches;
document.body.addEventListener("click", async (e) => {
  if (e.target.id === "dim") { document.body.classList.remove("sheet-on"); return; }
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.u) { V.sel = d.u; paint(); if (small()) document.body.classList.add("sheet-on"); return; }
  if (d.f) { V.f = d.f; V.slot = null; V.sel = null; return paint(); }
  if (d.slot) {   // 枠を 押す：一覧が その 部位 だけに（もう 一度 押すと もどる）
    if (V.slot === d.slot) { V.slot = null; return paint(); }
    V.slot = d.slot; V.f = SLOTS[d.slot].kind; const W = wornBy();   // 付けて いる 物、あいて いれば 付けられる いちばん ★の 多い 物を えらぶ
    const e2 = cur(d.slot) || (ME.own.equip || []).filter((x) => kindOf(x) === V.f && !W[x.uid]).sort((x, y) => y.star - x.star)[0]; if (e2) V.sel = e2.uid;
    paint(); if (small()) { if (cur(d.slot)) document.body.classList.add("sheet-on"); else document.getElementById("list").scrollIntoView({ behavior: "smooth", block: "start" }); } return;   // スマホ：付けて いれば シート、あきなら 一覧へ
  }
  if (d.sort) { V.sort = d.sort; return paint(); }
  if (d.who) { V.who = d.who; V.slot = null; V.sel = null; return paint(); }
  if (d.on || d.off || d.move) {
    const here = isPet() ? "pet" : holder().uid, it = (ME.own.equip || []).find((x) => x.uid === (d.on || d.move || V.sel)), slot = d.off || slotFor(kindOf(it));
    const r = await busy(b, async () => {
      if (d.move) { const w = wornBy()[it.uid]; const r0 = await equipAct(w.who, w.slot, null); if (!r0.ok) return r0; }   // ほかの 子から はずす
      return equipAct(here, slot, d.off ? null : it.uid);
    });
    if (!r.ok) return toast(r.wait ? waitText : r.why || "できませんでした");
    ME = await me(); MP = ME.pets[0]; document.body.classList.remove("sheet-on"); paint();
    toast(d.off ? `${SLOTS[slot].label}を はずした` : `${holder().name}に ${baseOf(it.base).name}を つけた`);
  }
});
paint(); watchIcons();
window.ready = true;
</script>
</body>
</html>
