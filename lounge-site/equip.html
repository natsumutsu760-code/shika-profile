<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
  /* MONO LINK のラウンジ：ペットの装備の画面の見本。?view=gousei で合成（OP うつし）。部品と色はガンビット・スキルツリーの画面と同じ

  :root {

    --lift:0 18px 40px -18px rgba(27,35,64,.35), 0 2px 0 rgba(27,35,64,.06);
  }

  body { margin:0; min-height:100vh; background:radial-gradient(120% 80% at 50% 0%, #FFFFFF 0%, var(--space) 55%, #EAF0FA 100%); color:var(--ink); font:500 16px/1.65 var(--jp); }

    background:radial-gradient(circle at 50% 40%, #fff 0, color-mix(in srgb, var(--rc, #fff) 16%, #fff) 85%); }

  .main { margin-top:10px; padding:7px 10px; border-radius:12px; background:var(--space); font:700 13px/1.4 var(--jp); display:flex; justify-content:space-between; }

  .core button:disabled { opacity:.45; } .core small { font:700 11px/1.4 var(--jp); color:var(--soft); }

  .scrap .sc { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:6px 10px; font:700 12px/1 var(--jp); color:var(--ink); }

  /* まとめて 手放す */

  .rec .brow { display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin-bottom:6px; } .rec .brow > span { width:56px; font:900 11px/1.2 var(--jp); color:var(--soft); }
  .rec .brow button { border:1.5px solid var(--line); background:#fff; border-radius:99px; padding:6px 10px; font:700 12px/1 var(--jp); color:var(--soft); }
  .rec .brow button[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .rwho { margin-top:10px; padding:10px 12px; border-radius:16px; border:1.5px solid var(--line); }
  .rh { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font:900 14px/1.3 var(--jp); } .rh span { font:700 12px/1.3 var(--jp); color:var(--soft); white-space:nowrap; } .rh span b { font:600 15px/1 var(--num); color:var(--ink); } .rh b.up { color:#13A36A; } .rh b.dn { color:var(--coral); }
  .rwhy { margin:2px 0 4px; font:700 11px/1.4 var(--jp); color:var(--soft); }

  .rrows li { display:grid; grid-template-columns:62px 30px 12px minmax(0, 1fr); gap:6px; align-items:center; padding:6px 0; border-top:1px dashed var(--line); }

  .rrows .gn { min-width:0; font:700 12px/1.25 var(--jp); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }   /* PC の せまい 列でも 名前が 読める ように 2 行まで */ .rrows .gn i { font-style:normal; margin-left:3px; color:#C98A00; font-size:11px; } .rrows .gn.none { color:var(--soft); }

  /* 配信ページの ラウンジの 枠（820〜1100px）：着せかえを 上の 1 行に（右に アクセサリーと ふえる分）、下に 持っている装備と えらんだ装備（3 列だと まん中が つぶれる） */

<body>
<header class="top"><a href="/" style="color:inherit;text-decoration:none" aria-label="MONO LINK の サイトへ"><b>MONO LINK<i>://</i></b></a><small><a href="lounge-room.html" style="color:inherit">ラウンジ</a> ／ ペット</small></header>
<main id="app"></main>
<div class="dim" id="dim"></div>
<script type="module">
import { me, act, busy, waitText } from "./lounge-client.js";   // 持って いる 装備・付ける／はずすは 門番の 記録（見本では ブラウザの 中の ためしの 門番）

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const SL = { hp: "HP", mp: "MP", atk: "ATK", def: "DEF", int: "INT", res: "RES", agi: "AGI", dex: "DEX", luk: "LUK" };
const EQUIP_MAX = 200;   // 武器庫 Lv0 の 数（門番の equipCap が 来なかった とき）
const stars = (n) => `<span class="stars">${"★".repeat(n)}</span>`;
const sign = (v) => (v < 0 ? `−${Math.abs(v)}` : `+${v}`);
const SPECIAL = new Set(["mpRegen", "firstStrike", "endure", "focusStart"]);
const opLine = (it, o, i) => { const st = opStarOf(it, i); return esc(OPS[o].fmt(OPS[o].v[st - 1])) + (st !== it.star ? `<small class="cst">コア ★${st}</small>` : ""); };
const mainLine = (it) => Object.entries(mainStats(it)).map(([k, v]) => `${SL[k]} ${sign(v)}`).join("・");
// 数の ちがい（ステータスと % の OP。とくべつな OP は 一覧で 見る）
const diffOf = (a, b) => { const x = a ? itemStats(a) : {}, y = b ? itemStats(b) : {}, out = [];
  for (const k of new Set([...Object.keys(x), ...Object.keys(y)])) { if (SPECIAL.has(k)) continue; const d = (x[k] || 0) - (y[k] || 0); if (d) out.push([k, d]); }
  return out; };
const nameOf = (k) => SL[k] || OPS[k].label, unit = (k) => (SL[k] ? "" : "%");
const val = (k, v) => `${sign(k === "dmgCut" ? -v : v)}${unit(k)}`;   // 受けるダメージは へる ほど いい（−で 出す）
// 部位の タブ：えらんだ 部位 だけを 出す（縦に ぜんぶ 並べると 分けた 意味が ない。鹿さんの声、2026-10-25）
// 1 行め あたま・くび・うで・あし、2 行め 武器・オフハンド・アクセ。着せかえの 枠を 押しても 同じ 部位に なる
const PARTS = Object.keys(KINDS), PART_LABEL = { acc: "アクセ" };
const kindOf = (e) => baseOf(e.base).slot;
const inF = (e, f) => kindOf(e) === f;
const DOLL = ["head", "weapon", "off", "arm", "neck", "leg"], ACCS = ["acc1", "acc2", "acc3"];
const EMPTY = { off: "オフ\nハンド" };

let ME = mergeAtt(await me()), MP = ME.pets && ME.pets[0];
const V = { f: null, sort: "star", sel: null, slot: null, conf: null, bulk: false, bstar: 2, bhow: "balls", auto: false, ahow: null, rec: null, who: new URLSearchParams(location.search).get("who") || "pet" };
// だれの 装備（鹿さんの決め、2026-10-25）：ペットと パーティの 2 体。部屋に いる 子でも 何か 付けて いれば 出す（はずせる ように）
const mates = () => (ME.tamed || []).filter((c) => (ME.party || []).includes(c.uid) || Object.values(c.equip || {}).some(Boolean));
const holder = () => (V.who !== "pet" && mates().find((c) => c.uid === V.who)) || MP;
const isPet = () => holder() === MP;
const nameOfWho = (w) => (w === "pet" ? MP.name : ((ME.tamed || []).find((c) => c.uid === w) || { name: "なかま" }).name);
const away = (uid) => (ME.trips || []).some((t) => !t.done && t.party.includes(uid));
const SORTS = [["star", "★の多い順"], ["new", "新しい順"]];
// 付けて いる 子：who は "pet" か なかまの uid。me は いま 見て いる 子が 付けて いる
const wornBy = () => { const m = {}, here = isPet() ? "pet" : holder().uid;
  for (const [s, u] of Object.entries((MP && MP.equip) || {})) if (u) m[u] = { who: "pet", slot: s, me: here === "pet" };
  for (const c of ME.tamed || []) for (const [s, u] of Object.entries(c.equip || {})) if (u) m[u] = { who: c.uid, slot: s, me: here === c.uid };
  return m; };
const cur = (s) => (ME.own.equip || []).find((e) => e.uid === (holder().equip || {})[s]);
const equipAct = (who, slot, uid) => (who === "pet" ? act("pet.equip", { slot, uid }) : act("tame.equip", { who, slot, uid }));
// 付ける 枠：アクセサリーは えらんだ 枠 → あいて いる 枠 → 1 つめ（入れかえ）
const slotFor = (kind) => (kind !== "acc" ? kind : V.slot && SLOTS[V.slot].kind === "acc" ? V.slot : ACCS.find((s) => !cur(s)) || "acc1");

function render() {
  const gate = gateHtml(ME, esc); if (gate) return gate;
  const info = petInfo(MP), ty = TYPES[MP.type], own = ME.own.equip || [], W = wornBy(), cap = ME.equipCap || EQUIP_MAX, AS = ME.autoSell;
  const total = {}; for (const s of Object.keys(SLOTS)) { const it = cur(s); if (it) for (const [k, v] of Object.entries(itemStats(it))) total[k] = (total[k] || 0) + v; }
  const sum = Object.entries(total).filter(([k]) => !SPECIAL.has(k)).map(([k, v]) => `${nameOf(k)} <b>${val(k, v)}</b>`).join("・");
  if (!PARTS.includes(V.f)) V.f = PARTS.find((k) => own.some((e) => kindOf(e) === k)) || "head";   // はじめは 持って いる 物が ある 部位
  const vis = own.map((e, i) => ({ e, i })).filter(({ e }) => inF(e, V.f)).sort((a, b) => (V.sort === "new" ? b.i - a.i : b.e.star - a.e.star || b.i - a.i));
  if (!vis.some(({ e }) => e.uid === V.sel)) V.sel = (Object.keys(SLOTS).filter((s) => SLOTS[s].kind === V.f).map(cur).find(Boolean) || (vis[0] || {}).e || {}).uid || null;   // えらぶのは いま 見て いる 部位の 物
  const n = (f) => own.filter((e) => inF(e, f)).length;
  const tile = (s) => { const e = cur(s), lab = SLOTS[s].label, on = V.slot === s ? " on" : "", pos = DOLL.includes(s) ? ` style="grid-area:${s}"` : "";
    return e ? `<button class="sl r${e.star}${on}" data-slot="${s}"${pos} title="${lab}：${esc(baseOf(e.base).name)} ★${e.star}" aria-label="${lab}：${esc(baseOf(e.base).name)}">${gearImg(e.base)}</button>`
      : `<button class="sl none${on}" data-slot="${s}"${pos} aria-label="${lab}：なし">${s.startsWith("acc") ? "" : EMPTY[s] || lab}</button>`; };
  // マス：色は ★、左下に ★、右上に 付けて いる 印（装＝この 子・仲＝なかま）
  const card = ({ e }) => { const w = W[e.uid], nm = esc(baseOf(e.base).name);
    return `<li><button class="tc t${e.star}${w ? " tw-on" : ""}" data-u="${e.uid}" aria-pressed="${e.uid === V.sel}" aria-label="${nm} ★${e.star}${w ? (w.me ? "（そうび中）" : `（${esc(nameOfWho(w.who))}）`) : ""}" title="${nm}"><span class="tn">${nm}</span>${gearImg(e.base, { cls: "hd" })}<span class="ts">${"★".repeat(e.star)}</span>${w ? `<span class="tw${w.me ? "" : " mate"}">${w.me ? "装" : w.who === "pet" ? "ペ" : "仲"}</span>` : ""}</button></li>`; };
  const listHtml = !vis.length ? `<p class="note">${KINDS[V.f].label}の 装備は まだ ない。<a href="dungeon.html">冒険</a>の 宝箱か <a href="bench.html">作業台</a>で 手に 入る</p>` : `<div class="tk list-tk"><ul class="tk-g">${vis.map(card).join("")}</ul></div>`;
  const it = own.find((e) => e.uid === V.sel);
  let det = `<p class="note">まだ 装備が ない。<a href="dungeon.html">冒険</a>の 宝箱か <a href="bench.html">作業台</a>で 手に 入る</p>`;
  if (it) {
    const b = baseOf(it.base), w = W[it.uid], to = slotFor(b.slot), now = cur(to), cmp = now && now.uid !== it.uid ? diffOf(it, now) : null, sy = SYNTH.find((r) => r.main === it.base);
    const here = isPet() ? "pet" : holder().uid, busyAway = away(isPet() ? MP.uid : here) || (w && !w.me && away(w.who === "pet" ? MP.uid : w.who));
    const btn = busyAway ? `<p class="note">出かけて いる あいだは かえられない</p>`
      : w && w.me ? `<button class="jelly light" data-off="${w.slot}">はずす</button>`

      : `<button class="jelly" data-on="${it.uid}">${b.slot === "acc" ? `${SLOTS[to].label}に つける` : "つける"}</button>`;
    det = `<div class="top2"><span class="ico">${gearImg(it.base)}</span>
        <div><h2>${esc(b.name)}<span class="slotname">${KINDS[b.slot].label}</span></h2>${stars(it.star)}</div></div>
      <div class="main"><span>もとの強さ</span><b>${esc(mainLine(it))}</b></div>
      ${it.ops.length ? `<ul class="ops">${it.ops.map((o, i) => `<li class="${SPECIAL.has(o) ? "sp" : ""}">${opLine(it, o, i)}</li>`).join("")}</ul>` : ""}

      ${cmp ? `<div class="cmp"><h3>いまの ${esc(baseOf(now.base).name)} ★${now.star} とくらべると</h3>${cmp.length ? cmp.map(([k, d]) => `<div class="${d > 0 ? "up" : "dn"}"><span>${nameOf(k)}</span><b>${val(k, d)}</b></div>`).join("") : `<p class="note">数は おなじ</p>`}</div>` : ""}
      ${b.slot === "weapon" ? attHtml(ME, it, { away: !!busyAway }) : ""}

  }

  <section class="panel pet" aria-label="ペット">
    <div class="pic"><img src="${info.img}" alt="${esc(info.label)}の${esc(MP.name)}"></div>

  </section>
  <nav class="tabs" role="tablist"><button role="tab" aria-selected="false">ステータス</button><button role="tab" aria-selected="false">スキルツリー</button><button role="tab" aria-selected="false">ガンビット</button><button role="tab" aria-selected="true">装備</button><button role="tab" aria-selected="false">冒険</button><button role="tab" aria-selected="false">なかま</button></nav>
  ${whoHtml()}
  <div class="cols equip-view">
    <section class="panel wear" aria-label="着ているもの">
      <div class="doll"><div class="me">${isPet() ? `<img src="${info.img}" alt="${esc(MP.name)}">` : `<img class="px" src="${spriteURL(holder().tree)}" alt="${esc(holder().name)}">`}</div>${DOLL.map(tile).join("")}</div>
      <div class="side">
        <div class="accs"><small>アクセサリー</small>${ACCS.map(tile).join("")}</div>
        ${sum ? `<div class="sum">装備でふえる分　${sum}</div>` : ""}
        <button class="recbtn" data-rec="1" aria-pressed="${!!V.rec}">✦ おすすめ装備</button>
      </div>
    </section>
    <section class="panel" aria-label="持っている装備" id="list">
      <div class="head"><h2>持っている装備</h2><span class="cnt ${own.length >= cap ? "full" : ""}"><b>${own.length}</b> / ${cap}${own.length >= cap * 0.9 ? `<a href="hideout.html?f=armory">増やす</a>` : ""}</span><button class="bulkbtn" data-bulk="1" aria-expanded="${V.bulk}">まとめて 手放す</button><button class="bulkbtn ${AS ? "on" : ""}" data-auto="1" aria-expanded="${V.auto}">自動で 売る${AS ? `<small>★${AS.star} 以下</small>` : ""}</button></div>
      ${V.bulk ? bulkHtml(own, W) : V.auto ? autoHtml() : ""}
      <div class="ptabs" role="tablist" aria-label="部位">${PARTS.map((k) => `<button role="tab" data-f="${k}" aria-selected="${V.f === k}" class="${n(k) ? "" : "zero"}">${PART_LABEL[k] || KINDS[k].label}<small>${n(k)}</small></button>`).join("")}</div>
      <div class="filters sorts" role="group" aria-label="ならべる"><span>ならべる</span>${SORTS.map(([k, l]) => `<button data-sort="${k}" aria-pressed="${V.sort === k}">${l}</button>`).join("")}</div>
      ${listHtml}
    </section>
    <aside class="panel detail ${it && !V.rec ? `r${it.star}` : ""}" aria-label="${V.rec ? "おすすめ装備" : "えらんだ装備"}" id="det">${det}</aside>
  </div>`;
}
// ---------- おすすめ装備（鹿さんの頼み、2026-10-25）：えらび方 3 つ・この 子／パーティ 全員。ほかの 子の 物も 外して 使う。くらべて から 付ける ----------
// 計算は recommend.js（門番の equip.best も 同じ）。強さは 闘技場と 同じ fighterPower
const whoKey = (x) => (x === MP ? "pet" : x.uid);
const formOf = (x) => (x === MP ? MP.build : petAt(x.type, x.lv, { main: x.tree }));   // 装備なしの 戦う 形（なかまは 門番の tamedOf と 同じ）
const itemsOf = (set) => Object.values(set || {}).filter(Boolean).map((u) => (ME.own.equip || []).find((e) => e.uid === u)).filter(Boolean);
const powerWith = (x, set) => fighterPower({ ...formOf(x), equip: itemsOf(set) });
const RS = { off: "オフハンド", acc1: "アクセ 1", acc2: "アクセ 2", acc3: "アクセ 3" };   // くらべる 一覧の 枠の 名前（短く）
const recMode = () => { try { const m = localStorage.getItem("ml-rec-mode"); return REC_MODES.some(([k]) => k === m) ? m : "job"; } catch (e) { return "job"; } };
function recPlan() {
  const R = V.rec, all = [MP, ...(ME.tamed || [])], party = [MP, ...(ME.party || []).map((u) => (ME.tamed || []).find((c) => c.uid === u)).filter(Boolean)];
  const targets = R.scope === "party" ? party : [holder()], gone = (x) => away(x.uid);
  if (targets.some(gone)) return { targets, away: true };
  const locked = new Set(all.filter(gone).flatMap((x) => Object.values(x.equip || {}).filter(Boolean)));
  const chars = targets.map((x) => ({ who: whoKey(x), type: x.type, stats: formOf(x).stats, equip: { ...(x.equip || {}) } }));
  const W = {}; for (const x of all) for (const [s, u] of Object.entries(x.equip || {})) if (u) W[u] = { who: whoKey(x), name: x.name };
  const plan = recommend(chars, ME.own.equip || [], R.mode, locked);
  return { targets, chars, plan, rows: recDiff(plan, chars, W), W };
}
// どこを 重く 見たか（1 行）：職業は 伸び方の 上位、弱点は 重みの 上位
const recWhy = (R, ch) => { if (R.mode === "power") return "強さの 数字が いちばん 上がる 組み合わせ"; const w = recWeights(R.mode, ch), top = Object.entries(w).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => SL[k]).join("・");
  return R.mode === "job" ? `${TYPES[ch.type] ? TYPES[ch.type].label : ""}は ${top} を 重く` : `低い 能力（${top}）を 重く`; };
function recHtml() {
  const R = V.rec, P = recPlan(), many = (ME.party || []).length > 0;
  const chip = (k, v, label) => `<button data-rk="${k}" data-rv="${v}" aria-pressed="${R[k] === v}">${label}</button>`;
  const head = `<div class="rec"><h2>おすすめ装備</h2>
    <div class="brow"><span>えらび方</span>${REC_MODES.map(([k, l]) => chip("mode", k, l)).join("")}</div>
    ${many ? `<div class="brow"><span>だれ</span>${chip("scope", "one", esc(holder().name))}${chip("scope", "party", "パーティ 全員")}</div>` : ""}`;
  const close = `<button class="jelly light" data-recx="1">とじる</button>`;
  if (P.away) return `${head}<p class="note">出かけて いる あいだは かえられない</p><div class="btns">${close}</div></div>`;
  // かわる 枠：外す 物は 絵だけ（うすく）、付ける 物は 名前も。上がり幅の 大きい 4 枠を 出して、のこりは たたむ（情報を 出しすぎない）
  const eq = (u) => (ME.own.equip || []).find((x) => x.uid === u), gain = (r) => (r.to ? itemPower(eq(r.to)) : 0) - (r.from ? itemPower(eq(r.from)) : 0);
  const pic = (u) => { const e = eq(u); return e ? `<span class="gi r${e.star}" title="${esc(baseOf(e.base).name)} ★${e.star}">${gearImg(e.base)}</span>` : `<span class="gn none">なし</span>`; };
  const row = (r) => { const e = r.to && eq(r.to);
    return `<li><span class="rs">${RS[r.slot] || SLOTS[r.slot].label}</span><span class="rf">${pic(r.from)}</span><span class="ar" aria-label="から">→</span><span class="rt">${e ? `${pic(r.to)}<span class="gn">${esc(baseOf(e.base).name)}<i>★${e.star}</i></span>` : `<span class="gn none">はずす</span>`}</span>${r.took ? `<small>${esc(P.W[r.to].name)}から 外す</small>` : ""}</li>`; };
  const blocks = P.targets.map((x, i) => { const p = P.plan[i], rows = P.rows.filter((r) => r.who === p.who).sort((m, n) => gain(n) - gain(m)), b = powerWith(x, x.equip), a = powerWith(x, p.set), top = rows.slice(0, 4), more = rows.slice(4);
    return `<div class="rwho"><div class="rh"><b>${esc(x.name)}</b><span>強さ ${b} → <b class="${a > b ? "up" : a < b ? "dn" : ""}">${a}</b>${a !== b ? `（${sign(a - b)}）` : ""}</span></div>
      <p class="rwhy">${esc(recWhy(R, P.chars[i]))}</p>${rows.length ? `<ul class="rrows">${top.map(row).join("")}</ul>${more.length ? `<details class="rmore"><summary>ほか ${more.length} 枠</summary><ul class="rrows">${more.map(row).join("")}</ul></details>` : ""}` : `<p class="note">いまが いちばん</p>`}</div>`; }).join("");

async function recGo(b) {

// ---------- ブランクコア（鹿さんの決め、2026-10-25）：OP を 抜く（装備は なくなる）・コアを 付ける（あいて いる 枠へ・いっぱいなら 入れかえ） ----------

  if (mode === "set") {

    body = busyAway ? `<small>出かけて いる あいだは かえられない</small>` : `<div class="crow">${cs.map((x) => `<button data-csel="${x.uid}" aria-pressed="${!!c && c.uid === x.uid}">${esc(coreName(x))}</button>`).join("")}</div>`;
    if (c && !busyAway) {

          <small>${n ? (dupAt >= 0 ? `${esc(OPS[c.op].label)}は もう 付いて いる（同じ OP と 入れかえ）` : "OP の 枠が いっぱい。はずれた OP は 消える") : "この 装備には OP の 枠が ない"}</small>`;
    }

      <button data-cmode="take" aria-pressed="${mode === "take"}" ${bn ? "" : "disabled"}>OP を 抜く</button><button data-cmode="set" aria-pressed="${mode === "set"}" ${cs.length ? "" : "disabled"}>コアを 付ける</button></div>${body}</div>`;

async function doCore(b, a, body, done) {
  const r = await busy(b, () => act(a, body));

  if (!r.ok) { paint(); return toast(r.wait ? waitText : r.why || "できませんでした"); }
  ME = mergeAtt(await me()); MP = ME.pets[0]; done(r); paint();

// ---------- 手放す（鹿さんの決め、2026-10-25）：玉・クレジットで 売る・リサイクルで 素材に。押し まちがえない ように 2 回 押す ----------
const HOW = { balls: "玉で 売る", credits: "クレジットで 売る", recycle: "リサイクル" };

function scrapHtml(it) {

  return `<div class="scrap"><span class="sh">手放す</span>${b("balls", `玉 ${SCRAP_BALLS[it.star]}`)}${b("credits", `クレジット ${SCRAP_CREDITS[it.star]}`)}${b("recycle", `素材 ${rc.n + rc.hidden} こ`)}

// まとめて：★N 以下（付けて いる 物・ミシック・合成の 装備は 入れない）
function bulkPick(own, W) {
  const low = own.filter((e) => e.star <= V.bstar), pick = low.filter((e) => !W[e.uid] && !keepInBulk(e));
  return { pick, worn: low.filter((e) => W[e.uid]).length, keep: low.filter((e) => !W[e.uid] && keepInBulk(e)).length };
}
function bulkHtml(own, W) {
  const { pick, worn, keep } = bulkPick(own, W), n = pick.length;
  const value = V.bhow === "balls" ? `玉 ${pick.reduce((a, e) => a + SCRAP_BALLS[e.star], 0).toLocaleString("ja-JP")} で 売る` : V.bhow === "credits" ? `クレジット ${pick.reduce((a, e) => a + SCRAP_CREDITS[e.star], 0).toLocaleString("ja-JP")} で 売る` : `素材 ${pick.reduce((a, e) => { const r = recycleOf(e); return a + r.n + r.hidden; }, 0)} こに する`;
  const out = [worn ? `付けて いる ${worn} こ` : "", keep ? `ミシック・合成 ${keep} こ` : ""].filter(Boolean).join("・");
  return `<div class="bulk" role="group" aria-label="まとめて 手放す">
    <div class="brow"><span>この ★ 以下</span>${[1, 2, 3, 4, 5].map((k) => `<button data-bstar="${k}" aria-pressed="${V.bstar === k}">★${k}</button>`).join("")}</div>
    <div class="brow"><span>手放し方</span>${Object.entries(HOW).map(([k, l]) => `<button data-bhow="${k}" aria-pressed="${V.bhow === k}">${l}</button>`).join("")}</div>
    <p class="bn"><b>${n}</b> こ（すべての 部位）${out ? `・${out}は 入れない` : ""}</p>
    <button class="jelly ${V.conf === "bulk" ? "warn" : ""}" data-bulkgo="1" ${n ? "" : "disabled"}>${V.conf === "bulk" ? `もう一度 押すと ${n} こ 手放す` : `${n} こを ${value}`}</button></div>`;
}
// 自動で 売る（鹿さんの頼み、2026-10-25）：派遣で 拾った ★N 以下の 装備を、持ち物に 入れずに 売る。もらう 物も えらぶ。押すと すぐ しまう
function autoHtml() {
  const A = ME.autoSell, how = V.ahow || (A && A.how) || "credits";
  return `<div class="bulk auto" role="group" aria-label="自動で 売る">
    <div class="brow"><span>この ★ 以下</span><button data-astar="0" aria-pressed="${!A}">しない</button>${AUTO_SELL_STARS.map((k) => `<button data-astar="${k}" aria-pressed="${!!A && A.star === k}">★${k}</button>`).join("")}</div>
    <div class="brow"><span>もらう 物</span>${Object.entries(HOW).map(([k, l]) => `<button data-ahow="${k}" aria-pressed="${how === k}">${l}</button>`).join("")}</div>
    <p class="bn">派遣で 拾った 物だけ・ミシックなどは 売らない</p></div>`;
}
async function setAuto(b, star, how) {
  const r = await busy(b, () => act("equip.auto", { star, how }));
  if (!r.ok) { paint(); return toast(r.wait ? waitText : r.why || "できませんでした"); }
  ME.autoSell = r.autoSell; V.ahow = how; paint();
  toast(r.autoSell ? `派遣で 拾った ★${r.autoSell.star} 以下を ${HOW[r.autoSell.how]}` : "自動で 売るのを やめた");

async function doScrap(b, uids, how) {
  const r = await busy(b, () => act("equip.scrap", { how, uids }));
  V.conf = null;
  if (!r.ok) { paint(); return toast(r.wait ? waitText : r.why || "できませんでした"); }

  toast(how === "recycle" ? `${r.n} こ リサイクル：素材 ${r.mats.reduce((a, m) => a + m.n, 0)} こ${r.boxed ? `（あずかり箱に ${r.boxed} こ）` : ""}` : `${r.n} こ 売った：${how === "balls" ? "玉" : "クレジット"} ${r.value.toLocaleString("ja-JP")}`);

// だれの 装備：ペット ＋ なかま（いなければ 出さない）
function whoHtml() {
  const ms = mates(); if (!ms.length) return "";
  const b = (w, img, name, px, note) => `<button data-who="${w}" aria-pressed="${(isPet() ? "pet" : holder().uid) === w}"><img class="${px ? "px" : ""}" src="${img}" alt="">${esc(name)}${note ? `<small>${note}</small>` : ""}</button>`;
  return `<div class="whos" role="group" aria-label="だれの 装備">${b("pet", petInfo(MP).img, MP.name, false, "")}${ms.map((c) => b(c.uid, spriteURL(c.tree), c.name, true, (ME.party || []).includes(c.uid) ? "" : "部屋")).join("")}</div>`;

function paint() { document.getElementById("app").innerHTML = render(); linkTabs(); const tk = document.querySelector("#list .tk"); if (tk) padGrids(tk); }
addGateCss(); addTkCss(); watchPad(() => document.querySelector("#list .tk"));
const small = () => matchMedia("(max-width:820px)").matches;
document.body.addEventListener("click", async (e) => {
  if (e.target.id === "dim") { V.rec = null; document.body.classList.remove("sheet-on"); return paint(); }

  if (await attClick(b, ME, async (fresh) => { if (fresh) { ME = mergeAtt(await me()); MP = ME.pets[0]; } paint(); }, toast)) return;   // アタッチメント
  if (!d.scrap && !d.bulkgo && d.ctake == null && d.cset == null && V.conf) V.conf = null;   // ほかを 押したら 2 回めの 待ちを やめる
  if (d.scrap) { const k = `${d.su}:${d.scrap}`; if (V.conf !== k) { V.conf = k; return paint(); } return doScrap(b, [d.su], d.scrap); }

  if (d.rk) { V.rec[d.rk] = d.rv; if (d.rk === "mode") try { localStorage.setItem("ml-rec-mode", d.rv); } catch (x) {} return paint(); }
  if (d.recx) { V.rec = null; document.body.classList.remove("sheet-on"); return paint(); }
  if (d.recgo) return recGo(b);
  if (d.bulk) { V.bulk = !V.bulk; V.auto = false; return paint(); }
  if (d.auto) { V.auto = !V.auto; V.bulk = false; return paint(); }
  if (d.astar) return setAuto(b, +d.astar, V.ahow || (ME.autoSell && ME.autoSell.how) || "credits");
  if (d.ahow) { if (!ME.autoSell) { V.ahow = d.ahow; return paint(); } return setAuto(b, ME.autoSell.star, d.ahow); }   // しない の ときは えらぶ だけ

  if (d.bhow) { V.bhow = d.bhow; return paint(); }
  if (d.bulkgo) { if (V.conf !== "bulk") { V.conf = "bulk"; return paint(); } return doScrap(b, bulkPick(ME.own.equip || [], wornBy()).pick.map((e) => e.uid), V.bhow); }

  if (d.ctake != null) { const k = `${V.sel}:core:${d.ctake}`; if (V.conf !== k) { V.conf = k; return paint(); }

    const e2 = cur(d.slot) || (ME.own.equip || []).filter((x) => kindOf(x) === V.f && !W[x.uid]).sort((x, y) => y.star - x.star)[0]; if (e2) V.sel = e2.uid;
    paint(); if (small()) { if (cur(d.slot)) document.body.classList.add("sheet-on"); else document.getElementById("list").scrollIntoView({ behavior: "smooth", block: "start" }); } return;   // スマホ：付けて いれば シート、あきなら 一覧へ
